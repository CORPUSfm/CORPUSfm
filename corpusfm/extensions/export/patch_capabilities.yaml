        evidence: [layout_props_only_rename]
      - claim: Add an object through whole-layout Replace
        builds: {"26.0.3.309": collateral/rendered}
        note: The object appears, with the whole-layout identity regeneration above.
        evidence: [add_obj_via_whole_replace]
    behavior: >
      <ReplaceAction><Replace type="Layout" UUID="<Layout/UUID>"><Layout …complete…/></Replace>
      </ReplaceAction> (NO LayoutCatalog wrapper) applied the intended edits — rename, text change,
      an added object, body-part resize, table-occurrence context — and kept the layout's UUID, so
      inbound references follow a rename. But every LayoutObject came back with a NEW UUID and id
