  - id: fm2026-crossfile-script-steps-need-matching-explicit-id
    title: Adding a script WITH steps cross-file needs a matching, non-colliding explicit id on both actions
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "26.0.1.68"
    date: "2026-06-15"
    behavior: >
      A normalized script add is TWO AddActions — <ScriptCatalog><Script> (the shell) and
      <StepsForScripts><Script><ScriptReference/><ObjectList> (the steps), linked by id. Applying a
      script-with-steps into a DIFFERENT file than it came from, the OUTCOME depends entirely on the
      ids (live-tested on CORPUSfm_Playground1, host+export read-back each time):
        • Script id="0" + steps ScriptReference id="0"/stale-id/UUID  → script SHELL lands, ALL
          STEPS DROP (empty script). FM reassigns the id="0" script's id on add, so the steps
          ScriptReference no longer resolves to it.
        • steps ScriptReference NAME-ONLY (no id)                     → SHELL lands, steps DROP.
          FMUpgradeTool does NOT resolve StepsForScripts→Script by name.
        • MATCHING explicit non-colliding id on BOTH (e.g. id="990001" on the catalog Script AND on
          the steps ScriptReference) → ALL steps land with full fidelity. FMUpgradeTool RESPECTS a
          stated non-zero AddAction id (does not always reassign) and links steps to the shell BY ID.
      The same-file ISV flow works because the source script's id is carried on both actions and does
      not collide with the target lineage; cross-file injection can collide, so the id must be remapped.
    implication: >
      CODE: generate_patch emits the source script's own id on both actions — correct for same-file
      ISV upgrades, but for CROSS-FILE injection (roadmap #1/#2 origination) the added script must be
      remapped to a guaranteed-free id on BOTH the ScriptCatalog Script and the StepsForScripts
      ScriptReference, or the steps silently drop. id="0" and name-only are NOT viable for a
      script-with-steps cross-file add.
    ai_guidance: >
      When a patch ADDS a script that has steps into a file the script did not come from, give the
      script a single explicit id that is NOT used by any existing script in the target, and put that
      SAME id on both the <Script> (in ScriptCatalog) and the <ScriptReference> (in StepsForScripts).
      Do NOT use id="0" or a name-only ScriptReference for a script-with-steps add — the steps will
      silently drop and the script lands empty.

