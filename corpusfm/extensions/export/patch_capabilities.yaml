  - id: layout-replace-whole-version-dependent
    title: Whole-layout Replace lands on 26.0.3.309 only, and rebuilds every object's identity
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "26.0.3.309"
    date: "2026-10-27"
    scope: >
