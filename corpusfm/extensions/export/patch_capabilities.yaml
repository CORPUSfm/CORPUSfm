  - id: fm2026-generate-db-file-materializes
    title: --generateDBFile builds a working .fmp12 directly from a SaveAsXML export
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "26.0.1.68"
    date: "2026-06-15"
    behavior: >
      Resolves the fm2026-generate-db-file open question. `FMUpgradeTool --generateDBFile
      -src_path <SaveAsXML.xml>` produces a .fmp12 next to the source (no -dest_path arg; -force
      to overwrite) in ~1s — a 373 KB schema XML -> a 258 KB .fmp12. The input is a normal
      FMSaveAsXML export (the same artifact CORPUSfm ingests), NOT a patch. Brand-new 2026
      capability (absent in 22.x). The generated file HOSTS cleanly (NORMAL status) on FMS —
      proven 2026-06-16 by host+open read-back (see fm2026-generate-db-file-minimal-envelope).
    implication: >
      FMUpgradeTool 2026 can MATERIALIZE a FileMaker file from a SaveAsXML headlessly. Directly
      enables roadmap #1 (cross-file reconstruction stub -> buildable .fmp12) and #2 (fresh-file
      origination -> a real file from a composed/assembled SaveAsXML) without FileMaker Pro.
    ai_guidance: >
      To turn a SaveAsXML into a .fmp12, use FMUpgradeTool --generateDBFile -src_path <xml>
      (2026 only) — or the generate_db_file MCP tool. Output lands beside the source; verify by
      hosting before relying on it.

  - id: fm2026-generate-db-file-minimal-envelope
    title: A minimal reconstruction-emitted SaveAsXML materializes + hosts NORMAL
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "26.0.1.68"
    date: "2026-06-16"
    behavior: >
      --generateDBFile accepts a MINIMAL but complete FMSaveAsXML and produces a NORMAL-hosting
      .fmp12. Proven live on fms-server: render_stub_saveasxml (the cross-file reconstruction
      origination emitter) produced a 5,194-byte SaveAsXML carrying only a root
      <FMSaveAsXML version="2.2.3.0" Has_DDR_INFO="True"> + one <Structure><AddAction> wrapping
      BaseTableCatalog + TableOccurrenceCatalog + FieldsForTables (named fields only, fresh
      UUIDs, no accounts/privileges/themes/layouts). --generateDBFile turned it into a
      24,576-byte .fmp12 that fmsadmin opened to NORMAL status. So the full envelope FM exports
      is NOT required — base tables + a Local TO each + named fields suffice to materialize a
      hostable file. CAVEAT: OData/$metadata read-back of the materialized file returns 802 —
      a freshly materialized file's default account carries no fmodata extended privilege, and
      a reconstruction stub emits no AccountsCatalog by design (an explicit blind spot). The
      file HOSTS; OData access needs the developer to add an account with fmodata.
    implication: >
      Roadmap #1 origination path is closed end-to-end: emit_reconstruction_stub(fmt="saveasxml")
      -> generate_db_file(source_xml=...) materializes a hostable file from recovered tables/fields.
      The materialized file is a SCAFFOLD (fresh UUIDs, no relink) — the developer rewires the
      siblings by the recovered KEY names and adds accounts/privileges, exactly as the stub states.
    ai_guidance: >
      To materialize a missing/reconstructed file, call emit_reconstruction_stub(fmt="saveasxml")
      then generate_db_file(source_xml=<that>). The result hosts but is not OData-readable until an
      account with the fmodata extended privilege is added (reconstruction emits no accounts).

  - id: fm2026-validatepatch-requires-src
