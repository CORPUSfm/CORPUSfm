# FMUpgradeTool capability ledger — empirically-mapped behaviors and limits.
#
# Single source of truth for what FMUpgradeTool can and cannot do, HOW each
# claim was verified, and the tool version it was verified against. Two
# consumers: a human reviewer reads this file; the patch-AI system prompt
# renders render_capability_guidance() (capabilities.py) so generation respects
# known limits instead of guessing.
#
# Behavior is TOOL-VERSION-SPECIFIC (like FM step IDs in mappings.yaml). Always
# tag tool_version and re-verify on a new FMUpgradeTool build. A probe must
# terminate in a change here: promote an open_question to an entry, refute an
# entry, or refine the question. Keep `status` and `verified_via` honest —
# "inferred" is not "verified".
#
# status_values:   verified | refuted | inferred | unknown
# verified_via:    live-apply | inference | doc
# category_values: apply-semantics | grammar | limitation | operational

tool: FMUpgradeTool
patch_format_version: "2.2.3.0"
verified_tool_versions:
  - "22.0.6.600"
  - "26.0.1.68"   # FM Server 2026 (04-30-2026); re-probed 2026-06-14 — see fm2026-* entries
  - "26.0.3.309"  # FM Server 2026 on fms-dev (08-26-2026); layout probes 2026-10-27 — see layout-* entries (packet 1427)

entries:
  - id: replace-targets-by-uuid
    title: ReplaceAction targets by UUID, not by name
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-05-28"
    behavior: >
      A ReplaceAction matches the existing object by its FM UUID. A different
      name in the ScriptReference renames the object in place, preserving inbound
      UUID references from callers.
    implication: >
      generate_patch detects renames (same UUID across the added/removed sets)
      and emits a single ReplaceAction instead of a broken Delete+Add.
    ai_guidance: >
      To rename or rewrite an existing object, target it by its id/UUID from
      SCHEMA CONTEXT; never Delete+Add to rename (it breaks caller references).

  - id: replace-objectlist-full-replacement
    title: A script ReplaceAction ObjectList is a FULL replacement
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-05-28"
    behavior: >
      The ObjectList in a script ReplaceAction wholly replaces the script's
      steps. An empty ObjectList wipes all steps.
    implication: >
      _build_replace always includes the complete StepsForScripts ObjectList.
    ai_guidance: >
      For a ReplaceAction on a script, always emit the COMPLETE new step list; a
      partial list deletes every step you omit.

  - id: script-folder-nesting
    title: Script folders nest from positional open/script ordering
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-03"
    behavior: >
      An added folder-open <Script isFolder="True"> emitted before a script's
      AddAction, in document order, nests that script into the folder. The tool
      reconstructs membership from POSITION, not a parent id.
    evidence: >
      E1/E2 sweep on fms-server (Dev CORPUSfm_Addon_Development -> Var
      CORPUSfm_Addon_DevVarient): resulting TestDummyScript.folder_path =
      ['TestDummyFolder'].
    implication: >
      generate_patch (_emit_foldered_additions) emits added folder-opens before
      their child scripts in document order.
    ai_guidance: >
      To add a script inside a NEW folder, emit the folder-open entry first,
      then the script, in document order.

  - id: script-folder-close-bounds
    title: A close marker is required to BOUND a folder
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-03"
    behavior: >
      An unclosed folder runs to the end of the catalog. Without an
      isFolder="Marker" close after its contents, a later added root-level item
      is captured into the folder; with the close, the next item stays at root.
    evidence: >
      Bounding pair on fms-server (folder+script+[close?]+trailing-root-script):
      without close, RootAfterScript.folder_path = ['TestDummyFolder']; with
      close, [].
    implication: >
      _emit_foldered_additions emits the matching close marker after an added
      folder's children.
    ai_guidance: >
      After a new folder's scripts, emit the folder-close marker
      (isFolder="Marker", name "--") so the following items are not swallowed.

  - id: preexisting-folder-insert-lands-at-root
    title: A script added to a PRE-EXISTING folder lands at root
    category: limitation
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-03"
    behavior: >
      AddAction appends to the catalog. A script added into a folder that
      already exists in the target file lands at the catalog ROOT — there is no
      patch-level way to re-insert it into an already-closed folder span.
    implication: >
      generate_patch emits the script (it is not lost) but cannot fold it into
      the existing folder; coverage now flags it with a caveat reason (via
      coverage_gate.preexisting_folder_caveat). Candidate for an fmClip fallback
      (drop the snippet into the folder by hand).
    ai_guidance: >
      You CANNOT place a new script inside a folder that ALREADY EXISTS in the
      target file. If the requested folder already exists, add the script at root
      and note the limitation in a MISSING comment; never fabricate the nesting.

  - id: account-delete-unsupported
    title: Accounts cannot be deleted via patch
    category: limitation
    status: verified
    verified_via: inference
    tool_version: "22.0.6.600"
    behavior: >
      Account objects cannot be removed by a DeleteAction.
    implication: >
      coverage_gate blocks AccountsCatalog deletion (not_patchable); consumed by
      _build_delete.
    ai_guidance: >
      Never emit a DeleteAction for an account; it is not supported.

  - id: builtin-privset-delete-unsupported
    title: Built-in privilege sets cannot be deleted
    category: limitation
    status: verified
    verified_via: inference
    tool_version: "22.0.6.600"
    behavior: >
      The four built-in privilege sets ([Full Access], [Data Entry Only],
      [Read-Only Access], [No Access]) cannot be removed by a DeleteAction.
    implication: >
      coverage_gate blocks built-in privilege-set deletion; consumed by _build_delete.
    ai_guidance: >
      Never emit a DeleteAction for a built-in privilege set.

  - id: validatepatch-requires-src-path
    title: --validatePatch requires -src_path even for plaintext
    category: operational
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    behavior: >
      On 22.0.6.600, --validatePatch still requires a -src_path argument even
      for an unencrypted patch.
    implication: >
      Validation tooling must supply a source .fmp12 path.

  - id: linux-run-as-fmserver-home
    title: On Linux, run as fmserver with a writable HOME/XDG_CACHE_HOME
    category: operational
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    behavior: >
      FMUpgradeTool must run as the fmserver user with a writable HOME and
      XDG_CACHE_HOME (Fontconfig), and operates on a CLOSED .fmp12. Otherwise it
      reports a misleading 802/20402 "File permission problem". corpusfm/corpusfm
      (Full Access) suffices for --update.
    implication: >
      The apply path closes the file, copies it, and runs the tool as fmserver.

  - id: field-addaction-applies
    title: AddAction adds a field (with its BaseTable ReplaceAction) cleanly
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      A FieldsForTables AddAction (FieldCatalog + BaseTableReference + ObjectList
      with the <Field>) adds a new field to an existing table; the accompanying
      BaseTable ReplaceAction that generate_patch emits applies fine and existing
      fields are preserved. Verified live on a playground (Probe 0): generated
      patch from a real A/B diff, applied, hosted, the new field appears in OData
      $metadata; all pre-existing fields intact.
    implication: >
      Field additions are a supported, generate_patch-able operation — extends the
      verified set beyond scripts to fields.
    ai_guidance: >
      Adding fields is safe to express as a FieldsForTables AddAction.

  - id: field-autoenter-and-calc-apply-and-function
    title: Added auto-enter calc + calculation fields apply AND functionally work
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      An AddAction field carrying an <AutoEnter type="Calculated"> with a Get(UUID)
      calc, and a separate fieldtype="Calculated" field (Upper(CreatedBy)), both
      applied and FUNCTIONED after hosting: inserting a record sans the auto-enter
      field returned it populated with a fresh UUID; the calc field computed
      "HELLO" from CreatedBy="hello". Verified behaviorally over OData (Probes 1+2).
      These are exactly the features OData/ODBC DDL CANNOT create — FMUpgradeTool
      reaches the native schema, so it can.
    implication: >
      FMUpgradeTool can add the auto-enter/calculation fields OData can't. The
      construction-template gap (docs/completeness-audit.md) is the only thing
      standing between this and CORPUSfm authoring such fields.
    ai_guidance: >
      Auto-enter and calculation fields ARE expressible/applicable as field
      AddActions — they are not a tool limitation, only an authoring-grammar gap.

  - id: calc-ddrref-not-required
    title: Hand-authored calc fields need only <Text>, not the DDRREF chunk hash
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      Real FM calc XML carries a <DDRREF kind="ChunkList" hash="..."> alongside the
      <Calculation><Text>. The auto-enter and calc fields in Probes 1+2 were
      authored with the <Text> (and a valid <TableOccurrenceReference> context) but
      WITHOUT any DDRREF, and both applied and functioned — FM recompiles the calc
      from the Text. The DDRREF is FM's compiled-chunk cache, not an input.
    implication: >
      A patch generator (or the AI) can author calc/auto-enter fields from the calc
      text + a TO-context reference alone; it does NOT need to reproduce FM's
      internal chunk hashes. Removes the biggest perceived obstacle to authoring
      calc-bearing objects.
    ai_guidance: >
      When authoring a calculation, emit <Calculation><TableOccurrenceReference/>
      <Text>…</Text></Calculation>; omit DDRREF.

  - id: field-replace-typechange-nonfunctional
    title: A field ReplaceAction that changes type (Normal -> Calculated) applies but does not function
    category: limitation
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      Replacing an existing Normal field (by UUID) with a Calculated definition
      (Probe 3) reported "Patch File Applied" but produced a NON-functional field:
      it never returned the new calc value ("REPLACED_VALUE") — old records read a
      stale value, new records read empty. Sharp contrast with the clean field
      AddAction (Probes 1+2). The structure used was CORPUSfm's _build_replace
      output: a bare <Field> inside <Replace type="Field" UUID="…"> with NO
      FieldsForTables/BaseTableReference context (the prime suspect), so this is not
      yet a proven hard tool limit.
    implication: >
      Do NOT rely on field ReplaceAction for type-changing edits. Prefer Add for new
      behavior. Field rename/in-place edits (no type change) are still unprobed.
    ai_guidance: >
      Avoid expressing a Normal->Calculated change as a field ReplaceAction; it
      applies silently but leaves the field non-functional.
    follow_up: >
      Re-probe field Replace WITH a FieldsForTables/FieldCatalog/BaseTableReference
      wrapper, and a same-type Replace (e.g. change a calc's Text only), to separate
      a CORPUSfm _build_replace structure bug from a genuine tool limitation.

  - id: field-addaction-minimal-refs
    title: Field AddActions need only id+name refs — no UUID, no BaseTable Replace, multi-field OK
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      A field AddAction applies and FUNCTIONS with the minimal form: BaseTableReference
      and TableOccurrenceReference carry only id + name (NO UUID); the field AddAction
      stands ALONE (no companion BaseTable ReplaceAction); multiple <Field> objects in
      one ObjectList all land. Verified live (2026-06-04) on a clean playground: a two-
      field patch (auto-enter Get(UUID) + a Upper(CreatedBy) calc, both id+name refs,
      no DDRREF, no BaseTable Replace) applied → ProbeAuto auto-populated a UUID on
      insert, ProbeCalc computed "HELLO". This SIMPLIFIES the earlier Probe-1/2 recipe
      (which redundantly carried UUIDs + a BaseTable Replace).
    implication: >
      This minimal grammar IS the field construction template
      (corpusfm/extensions/export/construction.py), surfaced into patch_ai's system
      prompt. The AI authors field AddActions from id+name in SCHEMA CONTEXT — no UUID
      enrichment of schema_context required. Closes the construction-template gap for
      fields (docs/completeness-audit.md).
    ai_guidance: >
      To add a field, emit a FieldsForTables AddAction with id+name references only;
      do not add a BaseTable ReplaceAction or any UUID/DDRREF.

  - id: intra-patch-ordering-required
    title: A referenced object MUST precede its referrer within the same patch
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      FMUpgradeTool processes AddActions in DOCUMENT ORDER and does not pre-resolve
      forward references. Probe 4 (live): a patch adding a new TableOccurrence + a
      Relationship that uses it — with the TO AddAction FIRST — produced a relationship
      whose endpoints both resolved (PG_Two + Playground1). The SAME patch with the
      Relationship FIRST and the TO second produced a relationship with a DANGLING
      endpoint (['Playground1', '']) — the forward reference to the not-yet-added TO did
      not resolve. So order is load-bearing. (This is Use Case 4's Q1.)
    implication: >
      When authoring a multi-object patch, emit the referenced object before any object
      that references it: TO before its relationship; a called script before its caller;
      a field before a script that sets it.
    ai_guidance: >
      Order AddActions referent-first. Never reference an object earlier in the patch
      than where it is added.

  - id: new-object-refs-by-name-generic-catalogs
    title: Generic-catalog adds (TO, Relationship) apply; new in-patch objects bind by NAME
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      A generic catalog AddAction — <AddAction><TableOccurrenceCatalog><TableOccurrence
      id="0" .../></TableOccurrenceCatalog></AddAction>, and likewise <RelationshipCatalog>
      <Relationship id="0">…</Relationship></RelationshipCatalog> — applies and creates the
      object (Probe 4). FMUpgradeTool REASSIGNS both the integer id (0 → real) AND the UUID
      of a new object (the AAAA/BBBB UUIDs I supplied were replaced). So a later object in
      the same patch references a just-added object by NAME (the TableOccurrenceReference
      name= matched the new TO); id (still 0) and any supplied UUID are not the binding.
      A TO references its base table via BaseTableSourceReference/BaseTableReference; a
      Relationship uses LeftTable/RightTable (TableOccurrenceReference) + JoinPredicateList/
      JoinPredicate(type="Equal")/LeftField+RightField (FieldReference id=<field id> + a
      nested TableOccurrenceReference).
    implication: >
      Construction templates for relationships/TOs reference new in-patch objects by
      name, supply id="0", and need not assign UUIDs. Combine with intra-patch-ordering
      -required: emit the TO, then the relationship.
    ai_guidance: >
      Add a TableOccurrence with id="0" and a name; reference it from a later
      relationship by that name (not by id or UUID). Emit the TO before the relationship.

  - id: layout-add-object-hash-recomputed
    title: A whole new LAYOUT (incl. a button→script) applies; object hashes are recomputed
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      Probe 5 (live, Playground1): a <AddAction><LayoutCatalog><Layout id="0" name=…>
      …</Layout></LayoutCatalog></AddAction> creates a whole new layout. Each
      <LayoutObject> carries a `hash` attribute that real exports compute; supplying a
      32-char ALL-ZEROS placeholder applied fine and FM REPLACED it with a real hash on
      open (fake 000…0 came back as A6791FD5…/D3CEC4AE…) — so the layout-object hash is
      NOT an authoring input, exactly like calc DDRREFs. A Button LayoutObject
      (type="Button" kind="10") whose <action><ScriptReference id name UUID/> targets an
      EXISTING script applied and the button→script wiring survived in the hosted DB.
      The layout's context is a <TableOccurrenceReference> (existing TO). The button's
      <ScriptReference> needs only id + name — Probe L4 (live): supplying it with NO UUID
      applied and FM RESOLVED the script and filled the UUID itself (came back
      UUID="58F55335-…"). So, like fields/TOs, the bind is by id/name, not UUID.
      validatePatch needs -src_account/-src_pwd (CORPUSfm/CORPUSfm here) or it errors 212;
      --update is the real signal.
    implication: >
      Layout-object construction is feasible (it was the suspected blocker — the hash is
      not). The AI can author a new layout with text + a script-running button using
      placeholder hashes and no DDRREF. SCOPE: this ADDS a new layout. Injecting an
      object into an EXISTING layout was probed in packet 1427: no direct add form landed; only a
      whole-layout Replace does, on 26.0.3.309, and it regenerates every object's UUID
      (layout-replace-whole-version-dependent).
    ai_guidance: >
      Build a new layout via LayoutCatalog AddAction; set every LayoutObject
      hash="00000000000000000000000000000000"; a button's action ScriptReference uses the
      existing script's id+name ONLY (no UUID — do not flag it missing); omit the action
      <Calculation> unless passing a parameter; never emit a DDRREF. Do not try to add an
      object to an existing layout.

  - id: field-replace-sametype-ok-typechange-unhostable
    title: Same-type field Replace works; a type-changing field Replace makes the file unhostable
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      Probe sweep (live, Playground1), both using the wrapped form
      <ReplaceAction><FieldsForTables><FieldCatalog><BaseTableReference/><ObjectList>
      <Field …><UUID>…</UUID>…</Field></ObjectList></FieldCatalog></FieldsForTables>:
      (a) SAME-TYPE Replace (keep fieldtype="Normal", edit comment/options) applied AND
      the file hosted cleanly. (b) TYPE-CHANGE Replace (Normal→Calculated) applied per the
      tool (rc=0, "Patch File Applied") but the resulting file FAILED TO HOST — fmsadmin
      open returned 10904 and OData 802 (unable to open file), reproducibly. This resolves
      the earlier field-replace-typechange-nonfunctional anomaly: it is a TOOL LIMIT, not a
      CORPUSfm bare-<Field> bug — the wrapper does not fix it and in fact yields an
      unopenable file (worse than the prior bare-form "non-functional").
    implication: >
      Field Replace is usable to edit a field IN PLACE as long as fieldtype is unchanged.
      NEVER change a field's type via Replace — emit a new field via AddAction instead
      (already the field-template guidance; now with a hard reason: the file won't open).
      ENFORCED: generate_patch (via coverage_gate) marks a fieldtype-changing field
      Replace not_patchable and does not emit it.
    ai_guidance: >
      To edit an existing field, ReplaceAction is fine ONLY if you keep fieldtype the same.
      To introduce a calculated/different-type field, AddAction a new field; never Replace
      a Normal field into a Calculated one.

  - id: delete-field-and-table-occurrence-ok
    title: DeleteAction removes a field and a table occurrence cleanly
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      Probe sweep (live): <DeleteAction><ItemReference UUID="…" type="FieldReference">
      <BaseTableReference id name/></ItemReference></DeleteAction> removed a field
      (ModifiedBy gone, file hosts); the same with type="TableOccurrenceReference" (no
      BaseTableReference) removed a table occurrence (the CORPUSfm TO gone, only the base
      TO remained, file hosts). Targeting is by the object's FM UUID (the <UUID> child in
      the export). Complements the existing delete restrictions (accounts + built-in
      privilege sets blocked).
    ai_guidance: >
      Delete a field or table occurrence with a DeleteAction/ItemReference by its UUID
      (fields also need a BaseTableReference). Do not attempt to delete accounts or
      built-in privilege sets.

  - id: layout-add-only-no-uuid-to-target
    title: "REFUTED 2026-10-27 — layouts DO carry a UUID; they are not add-only (gate still cites this id)"
    category: grammar
    status: refuted
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      REFUTED by packet 1427 (2026-10-27, evidence .claude/evidence/1427/). Every real layout in
      every sampled SaveAsXML export (FM 21.1.2, 22.0.6, 26.0.1, 26.0.3) carries a direct <UUID>
      child — later in the element, after TableView, not first — and it equals the UUID that
      LayoutReferences elsewhere point to. Targeting THAT UUID, Delete removes the layout on
      22.0.6.600 and 26.0.3.309, and whole-layout Replace lands on 26.0.3.309 (entries
      layout-delete-by-layout-uuid, layout-replace-whole-version-dependent). Object-level
      Replace/Delete by the object's own UUID works on both builds (layout-object-replace-delete).
      The 2026-06-04 no-ops below targeted a NESTED object's UUID, which 1427 reproduced as a
      no-op control — the measurement stands, the conclusion drawn from it does not.
      coverage_gate still blocks layout Replace/Delete under this id; changing that is a separate
      decision, not done here. ORIGINAL 2026-06-04 TEXT, kept as history:
      Probe sweep (live): a SaveAsXML LayoutCatalog <Layout id name width> entry carries NO
      UUID — not as an attribute and not as a direct <UUID> child (only its nested children
      — TableOccurrenceReference, LayoutThemeReference, LayoutObjects — have UUIDs). Since
      ReplaceAction/DeleteAction target by the object's own UUID, a layout cannot be
      addressed: manual Replace/Delete attempts using a nested-object UUID applied (rc=0,
      hosted) but were NO-OPs (the layout was unchanged / not removed). CORPUSfm's own
      _build_replace/_build_delete already bail on layouts for lack of fm_uuid.
    implication: >
      No structural reason remains: the tool can Replace and Delete layouts and layout objects by
      their own UUIDs, with the build-, file- and form-dependent outcomes recorded as facts on the
      layout entries below. What remains is CORPUSfm's current implementation: generate_patch (via
      coverage_gate) still marks any layout Replace/Delete not_patchable and cites this id as its
      provenance, and the authoring templates cover new layouts only. Until 2026-10-27 this field
      read "Layouts are ADD-ONLY via patch", the conclusion the refutation withdraws.
    ai_guidance: >
      CORPUSfm's generator and authoring templates currently cover only ADDING layouts; that is the
      current implementation, not a tool limit (layouts carry their own UUID). The tool's tested
      layout Replace/Delete behavior, including no-ops, crashes, identity changes and destructive
      forms, is recorded per build in get_patch_capabilities. Only ADD layouts; do not hand-author a
      layout or layout-object Replace/Delete, and do not try to add an object onto an existing layout
      — author a new layout instead.

  # ── packet 1427 (2026-10-27): layout patching re-measured. Fixture = copy of the Claris-shipped
  # Content Management starter (FM Pro 26.0.3 bundle); apply on fms-dev 26.0.3.309 and local
  # 22.0.6.600; native before/after via FMDeveloperTool --saveAsXML -id, --checkConsistency, and
  # FileMaker Pro 26.0.3 renders. Every row below exited 0 — including every no-op and every
  # destructive variant — so exit code / validatePatch never discriminate. Evidence and the full
  # map: .claude/evidence/1427/README.md. No ai_guidance on these: the generator gate is unchanged.
  - id: layout-delete-by-layout-uuid
    title: A layout deletes by its own UUID; inbound references are cleared
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600, 26.0.3.309"
    date: "2026-10-27"
    scope: >
      Fixture = a copy of the Claris Content Management starter shipped in FileMaker Pro 26.0.3 (an
      FM-26 file, SaveAsXML 2.3.0.0). Native before/after = FMDeveloperTool 26.0.3.309 --saveAsXML -id
      plus --checkConsistency. Rendered/behavioral proof = FileMaker Pro 26.0.3 on 26.0.3.309 outputs;
      a 22.0.6.600 cell is XML-only unless it cites a FileMaker Pro 22.0.6 render (packet 1444, on the
      Contacts starter shipped with FileMaker Pro 22.0.6).
    corpusfm_policy: >
      Not generated — current implementation, not a tool limit. generate_patch marks every layout
      Replace/Delete not_patchable (coverage_gate, citing the refuted id layout-add-only-no-uuid-to-target),
      and the assistant authoring guidance only adds layouts. check_patch, dry-run and apply have no
      layout-specific refusal, so a hand-written layout Replace/Delete is not blocked; dry-run Verify is
      its check, as for any patch. These facts record what FMUpgradeTool did on the named builds and
      fixtures: a hazard is a condition to know, an untested case is unknown, and neither is a CORPUSfm
      rule.
    facts:
      - claim: Delete a layout by its own UUID
        help: true
        form: DeleteAction > ItemReference[type=LayoutReference, UUID=the Layout's own <UUID> child]
        builds: {"22.0.6.600": landed/xml, "26.0.3.309": landed/rendered}
        note: Inbound Go to Layout references to it are emptied; an image used only by it is dropped.
        evidence: [layout_delete__t22, layout_delete]
      - claim: Delete a layout by a nested object's UUID
        builds: {"26.0.3.309": no-op/xml}
        note: >
