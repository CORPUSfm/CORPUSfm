  - id: script-step-hashes-recomputed
    title: Script-step hashes are FM-recomputed; step structure applies, content is per-step-type
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      Probe (live, Playground1, step grammar sourced from the scriptstepsamples artifact):
      a two-AddAction script add — <ScriptCatalog><Script id="0" name=…/></ScriptCatalog>
      then <StepsForScripts><Script><ScriptReference id="0" name=…/><ObjectList>
      <Step hash="000…0" index id name>…</Step>…</ObjectList></Script></StepsForScripts> —
      applied and hosted. The new script landed with its 2 steps (id=89 comment, id=85 Allow
      User Abort), and the per-step `hash` attribute came back as REAL values (my all-zeros
      placeholders were RECOMPUTED by FM) — like layout-object hashes / DDRREFs, the step
      hash is NOT an authoring input. The step structure (type id, index, enable) and the
      Boolean parameter applied; HOWEVER a comment step's text authored as
      <Parameter type="Comment"><Comment>text</Comment></Parameter> was LOST — step
      user-content encoding is step-type-specific and was not reproduced by a naive guess.
    implication: >
      Script-step construction is feasible without computing any hash. But per-step
      PARAMETER/content encoding varies by step type and must come from a verified template,
      not invented — this is exactly what structure_catalog.steps_templates provides (real
      step XML with typed placeholders). So: author steps from the step templates, fill the
      user content, leave hash="000…0" (or omit), and FM recomputes the hash on apply.
    ai_guidance: >
      To author script steps, use the structure-catalog step templates for each step type
      (they carry the correct ParameterValues encoding); set every Step hash to 32 zeros
      (FM recomputes it) and do not hand-invent a step's parameter XML.

  - id: dangling-cross-reference-silently-dropped
    title: A reference to an object absent from BOTH files is applied silently as a no-op, not refused
    category: apply-semantics
    status: verified
    verified_via: live-apply
    tool_version: "22.0.6.600"
    date: "2026-06-04"
    behavior: >
      Probe (live, Playground1): a patch added a script "DanglingProbe" whose only step
      was a Perform Script calling "GhostTarget999" — a script present in NEITHER the
      source file NOR the patch. Two observations. (1) --validatePatch returned "Patch
      File Validated" — validation is STRUCTURAL/XML-only and does NOT resolve references.
      (2) --update returned rc=0 "Patch File Applied" and the file hosted; the DanglingProbe
      script landed, but the unresolved ScriptReference was SILENTLY DROPPED — the step
      came back as a no-op `Perform Script [ "" ]` (the <List> that held the reference is
      empty), and NO phantom "GhostTarget999" script was created. So a dangling reference
      neither errors nor is preserved nor fabricates a target — it just vanishes, leaving
      broken/no-op logic in an otherwise-valid, hosted file.
    implication: >
      FMUpgradeTool does not guard against dangling cross-references: a structurally valid
      patch can pass --validatePatch AND --update and still ship silently-broken logic.
      Neither the tool nor validation is a referential-integrity check. CORPUSfm must catch
      this BEFORE apply — which is exactly what the static coherence checker does
      (corpusfm/extensions/export/patch_coherence.py: dangling_reference is an ERROR, since
      the alternative is silent breakage, not a tool refusal). The checker is therefore NOT
      redundant with validate; it covers what validate provably cannot.
    ai_guidance: >
      Never emit a reference (ScriptReference, FieldReference, TableOccurrenceReference, …)
      to an object that exists in neither the base artifact nor the patch's own AddActions.
      It will not error — it will silently vanish, producing a broken no-op. Every reference
      must resolve in the base file or be added earlier in the same patch (referent-first).

