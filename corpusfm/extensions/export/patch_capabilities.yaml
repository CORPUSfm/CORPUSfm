        evidence: [1444/bisect_wv_identity, 1444/bisect_wv_identity__view, 1444/T22p_Contacts__view, 1444/bisect_whole_after_wv_identity, 1444/bisect_whole_after_wv_identity__t22, 1444/bisect_del_webviewer, 1444/bisect_whole_after_del_wv, 1444/bisect_tab_identity, 1444/bisect_whole_after_tab_identity, 1444/bisect_del_details, 1444/bisect_whole_list]
      - claim: A fresh FMDeveloperTool --clone
        builds: {"22.0.6.600": refused/none, "26.0.3.309": refused/none}
        note: >
          Neither tool could open it ("(804) File cannot be opened as read only in its current state"),
          so no patch applied.
        evidence: [1444/whole_t22dl_list, 1444/whole_t22dl_list__t22]
      - claim: Whole-layout Replace wrapped in LayoutCatalog
        builds: {"26.0.3.309": no-op/xml}
        evidence: [layout_replace_whole]
      - claim: Layout Replace without its parts
        help: true
        builds: {"26.0.3.309": destructive/rendered}
        note: >
          A "properties only" Replace renamed the layout and deleted all 34 objects; it renders blank.
