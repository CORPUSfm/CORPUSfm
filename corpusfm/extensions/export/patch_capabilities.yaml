        builds: {"22.0.6.600": no-op/xml, "26.0.3.309": collateral/rendered}
        note: >
          On 26.0.3.309 the intended edits landed and the layout kept its UUID, but every object got a
          new UUID and id. 22.0.6.600 never landed it in five tries (packet 1444 added the Contacts file
          shipped with FileMaker Pro 22.0.6 and layout XML exported by Pro 22.0.6). 26.0.3.309 landed
          it on two files and not on a third (next row), so it is also file-dependent — tested
          combinations, not a version ban.
