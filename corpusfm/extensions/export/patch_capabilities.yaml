      - claim: Whole-layout Replace on the Contacts file shipped with FileMaker Pro 22.0.6
        help: true
        builds: {"22.0.6.600": no-op/xml, "26.0.3.309": no-op/xml}
        note: >
          No-op with Pro 22.0.6-exported XML at 2.2.3.0 and FMDeveloperTool XML at 2.3.0.0, on a simple
          layout as well, and after opening the file in FileMaker Pro 26.0.3. --generateGUIDs updated 0
          items. The same Replace landed on the Contacts file shipped with Pro 26.0.3. Compacted copies of
          this file written by Pro 22.0.6, Pro 26.0.3 and FMDeveloperTool still refused it, so the cause
          travels with the file's content, not with the client that last wrote it. FMDeveloperTool
          --recover found no problems (0 structure items modified) and the recovered file still refused
          it. Cause found by bisection: the file's web viewer. Deleting only the web viewer, or replacing
          it with its own unchanged XML, made 26.0.3.309 whole-layout Replace land on any layout of the
          file (next row); the state is internal and absent from the export.
        evidence: [1444/whole_t22r_list, 1444/whole_t22r_list__t22, 1444/whole_t22w26_list, 1444/whole_t22w26_list__t22, 1444/whole_t22w22_list, 1444/whole_t22w22_list__t22, 1444/whole_t22dc_list, 1444/whole_t22dc_list__t22, 1444/era_whole_layout__t22, 1444/era_whole_layout, 1444/era_whole_dt26xml_v230, 1444/era_whole_pro22xml_v230, 1444/era_whole_dt26xml_v223, 1444/era_whole_dt26xml_v230__t22, 1444/whole_t22p_list, 1444/whole_t22o_list, 1444/whole_t22o_list__t22]
      - claim: Whole-layout Replace on new blank files created in FileMaker Pro 22.0.6 and 26.0.3
