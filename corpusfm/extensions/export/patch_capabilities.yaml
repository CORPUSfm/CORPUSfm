  - id: fm2026-update-monolith-only
    title: FMUpgradeTool consumes only a monolith SaveAsXML — split exports must be reassembled
    category: grammar
    status: verified
    verified_via: live-apply
    tool_version: "26.0.1.68"
    date: "2026-06-16"
    behavior: >
      --generateDBFile -src_path <Summary.xml> (the FM2026 split-catalog FMPReport manifest) RUNS
      clean (exit 0) but produces NO file — the tool does not recognize the split manifest as a
      source. --generateDBFile -src_path <one per-catalog file> DOES generate a file, but only with
      that single catalog (each per-catalog file is a valid standalone one-catalog FMSaveAsXML).
      Proven live on fms-server with PTLaunchPad's split export. So FMUpgradeTool understands only a
      MONOLITH FMSaveAsXML, not the split format.
    implication: >
      Feed FMUpgradeTool a MONOLITH SaveAsXML (the default export — uncheck FM2026's "create a
      separate XML file for each catalog"). CORPUSfm only ingests SaveAsXML + AddonXML; it does not
      consume the split-catalog export format, so this is a no-op for normal CORPUSfm flows and a
      caution for generate_db_file: pass a monolith, never a Summary.xml manifest or a single
      per-catalog file.
    ai_guidance: >
      Never feed a Summary.xml manifest or a single per-catalog file to FMUpgradeTool expecting the
      whole schema — it wants a monolith SaveAsXML.

