# ── version sensitivity: where the CLIP shape differs by FileMaker version (packet 1077) ──
#
# We emit FM2026-form clips, always (clip_emit.CLIP_TARGET_VERSION). Established by the packet-1068
# version sweep, diffing the two committed whole-catalog XMSS masters (scriptstepsamples_fm2025_xmss.xml
# vs _fm2026_xmss.xml). Two layers:
#
#   * EVERY step is version-shaped, not just the ids below — `<DisableStepCollapsed>` is an FM2026
#     clipboard addition the FM2025 clip omits entirely, and we emit it on every step. Normalizing it
#     out, 197/216 shared steps are byte-identical across versions; the 19 below are the rest.
#   * `emitted: true` marks an id we ACTUALLY emit today, i.e. where the FM2026 assumption is live
#     rather than hypothetical. Guard-locked to the fence by test_version_sensitivity_emitted_flags —
#     build an emitter for one of the `false` ids and the flag must move with it.
#
# FM2025 acceptance of an FM2026-form clip is UNTESTED (a paste test on an FM2025 box would settle it).
# Do NOT "fix" a 2025 spelling toward 2026 or vice versa; declare the target instead.
version_sensitivity:
  target: FM2026                        # mirrors clip_emit.CLIP_TARGET_VERSION (guard-locked)
  universal:
    element: DisableStepCollapsed
    delta: "FM2026 clipboard addition; the FM2025 clip omits it entirely. Emitted on every step, so
      every clip we produce is FM2026-form — the 19 ids below are additional, not the whole story."
  # Names are the structure catalog's; every `delta` below was re-derived first-hand from the two
  # committed masters (packet 1077), NOT copied from prose — the coverage doc's terse parentheticals had
  # mis-titled five of these ids.
  steps:
    # 10 FM2026-only types — render as <unknown> in an FM2025 export
    237: {kind: fm2026-only, emitted: true,  name: Flush Web Viewer Cookies}
    238: {kind: fm2026-only, emitted: false, name: Configure Persistent Data}
    240: {kind: fm2026-only, emitted: false, name: Insert Image Captions in Found Set}
    241: {kind: fm2026-only, emitted: false, name: Insert Image Caption}
    242: {kind: fm2026-only, emitted: false, name: Print PDF}
    243: {kind: fm2026-only, emitted: true,  name: Create PDF}   # packet 1081
    244: {kind: fm2026-only, emitted: true,  name: Append PDF}
    245: {kind: fm2026-only, emitted: true,  name: Close PDF}
    246: {kind: fm2026-only, emitted: true,  name: Open PDF}
    247: {kind: fm2026-only, emitted: true,  name: Cancel PDF}
    # 9 with real payload deltas between the versions (each verified against the masters)
    3:   {kind: payload-delta, emitted: true,  name: Save a Copy as XML,
          delta: "FM2026 adds <OutputEntireBinaryData>, <SpecifyJSONOptions> and a <SaXML><JSONOptions>
            calc subtree; FM2025 carries only <Option>."}
    89:  {kind: payload-delta, emitted: true,  name: "# (comment)",
          delta: "FM2026 adds <Restore state=…/> before <Text>."}
    144: {kind: payload-delta, emitted: true,  name: Save Records as PDF,   # packet 1081
          delta: "FM2026 adds <PDFSaveType> as the first child of <PDFOptions>. We emit the FM2026 form
            (CLIP_TARGET_VERSION) — there is no FM2025 output mode; whether FM2025 accepts it is
            untested."}
    161: {kind: payload-delta, emitted: false, name: Insert from Device,
          delta: "FM2026 adds <LightMode choice=…/> inside <DeviceOptions>."}
    202: {kind: payload-delta, emitted: true,  name: Configure Machine Learning Model,
          delta: "FM2025 puts the operation as <ConfigureCoreML> TEXT; FM2026 wraps it in <Operation>."}
    212: {kind: payload-delta, emitted: true,  name: Configure AI Account,
          delta: "FM2025 ships the TYPO <SetLLMAccout>; FM2026 fixed it to <SetLLMAccount>. We emit the
            FM2026 spelling — pasted into FM2025 that is simply the wrong element name. Do NOT 'correct'
            it toward 2025; declaring a target is what this is for."}
    215: {kind: payload-delta, emitted: false, name: Insert Embedding,
          delta: "FM2026 adds <Option state=…/> before <LLMEmbedding>."}
    218: {kind: payload-delta, emitted: false, name: Perform Semantic Find,
          delta: "FM2026 adds <UniversalPathList type=…/> before <LLMSemanticFind>."}
    219: {kind: payload-delta, emitted: false, name: Perform RAG Action,
          delta: "FM2026 adds <DetectVertical> + <RAGSpaceTokensPerTextChunk> before <RAGSpace>."}

# ── external skeletons: an INDEPENDENT RE of the clip format (packet 1075) ─────
#
# Source:   andykear/FileMaker-XMLsnippet-Claude-Skill  v1.13
#           https://github.com/andykear/FileMaker-XMLsnippet-Claude-Skill
# Licence:  CC BY 4.0 — https://creativecommons.org/licenses/by/4.0/  (adaptable WITH ATTRIBUTION;
#           stated in the repo README, not a LICENSE file, so GitHub reports licenseInfo: null)
# Ingested: 2026-07-15. Cross-check report: docs/clip-spec-crosscheck.md
#
# ⚠ THIS IS A HYPOTHESIS LAYER, NOT GROUND TRUTH. It is clip-only: it describes the TARGET shape and
# says nothing about the DDR→clip mapping (enum remaps, defaults, DDR-gaps) — the hard, code-bearing
# half. NEVER widen _VERIFIED_SIGS off it. An emitter still ships only when byte-exact against a real
# captured pair. Where this and one of our pairs disagree, OUR PAIR WINS (it is a real FileMaker
# artifact) — record the disagreement, it may be a version difference (the spec lags FM versions).
#
# ONLY the 31 ids we CANNOT emit are carried. The other 123 the spec covers are deliberately excluded:
# we already hold a stronger oracle for them (a real clip), so importing a weaker, version-lagging
# description would add a second source of truth to drift against — the hand-maintained mirror this
# codebase keeps getting bitten by. A skeleton earns its place only where we have no capture.
#
# `elements` is the skeleton's child-element ORDER, with DisableStepCollapsed normalised out (the spec
# omits it from every skeleton by choice). Use it as a capture HINT — what to expect when someone
# finally captures the step — never as a licence to emit.
# ⚠ An id here must be one we CANNOT emit. Once a real captured clip grounds an emitter, its skeleton
# must GO: we then hold a stronger oracle, and keeping the guess alongside it is a second source of truth
# to drift against (guard: test_external_skeletons_never_leak_into_the_fence). 144 + 243 were removed
# 2026-07-15 when packet 1081 built them from committed pairs; 91 + 61 + 131 the same day (pkt 1082).
