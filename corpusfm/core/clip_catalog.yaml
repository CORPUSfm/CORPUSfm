    Create PDF: BUILT (packet 1081) — 9 configured shapes emit byte-exact; the shared
    Document/Security/View subtree emitter serves 144 too. Its history is worth keeping: it was filed as
    a class-2 ddr-gap (the clip carries an output path the DDR lacks) and that was WRONG. The bare
    <Calculation> between <Restore> and <CreatePDFFile> is the TITLE, MIRRORED — Create PDF creates in
