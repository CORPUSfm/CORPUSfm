# FMXML (clipboard) clip catalog — packet 1072
#
# The clip-side parallel to the DDR structure_catalog. Declarative source of truth for what the
# variation DETECTOR knows about the DDR→clip transform, so coverage growth is driven by evidence,
# not guesswork. This is DATA the detector reads (corpusfm/core/clip_catalog.py) — the packet-999
# principle: a future variation is added HERE, not in code.
#
# EVERY layer here must be READ by shipped code — test_clip_catalog_consumers.py fails the build
# otherwise, naming the orphan. That guard exists because this file twice grew a layer nothing consumed
# (packets 1074 + 1079): an unread layer derives nothing and is proved wrong by nothing, so it rots in
# silence. If you add a key, give it a consumer or don't add it.
#
# What lives here (grounded in our OWN committed (DDR, clip) pairs + the coverage doc — never an
# inference off an external spec; the fence law still governs emission):
#   ddr_gaps       — step ids where the CLIP carries data the SaveAsXML export does NOT hold, so the
#                    step is fundamentally not reproducible from the DDR alone. The detector flags these
#                    `ddr-gap` (a policy decision — emit-semantic-only / empty-unset / refuse — NOT a
#                    capture that would unblock an emitter). Distinct from "no emitter yet".
#   clip_evidence  — which clip masters we hold, per step id, so the backlog can say "the blocker is
#                    CODE, don't go capture this" instead of sending someone to FileMaker Pro for bytes
#                    already in the repo (packet 1080 §3).
#   known_clip_values — clip values OBSERVED in our committed clips: the drift oracle for INCOMING clips
#                    (packet 1079). NOT a DDR→clip remap table; see its header for why that matters.
#   version_sensitivity — where the CLIP shape differs by FileMaker version (packet 1077).
#   external_skeletons  — third-party RE'd shapes for ids we cannot emit. A capture HINT layer; never an
#                    emit licence (guard: test_external_skeletons_never_leak_into_the_fence).
#   notes          — per-id human hint the detector attaches to a needs-capture finding.
#
# The COVERED / EXPERIMENTAL / UNACCOUNTED classification is NOT duplicated here — the detector reads the
# live step assessment (step_generation_assessment: VERIFIED_STEP_IDS + _VERIFIED_SIGS + the migrated
# capability rules, packet 1091) so it can never drift from what the emitter actually generates. Packet
# 1074 proposed moving that knowledge here and was REFUTED: this file adds only what the fence cannot
# answer on its own.

version: 1

# ── ddr-gaps: the clip needs data the DDR lacks → not emitter-buildable without a policy call ──
#
# These are WHOLE-ID gaps: no emitter exists, and id-level is therefore an honest description
# (guard: test_ddr_gap_ids_have_no_emitter). A gap that applies to only SOME shapes of an id does NOT
# belong here — it lives in clip_emit._SOURCE_INCOMPLETE_SIGS, per-shape and live, because an id-level
# entry cannot express "this shape is fully covered, that shape is class-2" without lying about one of
# them. Print Setup (42) was moved out for exactly that reason — see below.
ddr_gaps:
  242:
    name: Print PDF
    gap: "the clip's <PrintSettings> carries the same machine printer ticket as Print Setup — 4
      <PlatformData> children (PrNm/M_PM/M_PD/MMod) — which the DDR does not hold. CONFIRMED 2026-07-15
      from the `backlog` pair, no longer 'almost certainly'."
    decision: "open — no emitter yet. When one is built, expect the SAME empty/populated split as 42:
      the base-shape clip (DDR <PageSetup> empty) carries no <PrintSettings> at all and should be plain
      class-1 coverage; only the populated shape is class-2. Follow 42's pattern (packet 1076)."
  # 243 Create PDF was HERE until 2026-07-15 and has been RECLASSIFIED — it is not a class-2 gap. See
  # `notes: 243` below for the reasoning, and docs/clip-spec-crosscheck.md for the full account. Kept as
  # a tombstone because "we already decided this is impossible" is exactly the belief that stops work.

# ── TOMBSTONE: `target_mode_pdf_gap` (244/245/246) — removed 2026-07-15, packet 1080 §1 ──────
# It was a KEY; nothing read it. Kept as a comment because the knowledge is true and worth stating,
# but it is a signpost, not data: File mode IS emitted; Target mode serialises a UniversalPathList path
# the DDR doesn't hold, and the LIVE per-shape fence refuses it on its own with no catalog involved.
# A key that only restates what the fence already enforces is the mirror this packet exists to stop.
#
# ── TOMBSTONE: `print_setup_shape_gap` (42) — removed 2026-07-15, packet 1080 §1 ─────────────
# It was worse than an orphan: ClipCatalog never even LOADED it, so it was dead data from birth, and
# its own `authority:` field pointed at clip_emit._SOURCE_INCOMPLETE_SIGS — it announced that it wasn't
# the truth. The knowledge it held, in full, and the AUTHORITY remains that live register:
#   * PageSetup:empty  → the clip has NO <PageFormat>; fully reproducible; ordinary verified coverage.
#   * PageSetup:set    → the clip's <PageFormat> carries printer-computed geometry + a PlatformData
#                        ticket. PROVEN unrecoverable (packet 1076): two steps with byte-identical DDR
#                        content produce clips with DIFFERENT PlatformData, so the DDR does not
#                        determine the clip and no emitter can. We emit orientation + scale only, BY
#                        DEFAULT (packet 1089), labelled source-incomplete in the result metadata; a
#                        strict/verified-only caller still refuses it.
#     ✅ PASTE TEST GREEN (dev, 2026-07-15, FM Pro 2026/macOS): the masked clip PASTES, FileMaker fills
#     its own printer defaults for everything omitted, and orientation + scale survive as emitted. The
#     opt-in path STAYS. ⚠ But the test surfaced a CLASS-1 loss hiding inside this class-2 gap: the DDR
#     holds <size height width> (paper size) and we emit nothing for it, so an A4 step pastes as US
#     Letter. The sample could not show this — its paper size IS the local default. See clip_emit.py's
#     _emit_print_setup comment + docs/clip-emit-coverage.md.
#
# ── TOMBSTONE: `enum_tables` — DELETED 2026-07-15, packet 1080 §2. Do not rebuild it. ────────
# It mirrored 8 of clip_emit.py's 16 enum maps (DDR selector name → clip value) and was read by NOTHING
# but its own lockstep test — a guard whose only job was to check the mirror still matched its original.
# Its stated purpose ("an unseen KEY for one of these ids means a new enum variation → a real capture
# need") is ALREADY delivered, in full, by the live per-shape fence: an unseen DDR enum value produces
# an unaccounted shape → the step assessment refuses it → detect_clip_variations reports
# new-variation, with no catalog involved. Demonstrated 2026-07-15 with DDR List name="Perplexity".
# That redundancy is why nothing ever consumed it, and why the 8-in/8-out split had no principle behind
# it: nothing depended on the answer. Packet 1079's follow-on "add the 8 missing maps" DIES HERE — it
# would have extended an orphan.
#   The knowledge is not lost; it lives where it is USED and where it is READ:
#     * the maps + every one of these comments, verbatim → clip_emit.py (_SMTP_ENCRYPTION, _SMTP_AUTH,
#       _OAUTH_PROVIDER, _LLM_PROVIDER, _ADJUST_WINDOW, _SNAPSHOT_SAVETYPE, _PRINT_TYPE,
#       _WEBVIEWER_ACTION) — the authority, adjacent to the emitter that applies it.
#     * the hard-won remaps (OpenAI→ChatGPT, Custom→Other) → docs/clip-emit-coverage.md.
# ⚠ Do NOT confuse this with `known_clip_values` below. That is the INVERSE axis (clip values OBSERVED,
# not DDR names REMAPPED) and it has a real consumer. Conflating them flagged an ordinary Anthropic clip
# as drift — see its header.

# ── clip evidence: WHAT WE ALREADY HOLD, so the backlog never sends anyone to re-capture it ──
#
# Packet 1080 §3. The detector used to print "NEEDS CAPTURE — each needs ONE real (DDR, clip) pair;
# capture the top rows first" for EVERY not-covered step. That was false for essentially all of them:
# measured 2026-07-15, **all 217 canonical step types have a committed clip**. The blocker is CODE, not
# evidence. Sending someone to FileMaker Pro to re-capture what is already committed is worse than
# stale — it is actively misleading, the same defect the dev called out in CAPTURE-BACKLOG §③.
#
# WHY THIS IS DATA AND NOT DERIVED: the fixtures live in tests/fixtures/, which a SHIPPED detector cannot
# read. So the id lists travel here — machine-generated by scripts/gen_clip_evidence.py and held to the
# committed bytes by test_clip_evidence_matches_the_committed_masters. Never hand-edit them: an
# unverified "we have this already" SUPPRESSES a capture that was really needed, which is worse than a
# spurious ask.
#
# ⚠ THE LIMIT, STATED PLAINLY — this is id-level evidence, and the fence is PER-SHAPE.
# "We hold a clip for id 144" does NOT mean we hold one for YOUR shape of 144 (its DDR has 9). So this
# layer never renders a verdict; it reports what exists and lets the reader judge. Since every id is
# held, a genuine capture ask can now only ever be a per-SHAPE one — and that is exactly what this layer
# cannot answer, because the DDR halves of the masters are NOT committed (they are gitignored under
# xmlsamples/; only the synthetic clip halves are here). The clip is also the half that costs a human a
# FileMaker Pro round trip — a DDR is re-exportable by machine — so id-level clip evidence is precisely
# the signal that answers "is this trip worth taking?". `multi_shape` says how many distinct shapes of an
# id a fixture really holds, which is the closest honest proxy for per-shape depth.
#
# scope:  base       — one unconfigured sample step per type (proves base grammar only)
#         configured — real, varied option shapes (the detail-bearing captures)
#         pair       — a full committed (DDR, clip) pair: the emitter fence's own ground truth
# flavor: XMSC (whole-script copy) / XMSS (bare steps) — see docs/clip-emit-coverage.md; the two differ.
#
# NB 186 MBS is HELD (mbs_step.xml) and is neither code- nor capture-blocked: it is fence-don't-emit by
# POLICY (plugin-defined grammar). See notes: 186. An earlier cut of the generator read only master/ and
# so reported 186 as capture-less — the very bug this layer exists to prevent, in the tool built to
# prevent it. Scan every fixture.
