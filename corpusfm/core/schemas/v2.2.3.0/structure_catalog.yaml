# ---------------------------------------------------------------------------
# container_grammar — how FM encodes FOLDER hierarchy inside catalog lists.
# Format-level (file-independent) structural vocabulary. A foldering catalog is
# a FLAT, ORDERED sequence of <Script>-shaped elements; folder membership is
# POSITIONAL (an item belongs to the open folder it sits inside), NOT a parent
# id/reference on the item. This is exactly how FM's own SaveAsXML export is
# structured, and how the ingest pipeline reconstructs folder_path.
# ---------------------------------------------------------------------------
container_grammar:
  folder_role_attr: "isFolder"      # the attribute on a catalog element that carries its folder role
  folder_open_value: "True"         # isFolder="True"  → opens a folder; subsequent siblings nest inside it
  folder_close_value: "Marker"      # isFolder="Marker" (FM renders name="--") → closes the nearest open folder
  membership: "positional"          # no parent-id on items; nesting is the span between an open and its matching close
  applies_to:                       # catalogs verified to use this grammar (FM 22)
    - ScriptCatalog
  add_implication: >
    A script that lives in a folder is THREE ordered catalog entries:
    <Script isFolder="True"> (open) · the <Script> itself · <Script isFolder="Marker"> (close).
    To add a foldered object via an FMUpgradeToolPatch, emit all three in order;
    an Add of the bare object alone lands at the catalog ROOT (folder lost).
    VERIFIED live 2026-06-03 (FMUpgradeTool 22.0.6.600): the tool reconstructs
    nesting from this ordering on --update. The folder-open emitted before a
    script nests it; the close marker is required to BOUND the folder so a later
    added root item (or a second new folder) does not get swallowed.
