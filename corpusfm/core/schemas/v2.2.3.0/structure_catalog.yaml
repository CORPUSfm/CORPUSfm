# FM Internal Structure Catalog for FMSaveAsXML version 2.2.3.0
# Corresponds to FileMaker Pro 22.x
#
# Privacy boundary: this file contains ONLY FileMaker's own structural
# vocabulary — element names, attribute names, type codes, and IDs.
# No user content (field names, script names, formula text, TO names).
#
# Purpose: write-path reference for fmClip generation and AI consumers.
# Each script step entry maps an internal ID to its display name and the
# Parameter types its XML structure uses. Parallel to rendering.yaml
# (display path) — this file serves the construction path.
#
# param_types: list of Parameter @type values used by this step.
# Empty list means the step carries no Parameters (e.g. End If, Loop).
#
# Accumulated: new entries are added as unknown step IDs are observed
# during ingestion. fm_version_first_seen records the FM version string
# from the first file where this step ID was encountered.

schema_version: "2.2.3.0"

