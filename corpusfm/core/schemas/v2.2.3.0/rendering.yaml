  211:
    name: "Trigger Claris Connect Flow"
    template: "Trigger Claris Connect Flow"

  # ─── AI ─────────────────────────────────────────────────────────────────────
  212:
    render: ai_params
    name: "Configure AI Account"
    template: "Configure AI Account"

  220:
    render: ai_params
    name: "Generate Response from Model"
    template: "Generate Response from Model"

  # ─── Platform / Scripting ───────────────────────────────────────────────────
  67:
    name: "Perform AppleScript"
    template: "Perform AppleScript [ {script} ]"
