# FM script step rendering catalog for FMSaveAsXML version 2.2.3.0
# Parallel to mappings.yaml — same version directory, same registry fallback.
#
# Each step entry:
#   name:     Display name (for human reference; runtime uses XML @name attr)
#   template: One-line FM ScriptMaker display string with {key} placeholders.
#             No template (or null) → rendering engine falls back to name + ⚠ partial badge.
#   params:   Map of placeholder key → extraction spec.
#
# Extraction spec fields:
#   xpath:    XPath from the Step element root
#   attr:     (optional) Attribute to read from matched element; omit for element .text
#   display:  (optional) Value substitution map e.g. {"True": "On", "False": "Off"}
#
# If an XPath finds nothing, the placeholder renders as an empty string.
# Steps absent from this file use graceful fallback rendering.

schema_version: "2.2.3.0"

script_steps:

  # ─── Comment ────────────────────────────────────────────────────────────────
  89:
    name: "# (comment)"
    template: "# {text}"
    # An empty comment is a blank line in FileMaker — no leading '#'.
    blank_when_empty: "text"
    params:
      text:
        xpath: "./ParameterValues/Parameter[@type='Comment']/Comment"
        attr: "value"

  # ─── Variables & Fields ─────────────────────────────────────────────────────
  141:
    name: "Set Variable"
    template: "Set Variable [ {name} ; Value: {value} ]"
    params:
      name:
        xpath: "./ParameterValues/Parameter[@type='Variable']/Name"
        attr: "value"
      value:
        xpath: "./ParameterValues/Parameter[@type='Variable']/value/Calculation/Calculation/Text"

  76:
    name: "Set Field"
    template: "Set Field [ {table}::{field} ; {value} ]"
    params:
      table:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference/TableOccurrenceReference"
        attr: "name"
      field:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference"
        attr: "name"
      value:
        xpath: "./ParameterValues/Parameter[@type='Calculation']/Calculation/Calculation/Text"

  147:
    name: "Set Field By Name"
    template: "Set Field By Name [ {field_name} ; {value} ]"
    params:
      field_name:
        xpath: "./ParameterValues/Parameter[@type='Calculation'][1]/Calculation/Calculation/Text"
      value:
        xpath: "./ParameterValues/Parameter[@type='Calculation'][2]/Calculation/Calculation/Text"

  77:
    name: "Insert Calculated Result"
    template: "Insert Calculated Result [ {target} ; {value} ]"
    # render: insert_calc_result — a FIELD target rendered blank (template only read a Variable
    # target); surface the target field too. packet 1027.
    render: insert_calc_result
    params:
      target:
        xpath: "./ParameterValues/Parameter[@type='Target']/Variable"
        attr: "value"
      value:
        xpath: "./ParameterValues/Parameter[@type='Calculation']/Calculation/Calculation/Text"

  91:
    name: "Replace Field Contents"
    template: "Replace Field Contents [ {table}::{field} ]"
    params:
      table:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference/TableOccurrenceReference"
        attr: "name"
      field:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference"
        attr: "name"

  130:
    name: "Set Selection"
    template: "Set Selection [ {table}::{field} ]"
    params:
      table:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference/TableOccurrenceReference"
        attr: "name"
      field:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference"
        attr: "name"

  # ─── Control Flow ───────────────────────────────────────────────────────────
  68:
    name: "If"
    template: "If [ {condition} ]"
    params:
      condition:
        xpath: "./ParameterValues/Parameter[@type='Calculation']/Calculation/Calculation/Text"

  125:
    name: "Else If"
    template: "Else If [ {condition} ]"
    params:
      condition:
        xpath: "./ParameterValues/Parameter[@type='Calculation']/Calculation/Calculation/Text"

  69:
    name: "Else"
    template: "Else"

  70:
    name: "End If"
    template: "End If"

  71:
    name: "Loop"
    template: "Loop"

  72:
    name: "Exit Loop If"
    template: "Exit Loop If [ {condition} ]"
    params:
      condition:
        xpath: "./ParameterValues/Parameter[@type='Calculation']/Calculation/Calculation/Text"

  73:
    name: "End Loop"
    template: "End Loop"

  103:
    name: "Exit Script"
    template: "Exit Script [ {result} ]"
    params:
      result:
        xpath: "./ParameterValues/Parameter[@type='Calculation']/Calculation/Calculation/Text"

  62:
    name: "Pause/Resume Script"
    template: "Pause/Resume Script [ {duration} ]"
    params:
      duration:
        # FM stores the duration calc under Parameter[type=Options]/Options (the
        # @type carries the "Duration (seconds): " label); empty = pause indefinitely.
        alts:
          - xpath: "./ParameterValues/Parameter[@type='Options']/Options/Calculation/Calculation/Text"
            prefix: "Duration (seconds): "

  # ─── Scripts ────────────────────────────────────────────────────────────────
  1:
    name: "Perform Script"
    template: 'Perform Script [ {file_prefix}{script} ; Parameter: {param} ]'
    params:
      file_prefix:
        xpath: "./ParameterValues/Parameter[@type='List']/List/DataSourceReference"
        attr: "name"
        suffix: ' :: '
      script:
        alts:
          - xpath: "./ParameterValues/Parameter[@type='List']/List/ScriptReference"
            attr: "name"
            prefix: '"'
            suffix: '"'
          - xpath: "./ParameterValues/Parameter[@type='List']/List/Calculation/Calculation/Text"
            prefix: "Specified: By name ; "
      param:
        xpath: "./ParameterValues/Parameter[@type='Parameter']/Parameter/Calculation/Calculation/Text"

  164:
    name: "Perform Script on Server"
    template: 'Perform Script on Server [ {file_prefix}{script} ; Parameter: {param}{wait} ]'
    params:
      file_prefix:
        xpath: "./ParameterValues/Parameter[@type='List']/List/DataSourceReference"
        attr: "name"
        suffix: ' :: '
      script:
        alts:
          - xpath: "./ParameterValues/Parameter[@type='List']/List/ScriptReference"
            attr: "name"
            prefix: '"'
            suffix: '"'
          - xpath: "./ParameterValues/Parameter[@type='List']/List/Calculation/Calculation/Text"
            prefix: "Specified: By name ; "
      param:
        xpath: "./ParameterValues/Parameter[@type='Parameter']/Parameter/Calculation/Calculation/Text"
      wait:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean[@type='Wait for completion']"
        attr: "value"
        display:
          "True": " ; Wait for completion: On"
          "False": " ; Wait for completion: Off"

  210:
    name: "Perform Script on Server with Callback"
    template: 'Perform Script on Server with Callback [ {file_prefix}{script} ]'
    params:
      file_prefix:
        xpath: "./ParameterValues/Parameter[@type='List']/List/DataSourceReference"
        attr: "name"
        suffix: ' :: '
      script:
        alts:
          - xpath: "./ParameterValues/Parameter[@type='List']/List/ScriptReference"
            attr: "name"
            prefix: '"'
            suffix: '"'
          - xpath: "./ParameterValues/Parameter[@type='List']/List/Calculation/Calculation/Text"
            prefix: "Specified: By name ; "

  148:
    name: "Install OnTimer Script"
    template: 'Install OnTimer Script [ "{script}" ; Interval: {interval} ]'
    params:
      script:
        xpath: "./ParameterValues/Parameter[@type='ScriptReference']/ScriptReference"
        attr: "name"
      interval:
        xpath: "./ParameterValues/Parameter[@type='Calculation']/Calculation/Calculation/Text"

  # ─── Navigation ─────────────────────────────────────────────────────────────
  6:
    name: "Go to Layout"
    template: 'Go to Layout [ {layout} ]'
    params:
      layout:
        # By name → "LayoutName"; by calculation → the calc (no <LayoutReference>).
        alts:
          - xpath: "./ParameterValues/Parameter[@type='LayoutReferenceContainer']/LayoutReferenceContainer/LayoutReference"
            attr: "name"
            prefix: '"'
            suffix: '"'
          - xpath: "./ParameterValues/Parameter[@type='LayoutReferenceContainer']/LayoutReferenceContainer/Calculation/Calculation/Text"

  16:
    name: "Go to Record/Request/Page"
    template: "Go to Record/Request/Page [ {target} ]"
    params:
      target:
        xpath: "./ParameterValues/Parameter[@type='Records']/List"
        attr: "name"

  17:
    name: "Go to Field"
    template: "Go to Field [ {table}::{field} ]"
    params:
      table:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference/TableOccurrenceReference"
        attr: "name"
      field:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference"
        attr: "name"

  74:
    name: "Go to Related Record"
    template: 'Go to Related Record [ {table} ; "{layout}" ]'
    # render: gtrr — also surface a layout specified BY CALCULATION (the template's static
    # LayoutReference xpath dropped a calculated layout). packet 1027.
    render: gtrr
    params:
      table:
        xpath: "./ParameterValues/Parameter[@type='Related']/TableOccurrenceReference"
        attr: "name"
      layout:
        xpath: "./ParameterValues/Parameter[@type='Related']/LayoutReferenceContainer/LayoutReference"
        attr: "name"

  99:
    # render: go_to_portal_row — the row target is a List @name under Parameter[@type='Portal']
    # (First/Last/Previous/Next/Select entry/By Calculation…), NOT Parameter[@type='Records']; the
    # old xpath found nothing and rendered [  ]. The By-Calculation… variant nests the row-number
    # calc inside the List, surfaced alongside the target. packet 1150.
    render: go_to_portal_row
    name: "Go to Portal Row"
    template: "Go to Portal Row [ {target} ]"
    params:
      target:
        xpath: "./ParameterValues/Parameter[@type='Portal']/List"
        attr: "name"

  145:
    name: "Go to Object"
    template: "Go to Object [ {object} ]"
    params:
      object:
        xpath: "./ParameterValues/Parameter[@type='Object']/Name/Calculation/Calculation/Text"

  4:
    name: "Go to Next Field"
    template: "Go to Next Field"

  5:
    name: "Go to Previous Field"
    template: "Go to Previous Field"

  # ─── Records ────────────────────────────────────────────────────────────────
  7:
    name: "New Record/Request"
    template: "New Record/Request"

  8:
    name: "Duplicate Record/Request"
    template: "Duplicate Record/Request"

  9:
    name: "Delete Record/Request"
    template: "Delete Record/Request [ With dialog: {dialog} ]"
    params:
      dialog:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  10:
    name: "Delete All Records"
    template: "Delete All Records [ With dialog: {dialog} ]"
    params:
      dialog:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  51:
    name: "Revert Record/Request"
    template: "Revert Record/Request [ With dialog: {dialog} ]"
    params:
      dialog:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  75:
    name: "Commit Records/Requests"
    template: "Commit Records/Requests [ Skip data entry: {skip} ; With dialog: {dialog} ]"
    params:
      skip:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean[@type='Skip data entry validation']"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"
      dialog:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean[@type='With dialog']"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  104:
    name: "Delete Portal Row"
    template: "Delete Portal Row [ With dialog: {dialog} ]"
    params:
      dialog:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  133:
    name: "Open Record/Request"
    template: "Open Record/Request"

  98:
    name: "Copy All Records/Requests"
    template: "Copy All Records/Requests"

  # ─── Find ───────────────────────────────────────────────────────────────────
  22:
    name: "Enter Find Mode"
    template: "Enter Find Mode [ Pause: {pause} ]"
    params:
      pause:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean[@type='Pause']"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  28:
    name: "Perform Find"
    template: "Perform Find"

  25:
    name: "Omit Record"
    template: "Omit Record"

  26:
    name: "Omit Multiple Records"
    template: "Omit Multiple Records [ With dialog: {dialog} ]"
    params:
      dialog:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  27:
    name: "Show Omitted Only"
    template: "Show Omitted Only"

  23:
    name: "Show All Records"
    template: "Show All Records"

  21:
    name: "Unsort Records"
    template: "Unsort Records"

  126:
    name: "Constrain Found Set"
    template: "Constrain Found Set"

  127:
    name: "Extend Found Set"
    template: "Extend Found Set"

  150:
    name: "Perform Quick Find"
    template: "Perform Quick Find [ {query} ]"
    params:
      query:
        xpath: "./ParameterValues/Parameter[@type='Calculation']/Calculation/Calculation/Text"

  # ─── Sort ───────────────────────────────────────────────────────────────────
  39:
    # render: sort_records — code-rendered so the SORT FIELDS (SortSpecification/SortList) are
    # surfaced, not just the dialog flag. The single-value template system can't express a
    # variable-length field list; the template below is the no-sort-list fallback shape.
    render: sort_records
    name: "Sort Records"
    template: "Sort Records [ With dialog: {dialog} ]"
    params:
      dialog:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean[@type='With dialog']"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  154:
    # render: sort_records_by_field — the sort direction (Ascending/Descending) lives in a
    # List @name that the base template dropped, and the `{table}::{field}` template printed a
    # bare `::` when no FieldReference is present (the direction-only case). The render mode adds
    # the direction and omits the field clause when absent. packet 1150.
    render: sort_records_by_field
    name: "Sort Records by Field"
    template: "Sort Records by Field [ {table}::{field} ]"
    params:
      table:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference/TableOccurrenceReference"
        attr: "name"
      field:
        xpath: "./ParameterValues/Parameter[@type='FieldReference']/FieldReference"
        attr: "name"

  # ─── Display / UI ───────────────────────────────────────────────────────────
  87:
    name: "Show Custom Dialog"
    template: "Show Custom Dialog [ {message} ]"
    params:
      message:
        xpath: "./ParameterValues/Parameter[@type='Message']/Calculation/Calculation/Text"

  80:
    name: "Refresh Window"
    template: "Refresh Window"

  79:
    name: "Freeze Window"
    template: "Freeze Window"

  81:
    name: "Scroll Window"
    template: "Scroll Window [ {position} ]"
    params:
      position:
        xpath: "./ParameterValues/Parameter[@type='List']/List"
        attr: "name"

  31:
    name: "Adjust Window"
    template: "Adjust Window [ {mode} ]"
    params:
      mode:
        xpath: "./ParameterValues/Parameter[@type='List']/List"
        attr: "name"

  97:
    name: "Set Zoom Level"
    template: "Set Zoom Level [ {level} ]"
    params:
      level:
        xpath: "./ParameterValues/Parameter[@type='List']/List"
        attr: "name"

  # 29/92/166 (Show/Hide Toolbars/Text Ruler/Menubar): the operative state is the List @name
  # (Show/Hide/Toggle), NOT a Boolean. The old Boolean xpath matched the FIRST Boolean — for
  # Toolbars an unrelated Lock flag — and ran it through a Show/Hide map, rendering the OPPOSITE
  # of the step (packet 1150). No Boolean encoding of this state exists in-window (FM 21+); the
  # List @name is already the literal word, so no display map. Do NOT add a Boolean fallback.
  29:
    name: "Show/Hide Toolbars"
    template: "Show/Hide Toolbars [ {state} ]"
    params:
      state:
        xpath: "./ParameterValues/Parameter[@type='List']/List"
        attr: "name"

  166:
    name: "Show/Hide Menubar"
    template: "Show/Hide Menubar [ {state} ]"
    params:
      state:
        xpath: "./ParameterValues/Parameter[@type='List']/List"
        attr: "name"

  92:
    name: "Show/Hide Text Ruler"
    template: "Show/Hide Text Ruler [ {state} ]"
    params:
      state:
        xpath: "./ParameterValues/Parameter[@type='List']/List"
        attr: "name"

  167:
    name: "Refresh Object"
    template: "Refresh Object [ {object} ]"
    params:
      object:
        xpath: "./ParameterValues/Parameter[@type='Object']/Name/Calculation/Calculation/Text"

  180:
    name: "Refresh Portal"
    template: "Refresh Portal [ {portal} ]"
    params:
      portal:
        xpath: "./ParameterValues/Parameter[@type='Object']/Name/Calculation/Calculation/Text"

  168:
    name: "Set Layout Object Animation"
    template: "Set Layout Object Animation [ {state} ]"
    params:
      state:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  169:
    name: "Close Popover"
    template: "Close Popover"

  146:
    name: "Set Web Viewer"
    template: "Set Web Viewer [ {object} ; {action} ]"
    params:
      object:
        xpath: "./ParameterValues/Parameter[@type='Calculation']/Calculation/Calculation/Text"
      action:
        xpath: "./ParameterValues/Parameter[@type='action']/List"
        attr: "name"

  # ─── Windows ────────────────────────────────────────────────────────────────
  122:
    name: "New Window"
    template: "New Window"
    # render: new_window — surface the target LAYOUT (a LayoutReference the bare template dropped
    # entirely) + window Style/Name. packet 1027 ("the text lies").
    render: new_window

  121:
    name: "Close Window"
    template: "Close Window [ {target} ]"
    params:
      target:
        xpath: "./ParameterValues/Parameter[@type='WindowReference']/WindowReference/Select"
        attr: "type"

  119:
    name: "Move/Resize Window"
    template: "Move/Resize Window"

  123:
    name: "Select Window"
    template: "Select Window [ {target} ]"
    params:
      target:
        xpath: "./ParameterValues/Parameter[@type='WindowReference']/WindowReference/Select"
        attr: "type"

  124:
    name: "Set Window Title"
    template: "Set Window Title [ {title} ]"
    params:
      title:
        xpath: "./ParameterValues/Parameter[@type='WindowReference']/WindowReference/Rename/Calculation/Calculation/Text"

  # ─── Error Handling ─────────────────────────────────────────────────────────
  85:
    name: "Allow User Abort"
    template: "Allow User Abort [ {state} ]"
    params:
      state:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  86:
    name: "Set Error Capture"
    template: "Set Error Capture [ {state} ]"
    params:
      state:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  200:
    name: "Set Error Logging"
    template: "Set Error Logging [ {state} ]"
    params:
      state:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  # ─── Transactions ───────────────────────────────────────────────────────────
  205:
    name: "Open Transaction"
    template: "Open Transaction"

  206:
    name: "Commit Transaction"
    template: "Commit Transaction"

  223:
    name: "Set Revert Transaction on Error"
    template: "Set Revert Transaction on Error [ {state} ]"
    params:
      state:
        xpath: "./ParameterValues/Parameter[@type='Boolean']/Boolean"
        attr: "value"
        display:
          "True": "On"
          "False": "Off"

  # ─── Files ──────────────────────────────────────────────────────────────────
  33:
    name: "Open File"
    template: 'Open File [ "{file}" ]'
    params:
      file:
        xpath: "./ParameterValues/Parameter[@type='DataSourceReference']/DataSourceReference"
        attr: "name"

  34:
    name: "Close File"
    template: 'Close File [ "{file}" ]'
    params:
      file:
        xpath: "./ParameterValues/Parameter[@type='DataSourceReference']/DataSourceReference"
        attr: "name"

  188:
    name: "Get File Exists"
    template: "Get File Exists"

  189:
    name: "Get File Size"
    template: "Get File Size"

  190:
    name: "Create Data File"
    template: "Create Data File"

  191:
    name: "Open Data File"
    template: "Open Data File"

  192:
    name: "Write to Data File"
    template: "Write to Data File"

  193:
    name: "Read from Data File"
    template: "Read from Data File"

  195:
