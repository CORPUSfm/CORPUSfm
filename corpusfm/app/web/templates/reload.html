<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Updating — CORPUSfm</title>
  <style>
    :root { --bg:#111315; --surface:#191b1d; --border:#30353a; --text:#eceef0; --dim:#9ea4aa; --primary:#b3bac1; --control:#59636c; }
    html, body { height:100%; margin:0; }
    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:20px; text-align:center; padding:24px;
    }
    .title { font-size:20px; font-weight:600; }
    .sub { color:var(--dim); max-width:440px; line-height:1.5; }
    .sub.err { color:#e06b6b; }
    .spinner {
      width:34px; height:34px; border-radius:50%;
      border:3px solid var(--border); border-top-color:var(--primary);
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .reload-btn {
      display:none; font-size:18px; font-weight:700; padding:15px 48px;
      border:none; border-radius:9px; background:var(--control); color:#fff; cursor:pointer;
      transition:filter .12s, transform .04s;
    }
    .reload-btn:hover { filter:brightness(1.08); }
    .reload-btn:active { transform:translateY(1px); }
    .reload-btn:disabled { opacity:.6; cursor:default; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="spin" class="spinner"></div>
    <div id="title" class="title">Applying update…</div>
    <div id="sub" class="sub">Pulling the latest code and restarting the app. This takes a few seconds.</div>
    <button id="btn" class="reload-btn" onclick="reloadApp()">Reload</button>
  </div>

  <script>
    // Reverse-proxy sub-path (e.g. /corpusfm). This page does not extend base.html,
    // so it has no CFM_PREFIX / fetch wrapper — prefix every URL explicitly.
    const PFX = "{{ url_prefix }}";
    const $ = (id) => document.getElementById(id);

    function showButton(title, sub) {
      $('spin').style.display = 'none';
      $('title').textContent = title;
      $('sub').textContent = sub;
      $('sub').classList.remove('err');
      $('btn').style.display = 'inline-block';
    }
    function showError(msg) {
      $('spin').style.display = 'none';
      $('title').textContent = 'Update failed';
      $('sub').textContent = msg;
      $('sub').classList.add('err');
      $('btn').textContent = 'Back';
      $('btn').style.display = 'inline-block';
      $('btn').onclick = () => { window.location.href = PFX + '/settings'; };
    }

    // Apply the update on load. The server pulls the new code and then relaunches
    // itself (os.execv) — so the connection may drop mid-response, which is the
    // expected success path, not a failure.
    async function start() {
      try {
        const r = await fetch(PFX + '/api/settings/apply-update', { method: 'POST' });
        let d = {};
        try { d = await r.json(); } catch (_) {}
        if (r.ok && d.ok) {
          showButton('Update applied', 'The app is restarting. Click Reload to reconnect.');
        } else {
          showError(d.error || 'Could not apply the update.');
        }
      } catch (e) {
        // Connection dropped while the app relaunched — expected.
        showButton('App is restarting', 'Click Reload to reconnect once it is back.');
      }
    }

    // One button, one reliable click: wait for the relaunched server to answer,
    // then go home. If it never comes back, navigate anyway after the timeout.
    async function reloadApp() {
      $('btn').disabled = true;
      $('btn').textContent = 'Reconnecting…';
      const deadline = Date.now() + 120000;
      while (Date.now() < deadline) {
        try {
          const r = await fetch(PFX + '/', { cache: 'no-store' });
          if (r.ok) { window.location.href = PFX + '/'; return; }
        } catch (_) { /* still down — keep trying */ }
        await new Promise((res) => setTimeout(res, 1000));
      }
      window.location.href = PFX + '/';
    }

    start();
  </script>
</body>
</html>
