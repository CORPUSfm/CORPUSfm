<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re-encoding — CORPUSfm</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_prefix }}/static/corpusfm-node-icon.svg">
  <style>
    :root { --bg:#111315; --surface:#191b1d; --border:#30353a; --text:#eceef0; --dim:#9ea4aa; --primary:#59636c; }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:30px 34px;max-width:560px;width:100%;text-align:center;}
    h1{font-size:20px;margin:0 0 8px;}
    p{color:var(--dim);line-height:1.55;margin:8px 0;}
    .count{font-variant-numeric:tabular-nums;color:var(--text);margin-top:14px;font-size:14px;}
    .bar{height:14px;background:var(--border);border-radius:7px;overflow:hidden;margin-top:20px;}
    .bar-fill{height:100%;width:0;background:var(--primary);border-radius:7px;transition:width .3s;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Re-encoding stored data…</h1>
      <p>CORPUSfm is re-encoding every stored blob to the new encryption setting. The app is
         locked for everyone until this finishes — it's safe to leave this tab open or come
         back later; the conversion keeps running on the server.</p>
      <div class="bar"><div class="bar-fill" id="bar"></div></div>
      <div class="count" id="count">Starting…</div>
      <p id="err" style="color:#e0726a;display:none"></p>
    </div>
  </div>
  <script>
    (function () {
      var pfx = "{{ url_prefix }}";
      var statusUrl = pfx + "/api/settings/storage/blob-encryption/status";
      var settingsUrl = pfx + "/settings#storage";
      var bar = document.getElementById("bar");
      var count = document.getElementById("count");
      var errEl = document.getElementById("err");
      function poll() {
        fetch(statusUrl, { credentials: "same-origin", cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var pct = (typeof d.pct === "number") ? d.pct : 0;
            bar.style.width = pct + "%";
            if (d.total) {
              count.textContent = d.done + " / " + d.total + " records — " + pct + "%";
            } else {
              count.textContent = "Preparing…";
            }
            if (d.error) {
              errEl.style.display = "block";
              errEl.textContent = "Conversion error: " + d.error;
            }
            if (!d.running) {
              bar.style.width = "100%";
              count.textContent = "Done — returning to Settings…";
              setTimeout(function () { window.location.href = settingsUrl; }, 900);
              return;
            }
            setTimeout(poll, 1000);
          })
          .catch(function () { setTimeout(poll, 1500); });
      }
      poll();
    })();
  </script>
</body>
</html>
