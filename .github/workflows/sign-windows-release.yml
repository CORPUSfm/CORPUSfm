# Packet 1380-03 - the PUBLIC Windows signing lane. ENABLED SOURCE, HELD BY TWO PROTECTED ENVIRONMENTS.
#
# Authored here, in the private application's site/ authority, and projected to the public repository
# root through SITE_FILES. The two sibling workflows pin mutable tags; this one pins immutable SHAs.
# Two conventions in one directory, on purpose (parent 1380 section 4.4). Every pinned SHA below is the
# one the private shipping lane used at installer 9b9341f, in the run that passed the private gates.
#
# THE DEVELOPER-APPROVED BOOTSTRAP (1380-03 section 14.4), and what each rule defends:
#
#   1. A push to ONE named candidate branch runs the `gate` job only: harmless checks, no permissions,
#      no checkout, no secret, no OIDC. It can succeed. It exists so the workflow has run once on that
#      ref, which the GitHub documentation says a later API/CLI dispatch on that ref needs. That this
#      works here is an INFERENCE, unmeasured.
#   2. Build is reachable only by workflow_dispatch, on that exact ref, in the exact public repository
#      - identified by its immutable repository id, not only by its renameable name.
#   3. No pull request, fork, tag, schedule or other event reaches build or signing. None is a trigger,
#      the gate refuses them anyway, and the job conditions restate the rule.
#   4. No workflow expression is interpolated into shell text. The gate compares the runner's own
#      GITHUB_* variables exactly and case-sensitively; GitHub's expression equality is
#      case-insensitive, so the job `if:` lines are a restatement, not the authority.
#
# WHAT A RUN CAN DO. A push can pass the gate and nothing else. A valid dispatch can stage the
# UNSIGNED candidate and its inventory; every later job restates the same dispatch predicate in its
# own `if:` and needs every job before it. `sign` - the only job before Pages with id-token - runs only
# once a reviewer approves the `public-windows-signing` environment; that approval is the signing
# approval and covers `sign` alone. `finalize`, `verify`, `pages_prepare` and `pages_package` then
# follow with contents: read only: they adopt and finalize, independently re-prove on Windows, prepare
# the release-specific site for review, and package it as this run's undeployed Pages artifact.
# `pages_deploy` - the only job with pages: write - waits for a SEPARATE approval of the `github-pages`
# environment, which is the release's Pages approval and never part of the signing approval. Release
# upload and publication are not jobs here: they are the operator's later, separately approved
# commands. Each digest the operator must compare is printed once, in full, by the step that produces
# it, as `CFM-DIGEST <key>=<sha256> run=<id> attempt=<n> commit=<sha>`, so it is read from the producing
# job's log and never from the artifact it binds. The gate's own log wording predates this enablement
# and is kept byte for byte; the job conditions below decide what runs.
#
# This source makes no claim that either environment, its reviewers or branch policy, or the
# federated credential is configured or effective, and no claim of a live signing run or Windows proof.
# Those are configuration and run evidence held outside this file.
name: Sign public Windows release

on:
  push:
    branches: [public-signing-candidate]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sign-windows-release
  cancel-in-progress: false

jobs:
  gate:
    name: Confirm the repository, ref and event
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse anything but the exact repository, candidate ref and event
        shell: bash
        run: |
          set -euo pipefail
          refuse() { echo "  x $1"; exit 1; }
          [ "${GITHUB_REPOSITORY_ID:-}" = "1342406426" ] || refuse 'Only the public release repository (id 1342406426) may run this lane.'
          [ "${GITHUB_REPOSITORY:-}" = "CORPUSfm/CORPUSfm" ] || refuse 'Only CORPUSfm/CORPUSfm may run this lane.'
          [ "${GITHUB_REF:-}" = "refs/heads/public-signing-candidate" ] || refuse 'Only refs/heads/public-signing-candidate may run this lane.'
          case "${GITHUB_EVENT_NAME:-}" in
            push)
              echo 'Push: initialization and checks only. Build is manual-dispatch-only; signing is disabled.' ;;
            workflow_dispatch)
              echo 'Manual dispatch: the unsigned build is eligible; signing is disabled in this lane.' ;;
            *)
              refuse 'Only a push to the candidate branch or a manual dispatch may run this lane.' ;;
          esac

  build:
    name: Stage the unsigned public candidate and its signing inventory
    needs: gate
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1342406426' && github.repository == 'CORPUSfm/CORPUSfm' && github.ref == 'refs/heads/public-signing-candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The enforced inventory's digest: the only thing the signing job may trust the request by.
    outputs:
      inventory_sha256: ${{ steps.enforce.outputs.inventory_sha256 }}
      candidate_tar_sha256: ${{ steps.assemble.outputs.candidate_tar_sha256 }}
    steps:
      # The commit is the one this run was started for, never a moving branch tip and never an input.
      # Full depth, because the shipped Git bundle is the whole history. No credential is left behind.
      - name: Check out exactly the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the checkout is the triggering commit and is clean
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo '  x the checkout is not the triggering commit'; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=all)" ] || { echo '  x the checkout is not clean'; exit 1; }
          echo "Checked out $GITHUB_SHA."

      # THE PACKAGER BUILDS ONLY FROM ITS OWN `main` (`package-installer.sh` refuses otherwise), and
      # public `main` must not move before the release gates pass. So staging runs in a throwaway
      # clone whose local `main` IS the triggering commit - the idiom the packager already uses for
      # the application side, and the one section 11.4 recorded. Nothing is pushed; the clone lives
      # in RUNNER_TEMP. The version comes from the commit's own release-build.txt; nothing here
      # selects one.
      - name: Stage the unsigned candidate (no signing, no finalization)
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/build"
          git clone --quiet --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$build"
          git -C "$build" checkout --quiet -B main "$GITHUB_SHA"
          [ "$(git -C "$build" rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo '  x the build clone is not the triggering commit'; exit 1; }
          cd "$build"
          ./installer/package-installer.sh \
            --application-checkout "$build" \
            --application-commit "$GITHUB_SHA" \
            --stage-signing-candidate "$RUNNER_TEMP/candidate"

      # The inventory authority is `installer/windows_signing.py` from this same commit; this step
      # adds no second table. It re-reads what staging wrote and refuses unless every fact the
      # signer will rely on is exactly true. STAGE VALIDATION IS NOT A SUBSTITUTE for the same
      # enforcement inside the privileged job after download (see the `sign` job).
      - name: Enforce the inventory, the record seal and the public closure
        id: enforce
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, sys
          from pathlib import Path

          def refuse(message):
              print(f"  x {message}")
              sys.exit(1)

          temp = Path(os.environ["RUNNER_TEMP"])
          build, candidate, commit = temp / "build", temp / "candidate", os.environ["GITHUB_SHA"]
          spec = importlib.util.spec_from_file_location("windows_signing", build / "installer" / "windows_signing.py")
          ws = importlib.util.module_from_spec(spec)
          sys.modules["windows_signing"] = ws
          spec.loader.exec_module(ws)
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()

          # The approved public closure. The module's table must agree with it, not replace it.
          if (ws.EXPECTED_OCCURRENCES, ws.EXPECTED_DISTINCT_STREAMS) != (11, 10):
              refuse("the inventory module no longer describes 11 occurrences over 10 streams")
          try:
              inventory = ws.read_inventory(candidate)
              ws.assert_records_sealed(candidate)
          except ws.Refusal as refusal:
              refuse(str(refusal))
          if inventory.get("signed") is not False:
              refuse("the staged inventory is not an unsigned inventory")

          table = {}
          for occurrence in ws.OCCURRENCES:
              table.setdefault(occurrence.stream, []).append(
                  {"ordinal": occurrence.ordinal, "path": occurrence.path, "location": occurrence.location})
          rows = {row["stream"]: row for row in inventory["streams"]}
          if len(rows) != len(inventory["streams"]) or set(rows) != set(table):
              refuse(f"the inventory streams differ from the table: {sorted(set(rows) ^ set(table))}")
          if sum(len(v) for v in table.values()) != 11 or len(table) != 10:
              refuse("the occurrence table is not 11 occurrences over 10 streams")
          shared = {stream: [o["ordinal"] for o in occ] for stream, occ in table.items() if len(occ) > 1}
          if shared != {"cfm-lib": [2, 5]}:
              refuse(f"the shared-library mapping is not cfm-lib -> [2, 5]: {shared}")

          sign_dir = candidate / ws.SIGN_DIRNAME
          expected_files = {row["file"] for row in rows.values()}
          present = {p.name for p in sign_dir.iterdir()} if sign_dir.is_dir() else set()
          if present != expected_files:
              refuse(f"the signing set differs from the inventory: {sorted(present ^ expected_files)}")
          for stream, row in rows.items():
              if row["file"] != f"{stream}.ps1" or row.get("signed_sha256") is not None:
                  refuse(f"stream {stream} has a malformed row")
              if sorted(row["occurrences"], key=lambda o: o["ordinal"]) != table[stream]:
                  refuse(f"stream {stream} maps to occurrences other than the table's")
              if sha(sign_dir / row["file"]) != row["unsigned_sha256"]:
                  refuse(f"stream {stream} does not match its recorded digest")
              for occurrence in row["occurrences"]:
                  path = candidate / occurrence["path"]
                  if not path.is_file() or sha(path) != row["unsigned_sha256"]:
                      refuse(f"occurrence {occurrence['ordinal']} ({occurrence['path']}) is not stream {stream}")

          signable = {o.path for o in ws.OCCURRENCES}
          if ws._non_signable_manifest(candidate, signable) != inventory["non_signable_sha256"]:
              refuse("candidate content outside the signing set changed after staging")

          record = json.loads((candidate / "candidate.json").read_text(encoding="utf-8"))
          if record.get("commit") != commit or record.get("installer_source_commit") != commit:
              refuse("the staged identity is not the triggering commit")
          if record.get("package_kind") != "ordinary" or record.get("bridge_target_series") is not None:
              refuse("the staged candidate is not an ordinary package")
          for platform, facts in record["platforms"].items():
              for part in ("outer", "runtime"):
                  root = candidate / platform / part
                  now = sorted(p.relative_to(root).as_posix() for p in root.rglob("*")
                               if p.is_file() and os.access(p, os.X_OK))
                  if now != facts[f"executable_{part}"]:
                      refuse(f"{platform} {part} modes differ from the staged record")
          members = {p: set(record["platforms"][p]["runtime_members"]) for p in ("linux", "windows")}
          retained = {
              "windows": {"installer/bootstrap/windows/bootstrap.ps1", "installer/windows/corpusfm-recovery.ps1",
                          "installer/windows/corpusfm-proxy.ps1"},
              "linux": {"installer/bootstrap/linux/bootstrap.sh", "installer/linux/corpusfm-recovery.sh",
                        "installer/linux/corpusfm-proxy.sh"},
          }
          for platform, needed in retained.items():
              if not needed <= members[platform]:
                  refuse(f"{platform} lost a packaged bootstrap or recovery/proxy member: {sorted(needed - members[platform])}")

          # D14: no standalone distribution on either platform, and staging built no package.
          if (build / "outputs").exists():
              refuse("staging produced distribution outputs")
          allowed_top = {"windows", "linux", "payload", ws.SIGN_DIRNAME, "candidate.json", ws.INVENTORY_NAME}
          top = {p.name for p in candidate.iterdir()}
          if top != allowed_top:
              refuse(f"the candidate root is not the staged layout: {sorted(top ^ allowed_top)}")
          stray = sorted(p.relative_to(candidate).as_posix() for p in candidate.rglob("*.ps1")
                         if p.relative_to(candidate).as_posix() not in signable
                         and p.parent != sign_dir)
          if stray:
              refuse(f"PowerShell outside the inventory: {stray}")

          for path in sorted(candidate.rglob("*")):
              if not path.is_file():
                  continue
              if path.name in {".git-pat", ".git-pat-helper", ".git-credentials"}:
                  refuse(f"credential artifact in the candidate: {path}")
              data = path.read_bytes().lower()
              # The private name is split so this file itself passes the projection's identity scan.
              if b"github_pat_" in data or b"ghp_" in data or (b"private_" + b"filemaker_app") in data:
                  refuse(f"credential or private identity text in {path.relative_to(candidate)}")
          print("Inventory enforced: 11 occurrences, 10 streams, cfm-lib -> [2, 5]; record seal intact.")
          PY
          digest="$(sha256sum "$RUNNER_TEMP/candidate/windows-signing-inventory.json" | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo '  x could not digest the enforced inventory'; exit 1; }
          echo "inventory_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "Enforced inventory sha256: $digest"

      # Two named artifacts of THIS run. The signing request holds exactly the inventory and the ten
      # streams it names - no application bundle, asset payload or other file. The full candidate
      # travels as one tar, because artifact storage does not keep POSIX modes.
      - name: Assemble the signing request and the candidate archive
        id: assemble
        shell: bash
        env:
          CFM_ENFORCED_INVENTORY_SHA256: ${{ steps.enforce.outputs.inventory_sha256 }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/request"; handoff="$RUNNER_TEMP/handoff"
          mkdir -p "$request/sign" "$handoff"
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          candidate, request = temp / "candidate", temp / "request"
          inventory = json.loads((candidate / "windows-signing-inventory.json").read_text(encoding="utf-8"))
          files = sorted(row["file"] for row in inventory["streams"])
          if len(files) != 10:
              sys.exit("  x the inventory does not name ten streams")
          for name in files:
              source = candidate / "sign" / name
              if not source.is_file():
                  sys.exit(f"  x signing request member missing: {name}")
              shutil.copyfile(source, request / "sign" / name)
          shutil.copyfile(candidate / "windows-signing-inventory.json", request / "windows-signing-inventory.json")
          members = sorted(p.relative_to(request).as_posix() for p in request.rglob("*") if p.is_file())
          if members != sorted(["windows-signing-inventory.json"] + [f"sign/{n}" for n in files]):
              sys.exit(f"  x the signing request is not exactly the inventory and its streams: {members}")
          print(f"Signing request: {len(members)} members.")
          PY
          copied="$(sha256sum "$request/windows-signing-inventory.json" | cut -d ' ' -f 1)"
          [ "$copied" = "$CFM_ENFORCED_INVENTORY_SHA256" ] || { echo '  x the request inventory is not the enforced inventory'; exit 1; }
          tar -C "$RUNNER_TEMP" -cf "$handoff/public-release-candidate.tar" candidate
          ( cd "$handoff" && sha256sum public-release-candidate.tar > public-release-candidate.tar.sha256 )
          cat "$handoff/public-release-candidate.tar.sha256"
          echo "candidate_tar_sha256=$(cut -d ' ' -f 1 "$handoff/public-release-candidate.tar.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish the signing request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-windows-signing-request
          path: ${{ runner.temp }}/request
          if-no-files-found: error
          retention-days: 30

      - name: Publish the unsigned candidate archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-release-candidate
          path: |
            ${{ runner.temp }}/handoff/public-release-candidate.tar
            ${{ runner.temp }}/handoff/public-release-candidate.tar.sha256
          if-no-files-found: error
          retention-days: 30

  # ENABLED, AND HELD BY ITS PROTECTED ENVIRONMENT. Only a valid dispatch satisfies the predicate, and
  # the job then waits for a reviewer to approve `public-windows-signing` - the signing approval, which
  # approves this job alone. It holds id-token: write so Azure login can use OIDC, and nothing else
  # beyond contents: read. The environment fixes the OIDC subject:
  #   repo:CORPUSfm@319681410/CORPUSfm@1342406426:environment:public-windows-signing
  #
  # NO CHECKOUT, BY DESIGN. The job's own step scripts are this workflow's content, from the triggering
  # commit; the request is DATA to be checked and later signed, and is never executed, dot-sourced or
  # evaluated. The build job's validation happened in another job, across artifact storage this job
  # does not own, so everything is re-enforced here, BEFORE any Azure step exists or runs.
  sign:
    name: Sign and verify (awaits the public-windows-signing approval)
    needs: [gate, build]
    if: (github.event_name == 'workflow_dispatch' && github.repository_id == '1342406426' && github.repository == 'CORPUSfm/CORPUSfm' && github.ref == 'refs/heads/public-signing-candidate')
    runs-on: windows-2025
    environment: public-windows-signing
    permissions:
      contents: read
      id-token: write
    # The verified report's digest and the trust record's: the only things finalize trusts the signed
    # handoff by. A checksum carried inside the artifact is rewritten with the artifact.
    outputs:
      signature_report_sha256: ${{ steps.handoff.outputs.signature_report_sha256 }}
      trust_record_sha256: ${{ steps.handoff.outputs.trust_record_sha256 }}
    steps:
      # Only the named request artifact of THIS run: no run id, repository, token or pattern selects
      # anything else, and the full candidate is not downloaded here.
      - name: Download only this run's signing request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-windows-signing-request
          path: ${{ runner.temp }}/request

      # The inventory is trusted only because its bytes hash to the digest the BUILD job computed after
      # enforcing it, passed as a job output. A checksum carried inside the artifact would prove
      # nothing. The catalog exists only after every check passes; any failure removes it.
      - name: Validate the request against the build's enforced inventory, then write the catalog
        shell: powershell
        env:
          CFM_EXPECTED_INVENTORY_SHA256: ${{ needs.build.outputs.inventory_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Join-Path $env:RUNNER_TEMP 'request'
          $signDir = Join-Path $request 'sign'
          $inventoryName = 'windows-signing-inventory.json'
          $inventoryPath = Join-Path $request $inventoryName
          $catalog = Join-Path $signDir 'sign-catalog.txt'
          $partial = Join-Path $env:RUNNER_TEMP 'sign-catalog.partial'
          $safeStream = '^[a-z0-9]+(-[a-z0-9]+)*$'
          $safeFile = '^[a-z0-9]+(-[a-z0-9]+)*\.ps1$'

          function Refuse([string]$message) { throw ('signing request refused: ' + $message) }
          function Test-Int($value) { return (($value -is [int]) -or ($value -is [long])) }
          function Assert-Field($object, [string]$name, [string]$what) {
            if ($null -eq $object -or -not (@($object.PSObject.Properties.Name) -ccontains $name)) {
              Refuse ($what + ' has no ' + $name + ' field')
            }
          }
          function Assert-NotLink($item) {
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              Refuse ($item.Name + ' is a link or reparse point')
            }
          }
          # CLEANUP NEVER FOLLOWS A LINK. It may run before, or because, the layout was refused, so it
          # re-proves each directory on the way down without resolving anything: a path is used only
          # if every component below RUNNER_TEMP is a real directory, and only a plain regular file is
          # deleted - by the .NET file API, which cannot recurse. Anything else is left untouched; the
          # step fails regardless, so nothing downstream can consume it.
          function Test-PlainDirectory([string]$path) {
            if (-not (Test-Path -LiteralPath $path)) { return $false }
            $item = Get-Item -LiteralPath $path -Force
            return ($item.PSIsContainer -and -not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint))
          }
          function Remove-PlainFile([string]$path, [string[]]$parents) {
            foreach ($parent in $parents) { if (-not (Test-PlainDirectory $parent)) { return } }
            if (-not (Test-Path -LiteralPath $path)) { return }
            $item = Get-Item -LiteralPath $path -Force
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { return }
            [IO.File]::Delete($item.FullName)
          }
          function Remove-StaleCatalogs {
            Remove-PlainFile $partial @($env:RUNNER_TEMP)
            Remove-PlainFile $catalog @($env:RUNNER_TEMP, $request, $signDir)
          }

          try {
            Remove-PlainFile $partial @($env:RUNNER_TEMP)
            if (Test-Path -LiteralPath $partial) { Refuse 'a stale partial catalog could not be removed safely' }

            # 1. The binding comes from the build job, never from the artifact.
            $expected = [string]$env:CFM_EXPECTED_INVENTORY_SHA256
            if ($expected -cnotmatch '^[0-9a-f]{64}$') {
              Refuse 'the build job supplied no well-formed inventory digest'
            }

            # 2. Layout first: exactly the inventory and one flat directory of regular files, no links.
            if (-not (Test-Path -LiteralPath $request -PathType Container)) { Refuse 'the request directory is missing' }
            Assert-NotLink (Get-Item -LiteralPath $request -Force)
            $top = @(Get-ChildItem -LiteralPath $request -Force)
            foreach ($item in $top) { Assert-NotLink $item }
            $topSign = @($top | Where-Object { $_.Name -ceq 'sign' -and $_.PSIsContainer })
            $topInventory = @($top | Where-Object { $_.Name -ceq $inventoryName -and -not $_.PSIsContainer })
            if ($top.Count -ne 2 -or $topSign.Count -ne 1 -or $topInventory.Count -ne 1) {
              Refuse ('the request root is not exactly sign/ and ' + $inventoryName + ': ' +
                      ((@($top | ForEach-Object { $_.Name }) | Sort-Object) -join ', '))
            }
            $members = @(Get-ChildItem -LiteralPath $signDir -Force)
            foreach ($item in $members) {
              Assert-NotLink $item
              if ($item.PSIsContainer) { Refuse ('nested directory in the request: ' + $item.Name) }
              if ($item.Name -cnotmatch $safeFile) { Refuse ('unexpected or unsafe request member: ' + $item.Name) }
            }

            # 3. The inventory bytes must be the enforced ones BEFORE anything in them is believed.
            $actualDigest = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualDigest -cne $expected) {
              Refuse ('the downloaded inventory is not the one the build enforced (' + $actualDigest + ')')
            }

            # 4. Two-step parse: on 5.1, ConvertFrom-Json emits a parsed array as ONE object, so the
            #    result is assigned before anything is enumerated.
            $raw = Get-Content -LiteralPath $inventoryPath -Raw
            $parsed = ConvertFrom-Json -InputObject $raw
            if ($parsed -is [System.Array]) { Refuse 'the inventory is not a JSON object' }
            foreach ($field in @('schema_version', 'signed', 'occurrence_count', 'distinct_stream_count', 'streams')) {
              Assert-Field $parsed $field 'the inventory'
            }
            if (-not (Test-Int $parsed.schema_version) -or $parsed.schema_version -ne 1) { Refuse 'the inventory is not schema 1' }
            if (-not ($parsed.signed -is [bool]) -or $parsed.signed) { Refuse 'the inventory is not unsigned' }
            if (-not (Test-Int $parsed.occurrence_count) -or $parsed.occurrence_count -ne 11) { Refuse 'the inventory does not record 11 occurrences' }
            if (-not (Test-Int $parsed.distinct_stream_count) -or $parsed.distinct_stream_count -ne 10) { Refuse 'the inventory does not record 10 distinct streams' }
            $streams = @($parsed.streams)
            if ($streams.Count -ne 10) { Refuse ('the inventory lists ' + $streams.Count + ' streams, not 10') }

            $seenStreams = @{}; $seenFiles = @{}; $seenOrdinals = @{}; $seenPaths = @{}
            $shared = @()
            foreach ($row in $streams) {
              foreach ($field in @('stream', 'file', 'unsigned_sha256', 'signed_sha256', 'occurrences')) {
                Assert-Field $row $field 'a stream row'
              }
              $stream = [string]$row.stream
              if (-not ($row.stream -is [string]) -or $stream -cnotmatch $safeStream) { Refuse ('unsafe stream name: ' + $stream) }
              if (-not ($row.file -is [string]) -or [string]$row.file -cne ($stream + '.ps1')) { Refuse ('stream ' + $stream + ' names file ' + $row.file) }
              if ($seenStreams.ContainsKey($stream.ToLowerInvariant())) { Refuse ('duplicate stream: ' + $stream) }
              $seenStreams[$stream.ToLowerInvariant()] = $true
              if ($seenFiles.ContainsKey(([string]$row.file).ToLowerInvariant())) { Refuse ('duplicate file: ' + $row.file) }
              $seenFiles[([string]$row.file).ToLowerInvariant()] = $true
              if (-not ($row.unsigned_sha256 -is [string]) -or [string]$row.unsigned_sha256 -cnotmatch '^[0-9a-f]{64}$') { Refuse ('stream ' + $stream + ' has a malformed unsigned digest') }
              if ($null -ne $row.signed_sha256) { Refuse ('stream ' + $stream + ' is already signed') }
              $occurrences = @($row.occurrences)
              if ($occurrences.Count -lt 1) { Refuse ('stream ' + $stream + ' has no occurrence') }
              foreach ($occ in $occurrences) {
                foreach ($field in @('ordinal', 'path', 'location')) { Assert-Field $occ $field ('an occurrence of ' + $stream) }
                if (-not (Test-Int $occ.ordinal) -or $occ.ordinal -lt 1 -or $occ.ordinal -gt 11) { Refuse ('stream ' + $stream + ' has an invalid ordinal') }
                if ($seenOrdinals.ContainsKey([string]$occ.ordinal)) { Refuse ('duplicate ordinal: ' + $occ.ordinal) }
                $seenOrdinals[[string]$occ.ordinal] = $true
                $path = [string]$occ.path
                if (-not ($occ.path -is [string]) -or $path -cnotmatch '^windows/(outer|runtime)/[A-Za-z0-9_./-]+\.ps1$' -or
                    $path -match '(^|/)\.\.?(/|$)' -or $path -match '//') { Refuse ('unsafe occurrence path: ' + $path) }
                if ([string]$occ.location -cne $path.Split('/')[1]) { Refuse ('occurrence ' + $occ.ordinal + ' location disagrees with its path') }
                if ($seenPaths.ContainsKey($path.ToLowerInvariant())) { Refuse ('duplicate occurrence path: ' + $path) }
                $seenPaths[$path.ToLowerInvariant()] = $true
              }
              if ($occurrences.Count -gt 1) { $shared += ,$row }
            }
            if ($seenOrdinals.Count -ne 11) { Refuse ('the inventory covers ' + $seenOrdinals.Count + ' occurrences, not 11') }
            if ($shared.Count -ne 1 -or [string]$shared[0].stream -cne 'cfm-lib') { Refuse 'the shared library is not the one stream with several occurrences' }
            $sharedOrdinals = @(@($shared[0].occurrences) | ForEach-Object { [int]$_.ordinal } | Sort-Object)
            $sharedPaths = @(@($shared[0].occurrences) | Where-Object { ([string]$_.path).EndsWith('/_cfm_lib.ps1') })
            if (($sharedOrdinals -join ',') -cne '2,5' -or $sharedPaths.Count -ne 2) { Refuse 'cfm-lib is not exactly occurrences 2 and 5 of _cfm_lib.ps1' }

            # 5. The files on disk are exactly the inventory's, in both directions and in exact case.
            $expectedNames = [string[]]@($streams | ForEach-Object { [string]$_.file } | Sort-Object)
            $actualNames = [string[]]@($members | ForEach-Object { $_.Name } | Sort-Object)
            $difference = @(Compare-Object -CaseSensitive $expectedNames $actualNames)
            if ($difference.Count -ne 0 -or $expectedNames.Count -ne $actualNames.Count) {
              Refuse ('the request files differ from the inventory: ' +
                      (($difference | ForEach-Object { $_.SideIndicator + ' ' + $_.InputObject }) -join '; '))
            }
            $signRoot = [IO.Path]::GetFullPath($signDir)
            foreach ($row in $streams) {
              $path = Join-Path $signDir ([string]$row.file)
              if ([IO.Path]::GetDirectoryName([IO.Path]::GetFullPath($path)) -cne $signRoot.TrimEnd([IO.Path]::DirectorySeparatorChar)) {
                Refuse ($row.file + ' resolves outside the request')
              }
              $bytes = [IO.File]::ReadAllBytes($path)
              if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { Refuse ($row.file + ' carries a UTF-8 BOM') }
              foreach ($b in $bytes) { if ($b -gt 0x7F) { Refuse ($row.file + ' is not ASCII') } }
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -cne [string]$row.unsigned_sha256) { Refuse ($row.file + ' does not match its recorded unsigned digest') }
            }

            # 6. Only now: the explicit catalog, names relative to it, written aside and moved in.
            Set-Content -LiteralPath $partial -Value $expectedNames -Encoding ASCII
            Move-Item -LiteralPath $partial -Destination $catalog
            Write-Host ('Signing request validated; ' + $expectedNames.Count + ' streams catalogued.')
            Get-Content -LiteralPath $catalog
          } catch {
            Remove-StaleCatalogs
            throw
          }

      # The signed bytes replace the request files in place, so the validated unsigned bytes are kept
      # aside for the post-signing body comparison. Re-bound to the build's digest; nothing is trusted
      # from the request that the validation step did not already prove.
      - name: Preserve the validated unsigned streams
        shell: powershell
        env:
          CFM_EXPECTED_INVENTORY_SHA256: ${{ needs.build.outputs.inventory_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Join-Path $env:RUNNER_TEMP 'request'
          $signDir = Join-Path $request 'sign'
          $inventoryPath = Join-Path $request 'windows-signing-inventory.json'
          $unsignedDir = Join-Path $env:RUNNER_TEMP 'unsigned-evidence'
          $expected = [string]$env:CFM_EXPECTED_INVENTORY_SHA256
          if ($expected -cnotmatch '^[0-9a-f]{64}$') { throw 'the build job supplied no well-formed inventory digest' }
          if ((Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) {
            throw 'the inventory changed after validation'
          }
          if (Test-Path -LiteralPath $unsignedDir) { throw 'unsigned evidence already exists; refusing to reuse it' }
          New-Item -ItemType Directory -Path $unsignedDir | Out-Null
          $parsed = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $inventoryPath -Raw)
          foreach ($row in @($parsed.streams)) {
            $target = Join-Path $unsignedDir ([string]$row.file)
            [IO.File]::WriteAllBytes($target, [IO.File]::ReadAllBytes((Join-Path $signDir ([string]$row.file))))
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$row.unsigned_sha256) {
              throw ([string]$row.file + ' does not match its recorded unsigned digest')
            }
          }
          Write-Host ('Preserved ' + @($parsed.streams).Count + ' validated unsigned streams.')

      # OIDC federation only, for the PUBLIC lane's own Entra registration (parent 1380 section 4.3,
      # D16): subject repo:CORPUSfm@319681410/CORPUSfm@1342406426:environment:public-windows-signing.
      # This source does not claim that these variables, that registration or its federated credential
      # exist. The job's id-token: write is the only token authority, and it is reached only after the
      # environment approval. No secret, PFX, PAT or other credential exists or is accepted here.
      - name: Azure login (OIDC federation only - public lane)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ vars.CFM_PUBLIC_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.CFM_PUBLIC_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.CFM_PUBLIC_SIGNING_SUBSCRIPTION_ID }}

      # Signs exactly the validated catalog - never a folder glob re-evaluated at signing time. Account,
      # profile and endpoint are the approved trust authority (parent 1380 section 4.3). Only the Azure
      # CLI credential is enabled; every other source is excluded explicitly, including the ones whose
      # default already excludes them.
      - name: Sign and timestamp the validated catalog
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: corpusfm-public-signing
          certificate-profile-name: corpusfm-public-trust
          files-catalog: ${{ runner.temp }}/request/sign/sign-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # FAIL-CLOSED VERIFICATION. Every failure is collected, the report is always written, and any
      # failure fails the step. The publisher is enforced by the SHA-256 of the measured subject
      # (parent 1380 section 4.2A; stable across leaf rotation, unlike the thumbprint, which is only
      # recorded): the projection scan admits the holder's name only in NOTICE. A timestamp
      # countersigner shows a countersignature exists; it is not independent proof of RFC 3161 format,
      # which is what the signing action was asked to apply.
      - name: Verify every signature, the publisher, EKU, timestamp and membership
        shell: powershell
        env:
          CFM_EXPECTED_INVENTORY_SHA256: ${{ needs.build.outputs.inventory_sha256 }}
          CFM_RUN_ID: ${{ github.run_id }}
          CFM_RUN_ATTEMPT: ${{ github.run_attempt }}
          CFM_RUN_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $CODE_SIGNING_EKU = '1.3.6.1.5.5.7.3.3'
          $EXPECTED_PUBLISHER_SUBJECT_SHA256 = '911b55f39a0fd5e400251f1a511374123851e9901c1ada719ff2109346b66429'
          $SIG_BEGIN = '# SIG # Begin signature block'
          $request = Join-Path $env:RUNNER_TEMP 'request'
          $signDir = Join-Path $request 'sign'
          $inventoryPath = Join-Path $request 'windows-signing-inventory.json'
          $catalogPath = Join-Path $signDir 'sign-catalog.txt'
          $unsignedDir = Join-Path $env:RUNNER_TEMP 'unsigned-evidence'
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'signature-evidence'
          $reportPath = Join-Path $evidenceDir 'signature-report.json'
          $failures = New-Object System.Collections.ArrayList
          $rows = New-Object System.Collections.ArrayList
          function Add-Failure([string]$message) { [void]$failures.Add($message) }
          function Get-Sha256Bytes([byte[]]$bytes) {
            $algorithm = [Security.Cryptography.SHA256]::Create()
            try { return (($algorithm.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') }) -join '') }
            finally { $algorithm.Dispose() }
          }
          function Get-Sha256Text([string]$text) { return (Get-Sha256Bytes ([Text.Encoding]::UTF8.GetBytes($text))) }
          function Get-Utc($value) { if ($null -eq $value) { return $null }; return ([datetime]$value).ToUniversalTime().ToString('o') }
          function Trim-LineEnds([byte[]]$bytes) {
            $end = $bytes.Length
            while ($end -gt 0 -and ($bytes[$end - 1] -eq 13 -or $bytes[$end - 1] -eq 10)) { $end-- }
            if ($end -eq 0) { return ,([byte[]]@()) }
            return ,([byte[]]$bytes[0..($end - 1)])
          }
          function Test-SameBytes([byte[]]$a, [byte[]]$b) {
            if ($a.Length -ne $b.Length) { return $false }
            for ($i = 0; $i -lt $a.Length; $i++) { if ($a[$i] -ne $b[$i]) { return $false } }
            return $true
          }
          function Find-SignatureBlock([byte[]]$bytes) {
            $needle = [Text.Encoding]::ASCII.GetBytes($SIG_BEGIN)
            for ($i = 0; $i -le $bytes.Length - $needle.Length; $i++) {
              $hit = $true
              for ($j = 0; $j -lt $needle.Length; $j++) { if ($bytes[$i + $j] -ne $needle[$j]) { $hit = $false; break } }
              if ($hit) { return $i }
            }
            return -1
          }

          $inventoryDigest = $null; $catalogDigest = $null; $streams = @(); $expectedNames = @()
          $signtoolPath = $null; $signtoolExit = $null; $signtoolOutput = $null
          $counts = [ordered]@{ verified = $null; warnings = $null; errors = $null }
          $occurrenceTotal = 0
          $membershipOk = $false
          # The leaf's own DER bytes, kept from the first stream that carries them. This step does not
          # judge whether the ten streams share one leaf - it only MEASURES each one, into
          # signer_der_sha256. The step below is the gate: it refuses to emit a trust record unless the
          # rows agree and the file hashes to what they say, so the certificate can never rotate out
          # from under the asset that describes it.
          $leafDer = $null
          $leafPath = Join-Path $evidenceDir 'signing-leaf.cer'
          try {
            # 1. The inventory is still the build's, and the catalog is still exactly its file set.
            $expected = [string]$env:CFM_EXPECTED_INVENTORY_SHA256
            if ($expected -cnotmatch '^[0-9a-f]{64}$') { throw 'the build job supplied no well-formed inventory digest' }
            $inventoryDigest = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($inventoryDigest -cne $expected) { throw 'the inventory changed after validation' }
            $parsed = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $inventoryPath -Raw)
            $streams = @($parsed.streams)
            if ($streams.Count -ne 10) { throw ('the inventory lists ' + $streams.Count + ' streams, not 10') }
            $expectedNames = [string[]]@($streams | ForEach-Object { [string]$_.file } | Sort-Object)
            if (-not (Test-Path -LiteralPath $catalogPath -PathType Leaf)) { throw 'the signing catalog is missing' }
            $catalogDigest = (Get-FileHash -LiteralPath $catalogPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $catalogNames = [string[]]@(Get-Content -LiteralPath $catalogPath | Where-Object { $_ -ne '' })
            if (($catalogNames -join '|') -cne ($expectedNames -join '|')) { throw 'the signing catalog no longer matches the inventory' }

            # 2. Exact membership after signing: the ten streams and the catalog, nothing else, no links.
            $members = @(Get-ChildItem -LiteralPath $signDir -Force)
            $allowed = @($expectedNames) + @('sign-catalog.txt')
            foreach ($item in $members) {
              if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { Add-Failure ('unexpected directory or link after signing: ' + $item.Name) }
              elseif (-not ($allowed -ccontains $item.Name)) { Add-Failure ('unexpected file after signing: ' + $item.Name) }
            }
            foreach ($name in $allowed) {
              if (-not (@($members | ForEach-Object { $_.Name }) -ccontains $name)) { Add-Failure ('missing after signing: ' + $name) }
            }
            $unsignedMembers = [string[]]@(Get-ChildItem -LiteralPath $unsignedDir -Force | ForEach-Object { $_.Name } | Sort-Object)
            if (($unsignedMembers -join '|') -cne ($expectedNames -join '|')) { Add-Failure 'the preserved unsigned evidence is not exactly the inventory set' }
            $membershipOk = ($failures.Count -eq 0)

            # 3. Every stream: the body is the validated unsigned bytes, and the signature is valid,
            #    by the required publisher, with the code-signing EKU and a timestamp countersignature.
            foreach ($row in ($streams | Sort-Object stream)) {
              $file = [string]$row.file
              $path = Join-Path $signDir $file
              $unsignedPath = Join-Path $unsignedDir $file
              $occurrences = @($row.occurrences)
              $occurrenceTotal += $occurrences.Count
              $entry = [ordered]@{
                stream = [string]$row.stream; file = $file
                unsigned_sha256 = [string]$row.unsigned_sha256; signed_sha256 = $null
                occurrences = @($occurrences | ForEach-Object { [string]$_.path })
                occurrence_ordinals = @($occurrences | ForEach-Object { [int]$_.ordinal })
                body_unchanged = $false; status = $null; status_message = $null
                signer_subject = $null; signer_issuer = $null; signer_thumbprint = $null
                signer_der_sha256 = $null
                signer_not_before = $null; signer_not_after = $null
                eku_oids = @(); has_code_signing_eku = $false; publisher_subject_matches = $false
                timestamp_countersigner_present = $false
                timestamp_subject = $null; timestamp_thumbprint = $null; timestamp_not_after = $null
              }
              [void]$rows.Add($entry)
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { Add-Failure ($file + ': signed file missing'); continue }
              if (-not (Test-Path -LiteralPath $unsignedPath -PathType Leaf)) { Add-Failure ($file + ': unsigned evidence missing'); continue }
              $signedBytes = [IO.File]::ReadAllBytes($path)
              $unsignedBytes = [IO.File]::ReadAllBytes($unsignedPath)
              $entry.signed_sha256 = Get-Sha256Bytes $signedBytes
              if ((Get-Sha256Bytes $unsignedBytes) -cne $entry.unsigned_sha256) { Add-Failure ($file + ': unsigned evidence does not match the inventory') }
              if ($entry.signed_sha256 -ceq $entry.unsigned_sha256) { Add-Failure ($file + ': unchanged by signing') }
              $at = Find-SignatureBlock $signedBytes
              if ($at -lt 0) { Add-Failure ($file + ': no Authenticode signature block') }
              else {
                $body = if ($at -eq 0) { [byte[]]@() } else { [byte[]]$signedBytes[0..($at - 1)] }
                $entry.body_unchanged = Test-SameBytes (Trim-LineEnds $body) (Trim-LineEnds $unsignedBytes)
                if (-not $entry.body_unchanged) { Add-Failure ($file + ': differs from the validated bytes outside its signature block') }
              }
              $sig = Get-AuthenticodeSignature -LiteralPath $path
              if ($null -eq $sig) { Add-Failure ($file + ': no signature result'); continue }
              $entry.status = [string]$sig.Status
              $entry.status_message = [string]$sig.StatusMessage
              if ($entry.status -cne 'Valid') { Add-Failure ($file + ': status ' + $entry.status) }
              $cert = $sig.SignerCertificate
              if ($null -eq $cert) { Add-Failure ($file + ': no signer certificate') }
              else {
                $entry.signer_subject = [string]$cert.Subject
                $entry.signer_issuer = [string]$cert.Issuer
                $entry.signer_thumbprint = [string]$cert.Thumbprint
                $raw = $cert.RawData
                if ($null -ne $raw -and @($raw).Count -gt 0) {
                  $der = [byte[]]$raw
                  $entry.signer_der_sha256 = Get-Sha256Bytes $der
                  if ($null -eq $leafDer) { $leafDer = $der }
                }
                $entry.signer_not_before = Get-Utc $cert.NotBefore
                $entry.signer_not_after = Get-Utc $cert.NotAfter
                foreach ($ext in @($cert.Extensions)) {
                  if ($null -ne $ext -and $ext.Oid.Value -eq '2.5.29.37') {
                    $typed = New-Object Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension($ext, $false)
                    $entry.eku_oids = @($typed.EnhancedKeyUsages | ForEach-Object { $_.Value })
                  }
                }
                $entry.has_code_signing_eku = (@($entry.eku_oids) -ccontains $CODE_SIGNING_EKU)
                $entry.publisher_subject_matches = ((Get-Sha256Text $entry.signer_subject) -ceq $EXPECTED_PUBLISHER_SUBJECT_SHA256)
                if (-not $entry.has_code_signing_eku) { Add-Failure ($file + ': no code-signing EKU') }
                if (-not $entry.publisher_subject_matches) { Add-Failure ($file + ': signer subject is not the required publisher') }
              }
              $stamp = $sig.TimeStamperCertificate
              if ($null -eq $stamp) { Add-Failure ($file + ': no timestamp countersignature') }
              else {
                $entry.timestamp_countersigner_present = $true
                $entry.timestamp_subject = [string]$stamp.Subject
                $entry.timestamp_thumbprint = [string]$stamp.Thumbprint
                $entry.timestamp_not_after = Get-Utc $stamp.NotAfter
              }
            }
            if ($occurrenceTotal -ne 11) { Add-Failure ('the streams cover ' + $occurrenceTotal + ' occurrences, not 11') }

            # 4. signtool, with zero warnings and zero errors, every file verified by name, counts readable.
            $programFilesX86 = ${env:ProgramFiles(x86)}
            if ([string]::IsNullOrEmpty($programFilesX86)) { Add-Failure 'ProgramFiles(x86) is not set; signtool cannot be located' }
            else {
              $kits = Join-Path (Join-Path (Join-Path $programFilesX86 'Windows Kits') '10') 'bin'
              $tool = @(Get-ChildItem -LiteralPath $kits -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
                        Where-Object { $_.Directory.Name -ceq 'x64' } | Sort-Object FullName | Select-Object -Last 1)
              if ($tool.Count -ne 1) { Add-Failure 'signtool.exe was not found; this lane cannot claim verification without it' }
              else {
                $signtoolPath = $tool[0].FullName
                $files = [string[]]@($expectedNames | ForEach-Object { Join-Path $signDir $_ })
                $signtoolOutput = & $signtoolPath verify /pa /all /v /tw @files 2>&1 | Out-String
                $signtoolExit = $LASTEXITCODE
                Write-Host $signtoolOutput
                if ($signtoolExit -ne 0) { Add-Failure ('signtool verify exited ' + $signtoolExit) }
                $patterns = [ordered]@{
                  verified = '(?im)^\s*Number of signatures successfully Verified\s*:\s*(\d+)\s*$'
                  warnings = '(?im)^\s*Number of warnings\s*:\s*(\d+)\s*$'
                  errors   = '(?im)^\s*Number of errors\s*:\s*(\d+)\s*$'
                }
                foreach ($key in @($patterns.Keys)) {
                  $match = [regex]::Matches($signtoolOutput, $patterns[$key])
                  if ($match.Count -ne 1) { Add-Failure ('signtool printed no single readable ' + $key + ' count') }
                  else { $counts[$key] = [int]$match[0].Groups[1].Value }
                }
                if ($null -ne $counts.warnings -and $counts.warnings -ne 0) { Add-Failure ('signtool reported ' + $counts.warnings + ' warning(s)') }
                if ($null -ne $counts.errors -and $counts.errors -ne 0) { Add-Failure ('signtool reported ' + $counts.errors + ' error(s)') }
                if ($null -ne $counts.verified -and $counts.verified -ne $files.Count) { Add-Failure ('signtool verified ' + $counts.verified + ' signatures, not ' + $files.Count) }
                $verifiedLines = @([regex]::Matches($signtoolOutput, '(?im)^\s*Successfully verified:\s*(.+?)\s*$') | ForEach-Object { $_.Groups[1].Value })
                foreach ($f in $files) {
                  $hits = @($verifiedLines | Where-Object { $_ -eq $f })
                  if ($hits.Count -ne 1) { Add-Failure ('signtool did not report exactly one success for ' + (Split-Path -Leaf $f)) }
                }
                if ($verifiedLines.Count -ne $files.Count) { Add-Failure ('signtool reported ' + $verifiedLines.Count + ' successes for ' + $files.Count + ' files') }
              }
            }
          } catch {
            Add-Failure ('verification could not complete: ' + $_.Exception.Message)
          }

          # 5. The report is always written; it is evidence, and its verdict is the failure list.
          $verdict = if ($failures.Count -eq 0) { 'pass' } else { 'fail' }
          $report = [ordered]@{
            schema_version = 1
            verdict = $verdict
            failures = @($failures)
            run_id = $env:CFM_RUN_ID; run_attempt = $env:CFM_RUN_ATTEMPT; run_commit = $env:CFM_RUN_COMMIT
            run_started_utc = (Get-Date).ToUniversalTime().ToString('o')
            inventory_sha256 = $inventoryDigest
            catalog_sha256 = $catalogDigest
            distinct_stream_count = @($rows).Count
            occurrence_count = $occurrenceTotal
            expected_publisher_subject_sha256 = $EXPECTED_PUBLISHER_SUBJECT_SHA256
            timestamp_requested = 'RFC 3161, SHA-256, http://timestamp.acs.microsoft.com (signing action settings)'
            timestamp_note = 'timestamp_countersigner_present shows a countersignature exists; it is not independent proof of RFC 3161 format'
            signtool_path = $signtoolPath
            signtool_exit_code = $signtoolExit
            signtool_summary_counts = $counts
            signtool_summary = $signtoolOutput
            streams = @($rows)
          }
          if (-not (Test-Path -LiteralPath $evidenceDir)) { New-Item -ItemType Directory -Path $evidenceDir | Out-Null }
          ($report | ConvertTo-Json -Depth 6) | Set-Content -LiteralPath $reportPath -Encoding ASCII
          if ($null -ne $leafDer) { [IO.File]::WriteAllBytes($leafPath, $leafDer) }
          if ($failures.Count -ne 0) { throw ('signature verification did not pass: ' + ($failures -join '; ')) }
          Write-Host ('Verified ' + @($rows).Count + ' streams over ' + $occurrenceTotal + ' occurrences; report written.')

      # THE PUBLISHER TRUST RECORD (section 3A). A DERIVATION, not a new measurement: every field comes
      # from the report this job just wrote, or is a fixed constant of the operating contract. The
      # administrator needs the leaf in LocalMachine\TrustedPublisher BEFORE anything in the package may
      # run under AllSigned, so the certificate ships beside the release rather than being extracted
      # from a signed script.
      #
      # ONE RELEASE, ONE LEAF. Emitting a single trust record is honest only if the ten streams were
      # signed by one certificate, so that is checked here and named when it fails. This pins NOTHING:
      # no thumbprint constant exists anywhere in this lane, and a later run may legitimately present a
      # different leaf - Azure renews the signing certificate daily. The requirement is agreement WITHIN
      # a run, which is what makes the published asset describe the published bytes.
      - name: Emit the publisher trust record and the signing leaf
        shell: powershell
        env:
          CFM_RUN_ID: ${{ github.run_id }}
          CFM_RUN_ATTEMPT: ${{ github.run_attempt }}
          CFM_RUN_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $CODE_SIGNING_EKU = '1.3.6.1.5.5.7.3.3'
          $REQUIRED_STORE = 'LocalMachine\TrustedPublisher'
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'signature-evidence'
          $reportPath = Join-Path $evidenceDir 'signature-report.json'
          $leafPath = Join-Path $evidenceDir 'signing-leaf.cer'
          $trustPath = Join-Path $evidenceDir 'trust.json'
          function Refuse([string]$message) { throw ('trust record refused: ' + $message) }
          function Get-Sha256File([string]$path) { return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Sha1Bytes([byte[]]$bytes) {
            $algorithm = [Security.Cryptography.SHA1]::Create()
            try { return (($algorithm.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') }) -join '').ToUpperInvariant() }
            finally { $algorithm.Dispose() }
          }
          # ConvertFrom-Json turns an ISO-8601 field back into a [datetime], and a plain cast then
          # renders it in the runner's CULTURE format - so the record would carry 09/19/2026 where the
          # report says 2026-09-19T00:00:00.0000000Z. Every value is normalized back to the report's
          # own UTC text before it is compared or written.
          function Get-Text($value) {
            if ($value -is [datetime]) { return ([datetime]$value).ToUniversalTime().ToString('o') }
            return [string]$value
          }
          function One($rows, [string]$field, [string]$what) {
            $values = @($rows | ForEach-Object { Get-Text $_.$field })
            if (@($values | Where-Object { [string]::IsNullOrEmpty($_) }).Count -ne 0) { Refuse ('a stream records no ' + $what) }
            $distinct = @($values | Sort-Object -Unique -CaseSensitive)
            if ($distinct.Count -ne 1) { Refuse ('the streams do not agree on the ' + $what + ': ' + ($distinct -join ' | ')) }
            return $distinct[0]
          }

          if (Test-Path -LiteralPath $trustPath) { Refuse 'a trust record already exists' }
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { Refuse 'there is no signature report' }
          $report = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $reportPath -Raw)
          if ([string]$report.verdict -cne 'pass') { Refuse ('the signature report verdict is ' + $report.verdict) }
          if (@($report.failures).Count -ne 0) { Refuse 'the signature report records failures' }
          if ([string]$report.run_commit -cne [string]$env:CFM_RUN_COMMIT) { Refuse 'the signature report names another commit' }
          if ([string]$report.run_id -cne [string]$env:CFM_RUN_ID) { Refuse 'the signature report names another run' }
          if ([string]$report.run_attempt -cne [string]$env:CFM_RUN_ATTEMPT) { Refuse 'the signature report names another run attempt' }
          $streams = @($report.streams)
          if ($streams.Count -ne 10) { Refuse ('the signature report covers ' + $streams.Count + ' streams, not 10') }

          $subject = One $streams 'signer_subject' 'signer subject'
          $thumbprint = One $streams 'signer_thumbprint' 'leaf thumbprint'
          $issuer = One $streams 'signer_issuer' 'signer issuer'
          $notBefore = One $streams 'signer_not_before' 'validity start'
          $notAfter = One $streams 'signer_not_after' 'validity end'
          $derDigest = One $streams 'signer_der_sha256' 'leaf digest'
          if ($thumbprint -cnotmatch '^[0-9A-Fa-f]{40}$') { Refuse ('the leaf thumbprint is not a SHA-1 hex value: ' + $thumbprint) }
          if ($derDigest -cnotmatch '^[0-9a-f]{64}$') { Refuse ('the leaf digest is not a SHA-256 hex value: ' + $derDigest) }

          if (-not (Test-Path -LiteralPath $leafPath -PathType Leaf)) { Refuse 'the verification step captured no leaf certificate' }
          $der = [IO.File]::ReadAllBytes($leafPath)
          if ($der.Length -eq 0) { Refuse 'the captured leaf certificate is empty' }
          if ((Get-Sha256File $leafPath) -cne $derDigest) { Refuse 'the captured leaf is not the certificate the report measured' }
          # The one check that ties the FILE to the reported IDENTITY: a thumbprint is by definition the
          # SHA-1 of the DER, so a leaf that does not hash to it is not the leaf the report describes.
          $measured = Get-Sha1Bytes $der
          if ($measured -cne $thumbprint.ToUpperInvariant()) { Refuse ('the leaf hashes to ' + $measured + ', not the reported thumbprint ' + $thumbprint) }

          $trust = [ordered]@{
            schema_version = 1
            kind = 'publisher-trust-record'
            signer_subject = $subject
            signer_thumbprint = $thumbprint
            signer_issuer = $issuer
            signer_not_before = $notBefore
            signer_not_after = $notAfter
            code_signing_eku = $CODE_SIGNING_EKU
            required_store = $REQUIRED_STORE
            run_id = [string]$env:CFM_RUN_ID
            run_commit = [string]$env:CFM_RUN_COMMIT
            signature_report_sha256 = Get-Sha256File $reportPath
            leaf_der_sha256 = $derDigest
          }
          ($trust | ConvertTo-Json -Depth 4) | Set-Content -LiteralPath $trustPath -Encoding ASCII
          Write-Host ('Trust record: one leaf ' + $thumbprint + ' across 10 streams, ' + $der.Length + ' DER bytes.')

      # THE SIGNED HANDOFF. Reached only after verification passed. The report is re-read and must say
      # pass, for THIS run and commit, over the build's inventory, with ten signed streams covering the
      # eleven occurrences - and every signed file on disk must hash to what it says. Only then are the
      # ten streams, the report and the two trust assets copied out, and the report's and trust
      # record's digests become this job's outputs: the only things finalize trusts the handoff by. No
      # catalog, unsigned evidence or other file travels.
      - name: Assemble the signed handoff
        id: handoff
        shell: powershell
        env:
          CFM_EXPECTED_INVENTORY_SHA256: ${{ needs.build.outputs.inventory_sha256 }}
          CFM_RUN_ID: ${{ github.run_id }}
          CFM_RUN_ATTEMPT: ${{ github.run_attempt }}
          CFM_RUN_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signDir = Join-Path (Join-Path $env:RUNNER_TEMP 'request') 'sign'
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'signature-evidence'
          $reportPath = Join-Path $evidenceDir 'signature-report.json'
          $trustPath = Join-Path $evidenceDir 'trust.json'
          $leafPath = Join-Path $evidenceDir 'signing-leaf.cer'
          $handoff = Join-Path $env:RUNNER_TEMP 'signed-handoff'
          function Refuse([string]$message) { throw ('signed handoff refused: ' + $message) }
          function Get-Sha256File([string]$path) { return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          $expected = [string]$env:CFM_EXPECTED_INVENTORY_SHA256
          if ($expected -cnotmatch '^[0-9a-f]{64}$') { Refuse 'the build job supplied no well-formed inventory digest' }
          if (Test-Path -LiteralPath $handoff) { Refuse 'a signed handoff already exists' }
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { Refuse 'there is no signature report' }
          if (-not (Test-Path -LiteralPath $trustPath -PathType Leaf)) { Refuse 'there is no publisher trust record' }
          if (-not (Test-Path -LiteralPath $leafPath -PathType Leaf)) { Refuse 'there is no signing leaf certificate' }
          $report = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $reportPath -Raw)
          if ([string]$report.verdict -cne 'pass') { Refuse ('the signature report verdict is ' + $report.verdict) }
          if (@($report.failures).Count -ne 0) { Refuse 'the signature report records failures' }
          if ([string]$report.run_commit -cne [string]$env:CFM_RUN_COMMIT) { Refuse 'the signature report names another commit' }
          if ([string]$report.run_id -cne [string]$env:CFM_RUN_ID) { Refuse 'the signature report names another run' }
          if ([string]$report.run_attempt -cne [string]$env:CFM_RUN_ATTEMPT) { Refuse 'the signature report names another run attempt' }
          if ([string]$report.inventory_sha256 -cne $expected) { Refuse 'the signature report is not over the build inventory' }
          $streams = @($report.streams)
          if ($streams.Count -ne 10 -or $report.distinct_stream_count -ne 10) { Refuse 'the signature report does not cover ten streams' }
          if ($report.occurrence_count -ne 11) { Refuse 'the signature report does not cover eleven occurrences' }
          $files = @{}; $ordinals = @{}; $total = 0
          foreach ($row in $streams) {
            $file = [string]$row.file
            if ($file -cnotmatch '^[a-z0-9]+(-[a-z0-9]+)*\.ps1$' -or $file -cne ([string]$row.stream + '.ps1')) { Refuse ('unsafe or inconsistent stream file: ' + $file) }
            if ($files.ContainsKey($file)) { Refuse ('duplicate stream: ' + $file) }
            $files[$file] = [string]$row.signed_sha256
            if ([string]$row.signed_sha256 -cnotmatch '^[0-9a-f]{64}$' -or [string]$row.signed_sha256 -ceq [string]$row.unsigned_sha256) { Refuse ($file + ' has no distinct signed digest') }
            $paths = @($row.occurrences); $numbers = @($row.occurrence_ordinals)
            if ($paths.Count -lt 1 -or $paths.Count -ne $numbers.Count) { Refuse ($file + ' has an inconsistent occurrence mapping') }
            foreach ($n in $numbers) { if ($ordinals.ContainsKey([string]$n)) { Refuse ('duplicate ordinal ' + $n) }; $ordinals[[string]$n] = $true }
            $total += $paths.Count
            $path = Join-Path $signDir $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { Refuse ($file + ' is missing') }
            if ((Get-Sha256File $path) -cne [string]$row.signed_sha256) { Refuse ($file + ' does not match its signed digest') }
          }
          if ($total -ne 11 -or $ordinals.Count -ne 11) { Refuse 'the streams do not map to exactly eleven occurrences' }
          $shared = @($streams | Where-Object { [string]$_.stream -ceq 'cfm-lib' })
          if ($shared.Count -ne 1 -or ((@($shared[0].occurrence_ordinals) | ForEach-Object { [int]$_ } | Sort-Object) -join ',') -cne '2,5') { Refuse 'cfm-lib is not exactly occurrences 2 and 5' }
          New-Item -ItemType Directory -Path $handoff | Out-Null
          foreach ($file in @($files.Keys)) {
            [IO.File]::WriteAllBytes((Join-Path $handoff $file), [IO.File]::ReadAllBytes((Join-Path $signDir $file)))
            if ((Get-Sha256File (Join-Path $handoff $file)) -cne $files[$file]) { Refuse ($file + ' changed while being copied') }
          }
          foreach ($pair in @(@('signature-report.json', $reportPath), @('trust.json', $trustPath), @('signing-leaf.cer', $leafPath))) {
            $target = Join-Path $handoff $pair[0]
            [IO.File]::WriteAllBytes($target, [IO.File]::ReadAllBytes($pair[1]))
            if ((Get-Sha256File $target) -cne (Get-Sha256File $pair[1])) { Refuse ($pair[0] + ' changed while being copied') }
          }
          $members = @(Get-ChildItem -LiteralPath $handoff -Force | ForEach-Object { $_.Name })
          if ($members.Count -ne 13) { Refuse ('the handoff holds ' + $members.Count + ' files, not 13') }
          $digest = Get-Sha256File (Join-Path $handoff 'signature-report.json')
          $trustDigest = Get-Sha256File (Join-Path $handoff 'trust.json')
          if ([string]$env:GITHUB_RUN_ID -cnotmatch '^[0-9]+$' -or [string]$env:GITHUB_RUN_ATTEMPT -cnotmatch '^[0-9]+$' -or [string]$env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') { Refuse 'the runner supplied no well-formed run identity' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('signature_report_sha256=' + $digest) -Encoding ASCII
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('trust_record_sha256=' + $trustDigest) -Encoding ASCII
          $identity = ' run=' + $env:GITHUB_RUN_ID + ' attempt=' + $env:GITHUB_RUN_ATTEMPT + ' commit=' + $env:GITHUB_SHA
          Write-Host ('CFM-DIGEST signature_report_sha256=' + $digest + $identity)
          Write-Host ('CFM-DIGEST trust_record_sha256=' + $trustDigest + $identity)
          Write-Host ('Signed handoff: 10 streams, the report (' + $digest + ') and the trust assets (' + $trustDigest + ').')

      - name: Publish the signed streams, the signature report and the trust assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-windows-signed-members
          path: ${{ runner.temp }}/signed-handoff
          if-no-files-found: error
          retention-days: 30

  # ENABLED ON ITS OWN PREDICATE, not merely downstream of `sign`: only a valid dispatch satisfies its
  # `if:`, and it runs only after `sign` succeeded. It holds contents: read only - no write, no id-token,
  # no release or Pages.
  #
  # Every input is bound to an upstream JOB OUTPUT before it is believed: the candidate archive to the
  # build's digest, the report to the sign job's digest, the report's inventory to the build's. A
  # sidecar travelling beside an artifact is not a binding - it is rewritten with the artifact.
  finalize:
    name: Adopt the signed streams and finalize the packages
    needs: [gate, build, sign]
    if: (github.event_name == 'workflow_dispatch' && github.repository_id == '1342406426' && github.repository == 'CORPUSfm/CORPUSfm' && github.ref == 'refs/heads/public-signing-candidate')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The digest of the manifest naming every file this job put in the review artifact. It is the one
    # thing the independent Windows job may trust that artifact by: a checksum travelling INSIDE an
    # artifact is rewritten with the artifact, so it binds nothing.
    outputs:
      finalized_manifest_sha256: ${{ steps.prove.outputs.finalized_manifest_sha256 }}
    steps:
      # The builder's own scripts come from the triggering commit; the candidate comes only as data.
      - name: Check out exactly the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove the checkout is the triggering commit and is clean
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo '  x the checkout is not the triggering commit'; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=all)" ] || { echo '  x the checkout is not clean'; exit 1; }
          [ ! -e outputs ] || { echo '  x distribution outputs already exist'; exit 1; }

      - name: Download only this run's candidate archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-release-candidate
          path: ${{ runner.temp }}/handoff-candidate

      - name: Download only this run's signed streams
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-windows-signed-members
          path: ${{ runner.temp }}/signed-handoff

      - name: Bind both handoffs to their job outputs before reading them
        shell: bash
        env:
          CFM_EXPECTED_CANDIDATE_TAR_SHA256: ${{ needs.build.outputs.candidate_tar_sha256 }}
          CFM_EXPECTED_INVENTORY_SHA256: ${{ needs.build.outputs.inventory_sha256 }}
          CFM_EXPECTED_SIGNATURE_REPORT_SHA256: ${{ needs.sign.outputs.signature_report_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path

          def refuse(message):
              print(f"  x handoff refused: {message}")
              sys.exit(1)

          def expected(name):
              value = os.environ.get(name, "")
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  refuse(f"{name} is not a well-formed digest from a job output")
              return value

          tar_digest = expected("CFM_EXPECTED_CANDIDATE_TAR_SHA256")
          inventory_digest = expected("CFM_EXPECTED_INVENTORY_SHA256")
          report_digest = expected("CFM_EXPECTED_SIGNATURE_REPORT_SHA256")
          temp = Path(os.environ["RUNNER_TEMP"])
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()

          def plain_files(directory):
              if directory.is_symlink() or not directory.is_dir():
                  refuse(f"{directory.name} is not a plain directory")
              found = {}
              for path in directory.iterdir():
                  if path.is_symlink() or not path.is_file():
                      refuse(f"{directory.name}/{path.name} is not a regular file")
                  found[path.name] = path
              return found

          candidate = plain_files(temp / "handoff-candidate")
          if set(candidate) != {"public-release-candidate.tar", "public-release-candidate.tar.sha256"}:
              refuse(f"the candidate handoff is not exactly the archive and its sidecar: {sorted(candidate)}")
          if sha(candidate["public-release-candidate.tar"]) != tar_digest:
              refuse("the candidate archive is not the one the build job produced")

          signed = plain_files(temp / "signed-handoff")
          if "signature-report.json" not in signed:
              refuse("the signed handoff carries no signature report")
          if sha(signed["signature-report.json"]) != report_digest:
              refuse("the signature report is not the one the sign job verified")
          report = json.loads(signed["signature-report.json"].read_text(encoding="ascii"))
          if report.get("verdict") != "pass" or report.get("failures"):
              refuse("the signature report did not pass")
          identity = {"run_commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                      "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          for key, value in identity.items():
              if str(report.get(key)) != value:
                  refuse(f"the signature report {key} is {report.get(key)!r}, not this run's {value!r}")
          if report.get("inventory_sha256") != inventory_digest:
              refuse("the signature report is not over the build inventory")
          streams = report.get("streams") or []
          if len(streams) != 10 or report.get("distinct_stream_count") != 10 or report.get("occurrence_count") != 11:
              refuse("the signature report does not describe 10 streams over 11 occurrences")
          files, ordinals = {}, []
          for row in streams:
              name = row.get("file", "")
              if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*\.ps1", name) or name != f"{row.get('stream')}.ps1" or name in files:
                  refuse(f"unsafe, inconsistent or duplicate stream file {name!r}")
              if not re.fullmatch(r"[0-9a-f]{64}", str(row.get("signed_sha256"))) or row["signed_sha256"] == row.get("unsigned_sha256"):
                  refuse(f"{name} has no distinct signed digest")
              if len(row.get("occurrences") or []) != len(row.get("occurrence_ordinals") or []) or not row.get("occurrences"):
                  refuse(f"{name} has an inconsistent occurrence mapping")
              files[name] = row["signed_sha256"]
              ordinals += list(row["occurrence_ordinals"])
          if sorted(ordinals) != list(range(1, 12)):
              refuse(f"the occurrence ordinals are not exactly 1-11: {sorted(ordinals)}")
          shared = [row for row in streams if row.get("stream") == "cfm-lib"]
          if len(shared) != 1 or sorted(shared[0]["occurrence_ordinals"]) != [2, 5]:
              refuse("cfm-lib is not exactly occurrences 2 and 5")
          carried = {"signature-report.json", "trust.json", "signing-leaf.cer"}
          if set(signed) != set(files) | carried:
              refuse(f"the signed handoff is not exactly the report's ten streams and its records: "
                     f"{sorted(set(signed) ^ (set(files) | carried))}")
          for name, digest in files.items():
              if sha(signed[name]) != digest:
                  refuse(f"{name} is not the stream the report verified")
          print(f"Handoffs bound: candidate {tar_digest[:12]}, report {report_digest[:12]}, 10 streams / 11 occurrences.")
          PY

      # THE ARCHIVE IS INSPECTED IN FULL BEFORE ANY BYTE IS WRITTEN. Only regular files and directories
      # under the single root `candidate/`, no absolute or traversing name, no duplicate, no link or
      # special file, no set-id bit; then each member is written by this code into a fresh directory
      # with O_EXCL and O_NOFOLLOW, never by tarfile's extractor.
      - name: Extract the candidate safely and re-check its identity
        shell: bash
        env:
          CFM_EXPECTED_CANDIDATE_TAR_SHA256: ${{ needs.build.outputs.candidate_tar_sha256 }}
          CFM_EXPECTED_INVENTORY_SHA256: ${{ needs.build.outputs.inventory_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, sys, tarfile
          from pathlib import Path

          def refuse(message):
              print(f"  x extraction refused: {message}")
              sys.exit(1)

          temp = Path(os.environ["RUNNER_TEMP"])
          archive = temp / "handoff-candidate" / "public-release-candidate.tar"
          destination = temp / "final"
          for name in ("CFM_EXPECTED_CANDIDATE_TAR_SHA256", "CFM_EXPECTED_INVENTORY_SHA256"):
              if not re.fullmatch(r"[0-9a-f]{64}", os.environ.get(name, "")):
                  refuse(f"{name} is not a well-formed digest from a job output")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ["CFM_EXPECTED_CANDIDATE_TAR_SHA256"]:
              refuse("the candidate archive is not the one the build job produced")
          if destination.exists() or destination.is_symlink():
              refuse("the extraction destination already exists")

          with tarfile.open(archive, mode="r:") as bundle:
              members = bundle.getmembers()
              seen = set()
              for member in members:
                  name = member.name
                  if not name or name.startswith("/") or "\\" in name or ":" in name:
                      refuse(f"unsafe member name {name!r}")
                  parts = name.split("/")
                  if any(part in ("", ".", "..") for part in parts) or parts[0] != "candidate":
                      refuse(f"member {name!r} is outside the single candidate/ root")
                  if name.casefold() in seen:
                      refuse(f"duplicate member {name!r}")
                  seen.add(name.casefold())
                  if not (member.isreg() or member.isdir()):
                      refuse(f"member {name!r} is a link or special file")
                  if member.mode & 0o7000:
                      refuse(f"member {name!r} carries a set-id or sticky bit")
              if "candidate" not in seen:
                  refuse("the archive has no candidate/ root entry")

              destination.mkdir()
              root = os.path.realpath(destination)
              for member in sorted(members, key=lambda m: (m.name.count("/"), m.name)):
                  target = destination / member.name
                  parent = os.path.realpath(target.parent) if target.parent.exists() else None
                  if parent is not None and os.path.commonpath([root, parent]) != root:
                      refuse(f"member {member.name!r} would escape the destination")
                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                      if target.is_symlink() or not target.is_dir():
                          refuse(f"member {member.name!r} is not a plain directory after creation")
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  data = bundle.extractfile(member).read()
                  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0)
                  descriptor = os.open(target, flags, 0o600)
                  with os.fdopen(descriptor, "wb") as handle:
                      handle.write(data)
                  os.chmod(target, 0o755 if member.mode & 0o111 else 0o644)
                  os.utime(target, (member.mtime, member.mtime))

          candidate = destination / "candidate"
          inventory = candidate / "windows-signing-inventory.json"
          if hashlib.sha256(inventory.read_bytes()).hexdigest() != os.environ["CFM_EXPECTED_INVENTORY_SHA256"]:
              refuse("the extracted inventory is not the build inventory")
          # Every occurrence - both copies of the shared library included - is still its stream's
          # unsigned bytes. Adoption would overwrite a drifted copy; it is refused here instead.
          for row in json.loads(inventory.read_text(encoding="utf-8"))["streams"]:
              for occurrence in row["occurrences"]:
                  path = candidate / occurrence["path"]
                  if not path.is_file() or path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != row["unsigned_sha256"]:
                      refuse(f"occurrence {occurrence['ordinal']} ({occurrence['path']}) is not stream {row['stream']}")
          record = json.loads((candidate / "candidate.json").read_text(encoding="utf-8"))
          if record.get("commit") != os.environ["GITHUB_SHA"] or record.get("installer_source_commit") != os.environ["GITHUB_SHA"]:
              refuse("the extracted candidate is not the triggering commit")
          for platform, facts in record["platforms"].items():
              for part in ("outer", "runtime"):
                  tree = candidate / platform / part
                  now = sorted(p.relative_to(tree).as_posix() for p in tree.rglob("*")
                               if p.is_file() and os.access(p, os.X_OK))
                  if now != facts[f"executable_{part}"]:
                      refuse(f"{platform} {part} modes differ from the staged record")
          print(f"Extracted {len(members)} members safely; inventory, identity and modes re-checked.")
          PY

      - name: Re-check the staged record seal with the builder's own rule
        shell: bash
        run: |
          set -euo pipefail
          python3 installer/windows_signing.py assert-records-sealed --candidate "$RUNNER_TEMP/final/candidate"

      # THE EXISTING BUILDER, in its supported order: `adopt` (body preservation, every occurrence,
      # nothing else moved) runs first inside --finalize-signing-candidate, and only then are the
      # runtime ZIP, payload digests, manifests, outer ZIPs, sidecars and release.json produced; the
      # builder then reopens the Windows ZIP itself. Output is outputs/server.
      - name: Adopt the signed streams and finalize with the existing builder
        shell: bash
        run: |
          set -euo pipefail
          members="$RUNNER_TEMP/signed-members"
          [ ! -e "$members" ] || { echo '  x signed members already staged'; exit 1; }
          mkdir "$members"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((temp / "signed-handoff" / "signature-report.json").read_text(encoding="ascii"))
          for row in report["streams"]:
              shutil.copyfile(temp / "signed-handoff" / row["file"], temp / "signed-members" / row["file"])
          PY
          ./installer/package-installer.sh \
            --finalize-signing-candidate "$RUNNER_TEMP/final/candidate" \
            --signed-members "$members"

      # THE TRUST ASSETS ARE PLACED, NEVER RE-DERIVED (section 3A). The sign job measured the leaf and
      # wrote the record; this job only names them for the frozen version and puts them beside the
      # packages. Both are bound to upstream JOB OUTPUTS before a single field is read: the record to
      # the sign job's trust digest, the certificate to the record's own leaf digest, and the record's
      # signature_report_sha256 to the report digest that job separately emitted - so a rewritten
      # record cannot bring its own agreeing certificate.
      - name: Place the publisher trust record and signing leaf in the release directory
        shell: bash
        env:
          CFM_EXPECTED_TRUST_RECORD_SHA256: ${{ needs.sign.outputs.trust_record_sha256 }}
          CFM_EXPECTED_SIGNATURE_REPORT_SHA256: ${{ needs.sign.outputs.signature_report_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path

          def refuse(message):
              print(f"  x trust assets refused: {message}")
              sys.exit(1)

          def expected(name):
              value = os.environ.get(name, "")
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  refuse(f"{name} is not a well-formed digest from a job output")
              return value

          trust_digest = expected("CFM_EXPECTED_TRUST_RECORD_SHA256")
          report_digest = expected("CFM_EXPECTED_SIGNATURE_REPORT_SHA256")
          temp = Path(os.environ["RUNNER_TEMP"])
          handoff = temp / "signed-handoff"
          sha = lambda data: hashlib.sha256(data).hexdigest()

          record_bytes = (handoff / "trust.json").read_bytes()
          if sha(record_bytes) != trust_digest:
              refuse("the trust record is not the one the sign job emitted")
          trust = json.loads(record_bytes.decode("ascii"))
          if trust.get("signature_report_sha256") != report_digest:
              refuse("the trust record does not describe the signature report the sign job emitted")
          identity = {"run_commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"]}
          for key, value in identity.items():
              if str(trust.get(key)) != value:
                  refuse(f"the trust record {key} is {trust.get(key)!r}, not this run's {value!r}")
          thumbprint = str(trust.get("signer_thumbprint", ""))
          if not re.fullmatch(r"[0-9A-Fa-f]{40}", thumbprint):
              refuse(f"the trust record carries no SHA-1 leaf thumbprint: {thumbprint!r}")
          leaf_digest = str(trust.get("leaf_der_sha256", ""))
          if not re.fullmatch(r"[0-9a-f]{64}", leaf_digest):
              refuse(f"the trust record carries no SHA-256 leaf digest: {leaf_digest!r}")
          leaf_bytes = (handoff / "signing-leaf.cer").read_bytes()
          if sha(leaf_bytes) != leaf_digest:
              refuse("the signing leaf is not the certificate the trust record describes")

          record = json.loads((temp / "final" / "candidate" / "candidate.json").read_text(encoding="utf-8"))
          series, version = str(record["installer_series"]), str(record["installer_version"])
          if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", series) or not re.fullmatch(r"[0-9]+\.[0-9]+", version):
              refuse(f"the frozen candidate names an unsafe series or version: {series!r} {version!r}")
          release = Path("outputs") / "server" / series / "releases" / version
          if not release.is_dir() or release.is_symlink():
              refuse(f"the release directory is not a plain directory: {release.as_posix()}")

          assets = {f"corpusfm-installer-windows-{version}.trust.json": record_bytes,
                    f"corpusfm-signing-leaf-{thumbprint}.cer": leaf_bytes}
          for name in list(assets) + [n + ".sha256" for n in assets]:
              if (release / name).exists() or (release / name).is_symlink():
                  refuse(f"the release directory already carries {name}")
          for name, data in assets.items():
              (release / name).write_bytes(data)
              sidecar = f"{sha(data)}  {name}\n"
              (release / (name + ".sha256")).write_text(sidecar, encoding="ascii")
              # Read back what is actually on disk: the sidecar has to describe the emitted bytes under
              # the emitted name, or the pair is not a checksum of anything.
              written = (release / name).read_bytes()
              if written != data:
                  refuse(f"{name} is not the bytes it was written from")
              if (release / (name + ".sha256")).read_text(encoding="ascii") != f"{sha(written)}  {name}\n":
                  refuse(f"{name}.sha256 does not describe the emitted asset")
          print(f"Trust assets placed for {series} {version}: leaf {thumbprint}, record {trust_digest[:12]}.")
          PY

      # AN INDEPENDENT REOPENING against the SIGN JOB's report, not the inventory the builder just
      # updated: every one of the eleven occurrences in the finished Windows ZIP must be the signed
      # stream the report names, nothing else PowerShell may ride along, the Linux modes must be the
      # recorded ones, and there must be no standalone bootstrap anywhere in the output.
      - name: Prove the finished archives against the signature report
        id: prove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, re, shutil, sys, zipfile
          from pathlib import Path

          def refuse(message):
              print(f"  x finalization proof refused: {message}")
              sys.exit(1)

          temp = Path(os.environ["RUNNER_TEMP"])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          report = json.loads((temp / "signed-handoff" / "signature-report.json").read_text(encoding="ascii"))
          record = json.loads((temp / "final" / "candidate" / "candidate.json").read_text(encoding="utf-8"))
          series, version = record["installer_series"], record["installer_version"]
          server = Path("outputs") / "server"
          if sorted(p.name for p in server.iterdir()) != [series]:
              refuse(f"outputs/server holds more than {series}")
          if any("bootstrap" in p.name.lower() for p in Path("outputs").rglob("*")):
              refuse("a standalone bootstrap was written to the distribution output")
          release = server / series / "releases" / version
          names = {
              "linux": f"corpusfm-installer-linux-{version}.zip",
              "windows": f"corpusfm-installer-windows-{version}.zip",
          }
          # The closed set widens by exactly the four trust files the step above placed, and the leaf's
          # name is derived from the record's own measured thumbprint - never from a constant.
          trust_name = f"corpusfm-installer-windows-{version}.trust.json"
          trust_path = release / trust_name
          if not trust_path.is_file() or trust_path.is_symlink():
              refuse("the release directory carries no publisher trust record")
          trust = json.loads(trust_path.read_text(encoding="ascii"))
          thumbprint = str(trust.get("signer_thumbprint", ""))
          if not re.fullmatch(r"[0-9A-Fa-f]{40}", thumbprint):
              refuse(f"the trust record carries no SHA-1 leaf thumbprint: {thumbprint!r}")
          leaf_name = f"corpusfm-signing-leaf-{thumbprint}.cer"
          expected_files = {*names.values(), *(n + ".sha256" for n in names.values()),
                            "release.json", "windows-signature-map.json",
                            trust_name, leaf_name, trust_name + ".sha256", leaf_name + ".sha256"}
          if {p.name for p in release.iterdir()} != expected_files:
              refuse(f"the release directory is not exactly the expected files: {sorted(p.name for p in release.iterdir())}")
          for name in (trust_name, leaf_name):
              digest = sha((release / name).read_bytes())
              if (release / (name + ".sha256")).read_text().split()[0] != digest:
                  refuse(f"{name} disagrees with its sidecar")
          if sha((release / leaf_name).read_bytes()) != trust.get("leaf_der_sha256"):
              refuse("the released signing leaf is not the certificate the trust record describes")
          manifest = json.loads((release / "release.json").read_text(encoding="utf-8"))
          if manifest["commit"] != os.environ["GITHUB_SHA"] or manifest["installer_version"] != version:
              refuse("release.json does not name the triggering commit and staged version")
          for platform, name in names.items():
              digest = sha((release / name).read_bytes())
              if (release / (name + ".sha256")).read_text().split()[0] != digest or manifest["platforms"][platform]["sha256"] != digest:
                  refuse(f"{name} disagrees with its sidecar or release.json")

          # DUPLICATE NAMES ARE REFUSED BEFORE ANY LOOKUP. A ZIP may hold two entries with one name;
          # zipfile's name lookup then silently answers with one of them, so a second, unsigned copy
          # of a member could ride along unseen. Every archive's ACTUAL entry list is checked for
          # exact and case-folded collisions (Windows extraction is case-insensitive) before a map is
          # built or a member is read, and every count below counts entries, not map keys.
          def unique_members(archive, label):
              entries = archive.infolist()
              names = [info.filename for info in entries]
              if len(set(names)) != len(names):
                  duplicates = sorted({n for n in names if names.count(n) > 1})
                  refuse(f"{label} carries duplicate entries {duplicates}")
              folded = [n.casefold() for n in names]
              if len(set(folded)) != len(folded):
                  collisions = sorted({n for n in names if folded.count(n.casefold()) > 1})
                  refuse(f"{label} carries case-colliding entries {collisions}")
              members = {info.filename: info for info in entries}
              if len(members) != len(entries):
                  refuse(f"{label} entry count {len(entries)} does not match its {len(members)} names")
              return entries, members

          def nested_runtime(outer, outer_members, label):
              if "installer-runtime.zip" not in outer_members:
                  refuse(f"the {label} package carries no installer-runtime.zip")
              runtime = zipfile.ZipFile(io.BytesIO(outer.read("installer-runtime.zip")))
              return (runtime,) + unique_members(runtime, f"the {label} installer-runtime.zip")

          with zipfile.ZipFile(release / names["windows"]) as outer:
              outer_entries, outer_members = unique_members(outer, "the Windows outer ZIP")
              runtime, runtime_entries, runtime_members = nested_runtime(outer, outer_members, "Windows")
              seen = 0
              for row in report["streams"]:
                  for occurrence in row["occurrences"]:
                      if occurrence.startswith("windows/outer/"):
                          archive, present, member = outer, outer_members, occurrence[len("windows/outer/"):]
                      elif occurrence.startswith("windows/runtime/"):
                          archive, present, member = runtime, runtime_members, occurrence[len("windows/runtime/"):]
                      else:
                          refuse(f"the report names an occurrence that cannot be placed: {occurrence}")
                      if member not in present:
                          refuse(f"{occurrence} is missing from the finished Windows archives")
                      data = archive.read(present[member])
                      if sha(data) != row["signed_sha256"]:
                          refuse(f"{occurrence} in the finished ZIP is not the signed {row['file']}")
                      seen += 1
              if seen != 11:
                  refuse(f"the finished ZIP was checked at {seen} occurrences, not 11")
              powershell = [i.filename for i in outer_entries if i.filename.lower().endswith(".ps1")] + \
                           [i.filename for i in runtime_entries if i.filename.lower().endswith(".ps1")]
              if len(powershell) != 11:
                  refuse(f"the finished Windows archives carry {len(powershell)} PowerShell entries, not 11")

          executable = lambda info: bool((info.external_attr >> 16) & 0o111)
          linux = record["platforms"]["linux"]
          with zipfile.ZipFile(release / names["linux"]) as outer:
              outer_entries, outer_members = unique_members(outer, "the Linux outer ZIP")
              runtime, runtime_entries, runtime_members = nested_runtime(outer, outer_members, "Linux")
              outer_exec = sorted(i.filename for i in outer_entries if executable(i))
              if outer_exec != sorted(set(linux["executable_outer"]) | {"install.sh"}):
                  refuse(f"Linux outer modes are {outer_exec}")
              runtime_exec = sorted(i.filename for i in runtime_entries if executable(i))
              if runtime_exec != sorted(linux["executable_runtime"]):
                  refuse(f"Linux runtime modes are {runtime_exec}")
              if sorted(i.filename for i in runtime_entries if i.filename.startswith("installer/")) != sorted(linux["runtime_members"]):
                  refuse("the Linux runtime members are not the recorded ones")

          review = temp / "review"
          shutil.copytree(server, review / "server")
          shutil.copyfile(temp / "signed-handoff" / "signature-report.json", review / "signature-report.json")
          # THE MANIFEST THE INDEPENDENT WINDOWS JOB BINDS BY: every file placed in the review
          # artifact, with this run's identity and the version the frozen candidate carries. Its
          # digest becomes this job's output, so the next job never has to believe the artifact
          # about itself. Anything that is not a regular file is refused rather than left unnamed.
          for path in review.rglob("*"):
              if path.is_symlink() or not (path.is_file() or path.is_dir()):
                  refuse(f"the review material carries a link or special file: {path.relative_to(review).as_posix()}")
          listed = sorted(p for p in review.rglob("*") if p.is_file())
          manifest = {
              "schema_version": 1,
              "kind": "finalized-review-manifest",
              "run_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "installer_series": series,
              "installer_version": version,
              "signature_report_sha256": sha((review / "signature-report.json").read_bytes()),
              "windows_package": f"server/{series}/releases/{version}/{names['windows']}",
              "linux_package": f"server/{series}/releases/{version}/{names['linux']}",
              "files": [{"path": p.relative_to(review).as_posix(), "size": p.stat().st_size,
                         "sha256": sha(p.read_bytes())} for p in listed],
          }
          (review / "finalized-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")
          print(f"Finished archives proved: 11 occurrences = the report's 10 signed streams; Linux modes as recorded.")
          print(f"Finalized manifest: {len(manifest['files'])} files, series {series}, version {version}.")
          PY
          digest="$(sha256sum "$RUNNER_TEMP/review/finalized-manifest.json" | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo '  x could not digest the finalized manifest'; exit 1; }
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ && "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo '  x the runner supplied no well-formed run identity'; exit 1; }
          echo "finalized_manifest_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "CFM-DIGEST finalized_manifest_sha256=$digest run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT commit=$GITHUB_SHA"

      # REVIEW MATERIAL ONLY: not a release, not published anywhere.
      - name: Retain the finalized packages for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-finalized-candidate-review
          path: ${{ runner.temp }}/review
          if-no-files-found: error
          retention-days: 30

  # ENABLED ON ITS OWN PREDICATE, exactly like the job above: only a valid dispatch satisfies its `if:`,
  # and the job holds contents: read only - no write, no id-token, no Release, no Pages, no checkout and
  # no repository access of any kind.
  #
  # WHY A SEPARATE JOB AT ALL. The finalize job already reopens its own archives, but that is one job
  # checking its own work on the runner that produced it. This job runs on a different runner, on
  # Windows, and reaches the same question from outside: are the bytes in the finished package the
  # bytes the SIGN job reported signing, and does Windows itself still accept their signatures? Its
  # ancestor is the private lane's `verify` job at installer 9b9341f, and three of that job's habits
  # are deliberately NOT adapted: it selects its package with a wildcard and `Select-Object -First 1`;
  # it reads the signature report straight out of the artifact it is verifying; and it expects a
  # standalone bootstrap, which the public distribution does not have. Here every input is bound to a
  # job output of THIS run first, and the package is addressed by the exact name its own bound
  # version implies.
  #
  # THE DOWNLOADED FILES ARE DATA. No .ps1 from the artifact is run, imported, dot-sourced or
  # evaluated anywhere in this job: they are hashed, handed to signature APIs by path, and passed to
  # signtool as arguments. The only programs this job executes are the runner's own.
  verify:
    name: Prove the finalized archives independently on Windows
    needs: [gate, build, sign, finalize]
    if: (github.event_name == 'workflow_dispatch' && github.repository_id == '1342406426' && github.repository == 'CORPUSfm/CORPUSfm' && github.ref == 'refs/heads/public-signing-candidate')
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Download only this run's finalized review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-finalized-candidate-review
          path: ${{ runner.temp }}/review

      # NOTHING IS READ FOR ITS CONTENT UNTIL IT IS BOUND. The manifest is bound to the finalize
      # job's output, the signature report to the sign job's output, and the report's inventory to
      # the build job's - three different jobs, none of them this one. The manifest must also name
      # the same report digest the sign job emitted, so the two upstream outputs have to agree with
      # each other and not merely with the artifact carrying them.
      - name: Bind the finalized manifest and the signature report to their job outputs
        shell: powershell
        env:
          CFM_EXPECTED_FINALIZED_MANIFEST_SHA256: ${{ needs.finalize.outputs.finalized_manifest_sha256 }}
          CFM_EXPECTED_SIGNATURE_REPORT_SHA256: ${{ needs.sign.outputs.signature_report_sha256 }}
          CFM_EXPECTED_TRUST_RECORD_SHA256: ${{ needs.sign.outputs.trust_record_sha256 }}
          CFM_EXPECTED_INVENTORY_SHA256: ${{ needs.build.outputs.inventory_sha256 }}
          CFM_RUN_ID: ${{ github.run_id }}
          CFM_RUN_ATTEMPT: ${{ github.run_attempt }}
          CFM_RUN_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Refuse([string]$message) { throw ('independent verification refused: ' + $message) }
          function Get-Sha256File([string]$path) { return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          $bindings = [ordered]@{
            manifest  = [string]$env:CFM_EXPECTED_FINALIZED_MANIFEST_SHA256
            report    = [string]$env:CFM_EXPECTED_SIGNATURE_REPORT_SHA256
            trust     = [string]$env:CFM_EXPECTED_TRUST_RECORD_SHA256
            inventory = [string]$env:CFM_EXPECTED_INVENTORY_SHA256
          }
          $owners = @{ manifest = 'the finalize job'; report = 'the sign job'; trust = 'the sign job'
                       inventory = 'the build job' }
          foreach ($key in @($bindings.Keys)) {
            if ($bindings[$key] -cnotmatch '^[0-9a-f]{64}$') { Refuse ($owners[$key] + ' supplied no well-formed ' + $key + ' digest') }
          }
          $review = Join-Path $env:RUNNER_TEMP 'review'
          if (-not (Test-Path -LiteralPath $review -PathType Container)) { Refuse 'the review artifact did not arrive' }

          # 1. The manifest is the finalize job's, and it describes THIS run and its frozen version.
          $manifestPath = Join-Path $review 'finalized-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { Refuse 'the review artifact carries no finalized manifest' }
          if ((Get-Sha256File $manifestPath) -cne $bindings['manifest']) { Refuse 'the finalized manifest is not the one the finalize job produced' }
          $manifest = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $manifestPath -Raw)
          if ([int]$manifest.schema_version -ne 1 -or [string]$manifest.kind -cne 'finalized-review-manifest') { Refuse 'the finalized manifest is not the expected record' }
          if ([string]$manifest.run_commit -cne [string]$env:CFM_RUN_COMMIT) { Refuse 'the finalized manifest names another commit' }
          if ([string]$manifest.run_id -cne [string]$env:CFM_RUN_ID) { Refuse 'the finalized manifest names another run' }
          if ([string]$manifest.run_attempt -cne [string]$env:CFM_RUN_ATTEMPT) { Refuse 'the finalized manifest names another run attempt' }
          if ([string]$manifest.signature_report_sha256 -cne $bindings['report']) { Refuse 'the finalized manifest names a different signature report than the sign job emitted' }
          $series = [string]$manifest.installer_series
          $version = [string]$manifest.installer_version
          if ($series -cnotmatch '^[a-z0-9]+(-[a-z0-9]+)*$') { Refuse ('the manifest names an unsafe series: ' + $series) }
          if ($version -cnotmatch '^[0-9]+\.[0-9]+$') { Refuse ('the manifest names an unexpected public version: ' + $version) }
          $prefix = 'server/' + $series + '/releases/' + $version + '/'
          $packages = [ordered]@{
            windows = $prefix + 'corpusfm-installer-windows-' + $version + '.zip'
            linux   = $prefix + 'corpusfm-installer-linux-' + $version + '.zip'
          }
          if ([string]$manifest.windows_package -cne $packages['windows'] -or [string]$manifest.linux_package -cne $packages['linux']) {
            Refuse 'the manifest does not name the platform packages its own series and version imply'
          }

          # 2. The signature report is the sign job's, over the build's inventory, for this run.
          $reportPath = Join-Path $review 'signature-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { Refuse 'the review artifact carries no signature report' }
          if ((Get-Sha256File $reportPath) -cne $bindings['report']) { Refuse 'the signature report is not the one the sign job verified' }
          $report = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $reportPath -Raw)
          if ([string]$report.verdict -cne 'pass') { Refuse ('the signature report verdict is ' + $report.verdict) }
          if (@($report.failures).Count -ne 0) { Refuse 'the signature report records failures' }
          if ([string]$report.run_commit -cne [string]$env:CFM_RUN_COMMIT) { Refuse 'the signature report names another commit' }
          if ([string]$report.run_id -cne [string]$env:CFM_RUN_ID) { Refuse 'the signature report names another run' }
          if ([string]$report.run_attempt -cne [string]$env:CFM_RUN_ATTEMPT) { Refuse 'the signature report names another run attempt' }
          if ([string]$report.inventory_sha256 -cne $bindings['inventory']) { Refuse 'the signature report is not over the build inventory' }
          $streams = @($report.streams)
          if ($streams.Count -ne 10 -or [int]$report.distinct_stream_count -ne 10) { Refuse 'the signature report does not cover ten streams' }
          if ([int]$report.occurrence_count -ne 11) { Refuse 'the signature report does not cover eleven occurrences' }
          $seen = @{}; $ordinals = @()
          foreach ($row in $streams) {
            $file = [string]$row.file
            if ($file -cnotmatch '^[a-z0-9]+(-[a-z0-9]+)*\.ps1$' -or $file -cne ([string]$row.stream + '.ps1')) { Refuse ('unsafe or inconsistent stream file: ' + $file) }
            if ($seen.ContainsKey($file)) { Refuse ('duplicate stream: ' + $file) }
            $seen[$file] = $true
            if ([string]$row.signed_sha256 -cnotmatch '^[0-9a-f]{64}$' -or [string]$row.signed_sha256 -ceq [string]$row.unsigned_sha256) { Refuse ($file + ' has no distinct signed digest') }
            $paths = @($row.occurrences); $numbers = @($row.occurrence_ordinals)
            if ($paths.Count -lt 1 -or $paths.Count -ne $numbers.Count) { Refuse ($file + ' has an inconsistent occurrence mapping') }
            $ordinals += @($numbers | ForEach-Object { [int]$_ })
          }
          if ((@($ordinals | Sort-Object) -join ',') -cne ((1..11) -join ',')) { Refuse ('the occurrence ordinals are not exactly 1-11: ' + (@($ordinals | Sort-Object) -join ',')) }
          $shared = @($streams | Where-Object { [string]$_.stream -ceq 'cfm-lib' })
          if ($shared.Count -ne 1 -or ((@($shared[0].occurrence_ordinals) | ForEach-Object { [int]$_ } | Sort-Object) -join ',') -cne '2,5') { Refuse 'cfm-lib is not exactly occurrences 2 and 5' }

          # 3. THE ARCHIVE-BYTE PROOF'S FIRST HALF: the artifact is exactly the files the manifest
          #    names, byte for byte, with nothing added. A file ADDED after finalization is not a
          #    rewrite, so per-file digests alone would never notice it.
          $entries = @(Get-ChildItem -LiteralPath $review -Recurse -Force)
          foreach ($item in $entries) {
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { Refuse ('the review artifact carries a link: ' + $item.FullName) }
          }
          $root = (Get-Item -LiteralPath $review).FullName
          $present = @{}
          foreach ($item in @($entries | Where-Object { -not $_.PSIsContainer })) {
            $relative = ($item.FullName.Substring($root.Length).TrimStart('\', '/')) -replace '\\', '/'
            $present[$relative] = $item.FullName
          }
          $listed = @($manifest.files)
          $expected = @()
          foreach ($row in $listed) {
            $path = [string]$row.path
            if ($path -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._/-]*$' -or $path.Contains('..') -or $path.Contains('//')) { Refuse ('unsafe manifest path: ' + $path) }
            if ([string]$row.sha256 -cnotmatch '^[0-9a-f]{64}$') { Refuse ('the manifest records no well-formed digest for ' + $path) }
            $expected += $path
          }
          if (@($expected | Sort-Object -Unique).Count -ne $expected.Count) { Refuse 'the manifest lists a path more than once, case included' }
          $expected += 'finalized-manifest.json'
          $missing = @($expected | Where-Object { -not $present.ContainsKey($_) })
          $extra = @($present.Keys | Where-Object { $expected -cnotcontains $_ })
          if ($missing.Count -ne 0) { Refuse ('the review artifact is missing ' + ($missing -join ', ')) }
          if ($extra.Count -ne 0) { Refuse ('the review artifact carries files the manifest does not name: ' + ($extra -join ', ')) }
          foreach ($row in $listed) {
            $full = $present[[string]$row.path]
            if ((Get-Item -LiteralPath $full).Length -ne [long]$row.size) { Refuse ([string]$row.path + ' is not the size the manifest records') }
            if ((Get-Sha256File $full) -cne [string]$row.sha256) { Refuse ([string]$row.path + ' is not the bytes the manifest records') }
          }

          # 4. THE TRUST ASSETS, bound before they are believed. The record is bound to the SIGN job's
          #    own digest - not to the manifest that travels with it - and the certificate to the leaf
          #    digest the record itself carries, so neither the finalize job nor the artifact can
          #    substitute a publisher. The leaf's file name comes from the record's measured
          #    thumbprint; this lane pins no thumbprint anywhere, and a later run may present another.
          $trustName = $prefix + 'corpusfm-installer-windows-' + $version + '.trust.json'
          if (-not $present.ContainsKey($trustName)) { Refuse 'the release directory carries no publisher trust record' }
          if ((Get-Sha256File $present[$trustName]) -cne $bindings['trust']) { Refuse 'the trust record is not the one the sign job emitted' }
          $trust = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $present[$trustName] -Raw)
          if ([string]$trust.kind -cne 'publisher-trust-record') { Refuse 'the trust record is not the expected record' }
          if ([string]$trust.run_commit -cne [string]$env:CFM_RUN_COMMIT) { Refuse 'the trust record names another commit' }
          if ([string]$trust.run_id -cne [string]$env:CFM_RUN_ID) { Refuse 'the trust record names another run' }
          if ([string]$trust.signature_report_sha256 -cne $bindings['report']) { Refuse 'the trust record describes a different signature report than the sign job emitted' }
          if ([string]$trust.required_store -cne 'LocalMachine\TrustedPublisher') { Refuse ('the trust record names another store: ' + $trust.required_store) }
          if ([string]$trust.code_signing_eku -cne '1.3.6.1.5.5.7.3.3') { Refuse ('the trust record names another EKU: ' + $trust.code_signing_eku) }
          $thumbprint = [string]$trust.signer_thumbprint
          if ($thumbprint -cnotmatch '^[0-9A-Fa-f]{40}$') { Refuse ('the trust record carries no SHA-1 leaf thumbprint: ' + $thumbprint) }
          $leafDigest = [string]$trust.leaf_der_sha256
          if ($leafDigest -cnotmatch '^[0-9a-f]{64}$') { Refuse ('the trust record carries no SHA-256 leaf digest: ' + $leafDigest) }
          $leafName = $prefix + 'corpusfm-signing-leaf-' + $thumbprint + '.cer'
          if (-not $present.ContainsKey($leafName)) { Refuse ('the release directory carries no ' + $leafName) }
          if ((Get-Sha256File $present[$leafName]) -cne $leafDigest) { Refuse 'the released signing leaf is not the certificate the trust record describes' }

          # 5. The release directory is exactly the ten expected names for the bound version, and the
          #    records inside it agree with the manifest rather than only with themselves.
          $releaseFiles = @($expected | Where-Object { $_.StartsWith($prefix, [StringComparison]::Ordinal) })
          $expectedRelease = @($packages['windows'], $packages['linux'], ($packages['windows'] + '.sha256'),
                               ($packages['linux'] + '.sha256'), ($prefix + 'release.json'), ($prefix + 'windows-signature-map.json'),
                               $trustName, $leafName, ($trustName + '.sha256'), ($leafName + '.sha256'))
          if ((@($releaseFiles | Sort-Object) -join '|') -cne (@($expectedRelease | Sort-Object) -join '|')) {
            Refuse ('the release directory is not exactly the ten expected files: ' + (@($releaseFiles | Sort-Object) -join ', '))
          }
          foreach ($asset in @($trustName, $leafName)) {
            $sidecarPath = $present[$asset + '.sha256']
            $line = (Get-Content -LiteralPath $sidecarPath -Raw).Trim()
            $expectedLine = (Get-Sha256File $present[$asset]) + '  ' + (Split-Path -Leaf $asset)
            if ($line -cne $expectedLine) { Refuse ((Split-Path -Leaf $asset) + '.sha256 does not describe the released asset') }
          }
          $releaseJson = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $present[$prefix + 'release.json'] -Raw)
          if ([string]$releaseJson.commit -cne [string]$env:CFM_RUN_COMMIT) { Refuse 'release.json does not name the triggering commit' }
          if ([string]$releaseJson.installer_version -cne $version) { Refuse 'release.json does not name the bound version' }
          foreach ($platform in @('windows', 'linux')) {
            $package = $packages[$platform]
            $digest = [string](@($listed | Where-Object { [string]$_.path -ceq $package })[0].sha256)
            if ([string]$releaseJson.platforms.$platform.sha256 -cne $digest) { Refuse ($platform + ': release.json disagrees with the manifest digest') }
            $sidecar = [string]((Get-Content -LiteralPath $present[$package + '.sha256'] -Raw).Trim() -split '\s+')[0]
            if ($sidecar -cne $digest) { Refuse ($platform + ': the sidecar disagrees with the manifest digest') }
          }
          Write-Host ('Bound: manifest ' + $bindings['manifest'].Substring(0, 12) + ', report ' + $bindings['report'].Substring(0, 12) +
                      '; ' + $listed.Count + ' finalized files, ' + $series + ' ' + $version + '.')

      # THE ARCHIVE-BYTE PROOF. It answers one question only - are these the bytes the sign job said
      # it signed - and it answers it WITHOUT any cryptography: the archives are reopened, their entry
      # lists are checked for duplicate and case-colliding names BEFORE any name is looked up or any
      # member is read, and each of the eleven occurrences is hashed against the report. Windows
      # extraction is case-insensitive, so a case collision is a real substitution route.
      #
      # Extraction writes into a FRESH directory under a name derived from the validated report -
      # ordinal plus stream file - never from the archive's own entry name, so a hostile member name
      # has no path to express. The step's verdict is written either way.
      - name: Prove the archive bytes are the reported signed streams
        shell: powershell
        env:
          CFM_EXPECTED_FINALIZED_MANIFEST_SHA256: ${{ needs.finalize.outputs.finalized_manifest_sha256 }}
          CFM_EXPECTED_SIGNATURE_REPORT_SHA256: ${{ needs.sign.outputs.signature_report_sha256 }}
          CFM_RUN_ID: ${{ github.run_id }}
          CFM_RUN_ATTEMPT: ${{ github.run_attempt }}
          CFM_RUN_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $review = Join-Path $env:RUNNER_TEMP 'review'
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'verification'
          $occurrenceDir = Join-Path $env:RUNNER_TEMP 'occurrences'
          $proofPath = Join-Path $evidenceDir 'archive-byte-proof.json'
          $failures = New-Object System.Collections.ArrayList
          $extracted = New-Object System.Collections.ArrayList
          $linuxFacts = $null
          $occurrenceCount = 0
          $powershellEntryCount = $null
          function Add-Failure([string]$message) { [void]$failures.Add($message) }
          function Get-Sha256File([string]$path) { return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Sha256Bytes([byte[]]$bytes) {
            $algorithm = [Security.Cryptography.SHA256]::Create()
            try { return (($algorithm.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') }) -join '') }
            finally { $algorithm.Dispose() }
          }
          function Read-Entry($entry) {
            $stream = $entry.Open()
            try {
              $buffer = New-Object System.IO.MemoryStream
              $stream.CopyTo($buffer)
              return ,([byte[]]$buffer.ToArray())
            } finally { $stream.Dispose() }
          }
          # AN ENTRY'S TYPE IS METADATA, NOT ITS NAME. A ZIP can carry a symlink, a FIFO or a device,
          # and unpacking one of those is not a file copy - so the type is read from the Unix mode in
          # ExternalAttributes. If the runner's ZIP reader does not expose that property the type
          # cannot be judged at all, and this refuses rather than assuming a regular file.
          function Get-ExternalAttributes($entry) {
            $property = $entry.PSObject.Properties['ExternalAttributes']
            if ($null -eq $property) { return $null }
            return [int]$property.Value
          }
          function Get-UnixMode($entry) {
            $attributes = Get-ExternalAttributes $entry
            if ($null -eq $attributes) { return $null }
            return (($attributes -shr 16) -band 4095)
          }
          # EVERY name is judged before the archive is used for anything - DIRECTORY ENTRIES INCLUDED.
          # `folder/` twice, `folder/` against `FOLDER/`, and `x` against `x/` all collide when the
          # archive is unpacked, and excluding directories from the comparison is exactly what would
          # let them through. Names are compared with one trailing slash removed, so a directory and a
          # file cannot both claim one name. Files are counted as ENTRIES, never as the keys of a map
          # that would silently collapse a duplicate.
          #
          # Directory entries are ALLOWED but never read. The deterministic writer emits none, so a
          # package built by it has only regular files; the released builder pin this job must be able
          # to verify still produced them with `zip -r`, and refusing them outright would bind the
          # check to one builder rather than to what is actually unsafe.
          function Assert-SafeUniqueEntries($archive, [string]$label) {
            $all = @($archive.Entries)
            $normalized = @()
            foreach ($entry in $all) {
              $name = [string]$entry.FullName
              if ([string]::IsNullOrEmpty($name)) { throw ($label + ' carries an unnamed entry') }
              if ($name.Contains('\') -or $name.Contains(':') -or $name.Contains('//') -or $name.StartsWith('/', [StringComparison]::Ordinal)) {
                throw ($label + ' carries an unsafe entry name: ' + $name)
              }
              $namedAsDirectory = $name.EndsWith('/', [StringComparison]::Ordinal)
              $bare = if ($namedAsDirectory) { $name.Substring(0, $name.Length - 1) } else { $name }
              if ([string]::IsNullOrEmpty($bare)) { throw ($label + ' carries an unnamed entry') }
              foreach ($part in $bare.Split('/')) {
                if ($part -ceq '..' -or $part -ceq '.' -or $part -ceq '') { throw ($label + ' carries a traversing entry name: ' + $name) }
              }
              $attributes = Get-ExternalAttributes $entry
              if ($null -eq $attributes) { throw ($label + ': this runner exposes no ZIP external attributes, so entry types cannot be judged') }
              $mode = $attributes -shr 16
              $type = $mode -band 61440
              if ($type -ne 0 -and $type -ne 32768 -and $type -ne 16384) {
                throw ($label + ' carries a link or special-file entry: ' + $name)
              }
              if (($mode -band 3584) -ne 0) { throw ($label + ' carries a set-id or sticky entry: ' + $name) }
              if (($attributes -band 1024) -ne 0) { throw ($label + ' carries a reparse-point entry: ' + $name) }
              if ($type -ne 0 -and (($type -eq 16384) -ne $namedAsDirectory)) {
                throw ($label + ' carries an entry whose name and type disagree: ' + $name)
              }
              if ((($attributes -band 16) -ne 0) -and -not $namedAsDirectory) {
                throw ($label + ' carries a directory entry without a trailing slash: ' + $name)
              }
              $normalized += $bare
            }
            if (@($normalized | Sort-Object -Unique -CaseSensitive).Count -ne $normalized.Count) {
              $duplicates = @($normalized | Group-Object -CaseSensitive | Where-Object { $_.Count -gt 1 } | ForEach-Object { $_.Name })
              throw ($label + ' carries duplicate entries: ' + ($duplicates -join ', '))
            }
            $folded = @($normalized | ForEach-Object { $_.ToLowerInvariant() })
            if (@($folded | Sort-Object -Unique -CaseSensitive).Count -ne $folded.Count) {
              $collisions = @($folded | Group-Object -CaseSensitive | Where-Object { $_.Count -gt 1 } | ForEach-Object { $_.Name })
              throw ($label + ' carries case-colliding entries: ' + ($collisions -join ', '))
            }
            return $all
          }
          # Files only, by the rule the check above already enforced: a trailing slash and the
          # directory type agree, so neither can be read as the other.
          function Get-FileEntries($entries) { return @($entries | Where-Object { -not ([string]$_.FullName).EndsWith('/', [StringComparison]::Ordinal) }) }

          $windowsPackage = $null; $linuxPackage = $null
          try {
            # The two bindings are re-established here, so this step stands on its own evidence.
            $manifestPath = Join-Path $review 'finalized-manifest.json'
            $reportPath = Join-Path $review 'signature-report.json'
            if ((Get-Sha256File $manifestPath) -cne [string]$env:CFM_EXPECTED_FINALIZED_MANIFEST_SHA256) { throw 'the finalized manifest is not the finalize job output' }
            if ((Get-Sha256File $reportPath) -cne [string]$env:CFM_EXPECTED_SIGNATURE_REPORT_SHA256) { throw 'the signature report is not the sign job output' }
            $manifest = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $manifestPath -Raw)
            $report = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $reportPath -Raw)
            if ([string]$manifest.run_commit -cne [string]$env:CFM_RUN_COMMIT -or [string]$report.run_commit -cne [string]$env:CFM_RUN_COMMIT) { throw 'the bound records are not this run''s' }
            $windowsPackage = Join-Path $review (([string]$manifest.windows_package) -replace '/', [IO.Path]::DirectorySeparatorChar)
            $linuxPackage = Join-Path $review (([string]$manifest.linux_package) -replace '/', [IO.Path]::DirectorySeparatorChar)
            $listed = @($manifest.files)
            foreach ($pair in @(, @([string]$manifest.windows_package, $windowsPackage)) + @(, @([string]$manifest.linux_package, $linuxPackage))) {
              if (-not (Test-Path -LiteralPath $pair[1] -PathType Leaf)) { throw ('the bound package is absent: ' + $pair[0]) }
              $row = @($listed | Where-Object { [string]$_.path -ceq $pair[0] })
              if ($row.Count -ne 1) { throw ('the manifest does not list ' + $pair[0]) }
              if ((Get-Sha256File $pair[1]) -cne [string]$row[0].sha256) { throw ('the package on disk is not the one the manifest records: ' + $pair[0]) }
            }
            if (Test-Path -LiteralPath $occurrenceDir) { throw 'the occurrence destination already exists' }
            New-Item -ItemType Directory -Path $occurrenceDir | Out-Null
            $destination = Get-Item -LiteralPath $occurrenceDir
            if ($destination.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'the occurrence destination is a link' }

            $outer = [IO.Compression.ZipFile]::OpenRead($windowsPackage)
            try {
              $outerEntries = Assert-SafeUniqueEntries $outer 'the Windows outer ZIP'
              $outerFiles = Get-FileEntries $outerEntries
              $runtimeEntry = @($outerFiles | Where-Object { [string]$_.FullName -ceq 'installer-runtime.zip' })
              if ($runtimeEntry.Count -ne 1) { throw 'the Windows package carries no single installer-runtime.zip' }
              $runtimeStream = New-Object System.IO.MemoryStream (, (Read-Entry $runtimeEntry[0]))
              $runtime = New-Object System.IO.Compression.ZipArchive($runtimeStream, [IO.Compression.ZipArchiveMode]::Read)
              try {
                $runtimeEntries = Assert-SafeUniqueEntries $runtime 'the Windows installer-runtime.zip'
                $runtimeFiles = Get-FileEntries $runtimeEntries
                $places = @{ 'windows/outer/' = $outerFiles; 'windows/runtime/' = $runtimeFiles }
                foreach ($row in @($report.streams)) {
                  $file = [string]$row.file
                  $paths = @($row.occurrences); $numbers = @($row.occurrence_ordinals)
                  for ($i = 0; $i -lt $paths.Count; $i++) {
                    $occurrence = [string]$paths[$i]
                    $ordinal = [int]$numbers[$i]
                    $occurrenceCount += 1
                    if ($ordinal -lt 1 -or $ordinal -gt 11) { Add-Failure ($occurrence + ': ordinal ' + $ordinal + ' is out of range'); continue }
                    $key = @($places.Keys | Where-Object { $occurrence.StartsWith($_, [StringComparison]::Ordinal) })
                    if ($key.Count -ne 1) { Add-Failure ('the report names an occurrence this job cannot place: ' + $occurrence); continue }
                    $member = $occurrence.Substring($key[0].Length)
                    $found = @($places[$key[0]] | Where-Object { [string]$_.FullName -ceq $member })
                    if ($found.Count -ne 1) { Add-Failure ($occurrence + ': missing from the finished Windows archives'); continue }
                    $bytes = Read-Entry $found[0]
                    $digest = Get-Sha256Bytes $bytes
                    if ($digest -cne [string]$row.signed_sha256) { Add-Failure ($occurrence + ': ' + $digest + ' is not the signed ' + $row.signed_sha256); continue }
                    $target = Join-Path $destination.FullName ([string]$ordinal + '-' + $file)
                    $handle = [IO.File]::Open($target, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
                    try { $handle.Write($bytes, 0, $bytes.Length) } finally { $handle.Dispose() }
                    $written = Get-Item -LiteralPath $target
                    if ($written.Attributes -band [IO.FileAttributes]::ReparsePoint) { Add-Failure ($occurrence + ': the extracted copy is a link'); continue }
                    if ((Get-Sha256File $target) -cne [string]$row.signed_sha256) { Add-Failure ($occurrence + ': changed while being extracted'); continue }
                    [void]$extracted.Add([ordered]@{ ordinal = $ordinal; occurrence = $occurrence; stream = [string]$row.stream
                                                     file = $file; signed_sha256 = [string]$row.signed_sha256; path = $written.FullName })
                  }
                }
                if ($occurrenceCount -ne 11) { Add-Failure ('the report covers ' + $occurrenceCount + ' occurrences, not 11') }
                # And nothing else executable rode along: a file ADDED after signing is not a rewrite,
                # so every digest above would still pass.
                $powershell = @(@($outerFiles) + @($runtimeFiles) | Where-Object { ([string]$_.FullName).ToLowerInvariant().EndsWith('.ps1', [StringComparison]::Ordinal) })
                $powershellEntryCount = $powershell.Count
                if ($powershellEntryCount -ne 11) { Add-Failure ('the finished Windows archives carry ' + $powershellEntryCount + ' PowerShell entries, not 11') }
              } finally { $runtime.Dispose(); $runtimeStream.Dispose() }
            } finally { $outer.Dispose() }

            # THE LINUX HALF IS RECORDED, NOT RE-ADJUDICATED. Its membership is checked for the same
            # substitution routes, and its modes are read from the ZIP's external attributes so the
            # evidence is in one place - but the finalize job already checked those modes against the
            # staged record on Linux, and NOTHING here says anything about a Linux installation.
            $linuxOuter = [IO.Compression.ZipFile]::OpenRead($linuxPackage)
            try {
              $linuxOuterEntries = Assert-SafeUniqueEntries $linuxOuter 'the Linux outer ZIP'
              $linuxOuterFiles = Get-FileEntries $linuxOuterEntries
              $linuxRuntimeEntry = @($linuxOuterFiles | Where-Object { [string]$_.FullName -ceq 'installer-runtime.zip' })
              if ($linuxRuntimeEntry.Count -ne 1) { throw 'the Linux package carries no single installer-runtime.zip' }
              $linuxStream = New-Object System.IO.MemoryStream (, (Read-Entry $linuxRuntimeEntry[0]))
              $linuxRuntime = New-Object System.IO.Compression.ZipArchive($linuxStream, [IO.Compression.ZipArchiveMode]::Read)
              try {
                $linuxRuntimeEntries = Assert-SafeUniqueEntries $linuxRuntime 'the Linux installer-runtime.zip'
                $linuxRuntimeFiles = Get-FileEntries $linuxRuntimeEntries
                # The membership check above already refused an archive whose external attributes it
                # could not read, so the mode is present here or nothing reached this line.
                $executableOuter = @($linuxOuterFiles | Where-Object { ((Get-UnixMode $_) -band 73) -ne 0 } | ForEach-Object { [string]$_.FullName } | Sort-Object)
                $executableRuntime = @($linuxRuntimeFiles | Where-Object { ((Get-UnixMode $_) -band 73) -ne 0 } | ForEach-Object { [string]$_.FullName } | Sort-Object)
                $linuxFacts = [ordered]@{
                  package = [string]$manifest.linux_package
                  sha256 = Get-Sha256File $linuxPackage
                  outer_entry_count = $linuxOuterFiles.Count
                  runtime_entry_count = $linuxRuntimeFiles.Count
                  powershell_entries = @(@($linuxOuterFiles) + @($linuxRuntimeFiles) | Where-Object { ([string]$_.FullName).ToLowerInvariant().EndsWith('.ps1', [StringComparison]::Ordinal) } | ForEach-Object { [string]$_.FullName })
                  executable_outer = $executableOuter
                  executable_runtime = $executableRuntime
                  mode_source = 'ZIP external attributes, read on Windows'
                  note = 'recorded, not adjudicated here: the finalize job checked these against the staged record on Linux. Windows execution proves nothing about a Linux installation.'
                }
                if (@($linuxFacts.powershell_entries).Count -ne 0) { Add-Failure 'the Linux package carries PowerShell entries' }
              } finally { $linuxRuntime.Dispose(); $linuxStream.Dispose() }
            } finally { $linuxOuter.Dispose() }
          } catch {
            Add-Failure ('the archive-byte proof could not complete: ' + $_.Exception.Message)
          }

          $verdict = if ($failures.Count -eq 0) { 'pass' } else { 'fail' }
          $proof = [ordered]@{
            schema_version = 1
            kind = 'independent-archive-byte-proof'
            verdict = $verdict
            failures = @($failures)
            run_id = [string]$env:CFM_RUN_ID; run_attempt = [string]$env:CFM_RUN_ATTEMPT; run_commit = [string]$env:CFM_RUN_COMMIT
            finalized_manifest_sha256 = [string]$env:CFM_EXPECTED_FINALIZED_MANIFEST_SHA256
            signature_report_sha256 = [string]$env:CFM_EXPECTED_SIGNATURE_REPORT_SHA256
            windows_package_sha256 = if ($null -ne $windowsPackage -and (Test-Path -LiteralPath $windowsPackage -PathType Leaf)) { Get-Sha256File $windowsPackage } else { $null }
            occurrence_count = $occurrenceCount
            powershell_entry_count = $powershellEntryCount
            proof_kind = 'archive bytes only; no signature was validated in this step'
            extracted = @($extracted)
            linux = $linuxFacts
          }
          if (-not (Test-Path -LiteralPath $evidenceDir)) { New-Item -ItemType Directory -Path $evidenceDir | Out-Null }
          ($proof | ConvertTo-Json -Depth 6) | Set-Content -LiteralPath $proofPath -Encoding ASCII
          if ($failures.Count -ne 0) { throw ('the archive-byte proof did not pass: ' + ($failures -join '; ')) }
          Write-Host ('Archive bytes proved: ' + $occurrenceCount + ' occurrences are the report''s signed streams; ' +
                      $powershellEntryCount + ' PowerShell entries in the Windows package, no more.')

      # THE CRYPTOGRAPHIC PROOF, kept separate on purpose: the step above establishes that these are
      # the reported bytes, and this one asks Windows whether those bytes still carry a valid
      # signature by the required publisher. Neither claim stands in for the other.
      #
      # The publisher is enforced by the SHA-256 of the measured subject, the same accepted rule the
      # sign job uses - never a thumbprint constant, which rotates with the leaf. A timestamp
      # countersigner shows a countersignature exists; it is not independent proof of RFC 3161 format,
      # and this step claims no more than the sign job's own report does.
      #
      # THIS STEP ALSO CLOSES SECTION 3A's GATE-4 QUESTION for these bytes: the released `.cer` must be
      # the certificate that actually signed every one of the eleven occurrences, and the released
      # trust record must state what this runner measures. Both are compared against the MEASUREMENT,
      # so the published asset is checked by the signature rather than by another document.
      - name: Prove the extracted occurrences are validly signed on Windows
        shell: powershell
        env:
          CFM_EXPECTED_FINALIZED_MANIFEST_SHA256: ${{ needs.finalize.outputs.finalized_manifest_sha256 }}
          CFM_EXPECTED_TRUST_RECORD_SHA256: ${{ needs.sign.outputs.trust_record_sha256 }}
          CFM_RUN_ID: ${{ github.run_id }}
          CFM_RUN_ATTEMPT: ${{ github.run_attempt }}
          CFM_RUN_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $CODE_SIGNING_EKU = '1.3.6.1.5.5.7.3.3'
          $REQUIRED_STORE = 'LocalMachine\TrustedPublisher'
          $EXPECTED_PUBLISHER_SUBJECT_SHA256 = '911b55f39a0fd5e400251f1a511374123851e9901c1ada719ff2109346b66429'
          $review = Join-Path $env:RUNNER_TEMP 'review'
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'verification'
          $proofPath = Join-Path $evidenceDir 'archive-byte-proof.json'
          $reportPath = Join-Path $evidenceDir 'signature-verification-report.json'
          $failures = New-Object System.Collections.ArrayList
          $rows = New-Object System.Collections.ArrayList
          function Add-Failure([string]$message) { [void]$failures.Add($message) }
          function Get-Sha256File([string]$path) { return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          function Get-Sha256Bytes([byte[]]$bytes) {
            $algorithm = [Security.Cryptography.SHA256]::Create()
            try { return (($algorithm.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') }) -join '') }
            finally { $algorithm.Dispose() }
          }
          function Get-Sha1Bytes([byte[]]$bytes) {
            $algorithm = [Security.Cryptography.SHA1]::Create()
            try { return (($algorithm.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') }) -join '').ToUpperInvariant() }
            finally { $algorithm.Dispose() }
          }
          function Get-Sha256Text([string]$text) {
            $algorithm = [Security.Cryptography.SHA256]::Create()
            try { return (($algorithm.ComputeHash([Text.Encoding]::UTF8.GetBytes($text)) | ForEach-Object { $_.ToString('x2') }) -join '') }
            finally { $algorithm.Dispose() }
          }
          function Get-Utc($value) { if ($null -eq $value) { return $null }; return ([datetime]$value).ToUniversalTime().ToString('o') }
          # A JSON date field comes back as a [datetime], which a plain cast would render in the
          # runner's culture format; the record's own UTC text is what has to be compared.
          function Get-Text($value) {
            if ($value -is [datetime]) { return ([datetime]$value).ToUniversalTime().ToString('o') }
            return [string]$value
          }
          $signtoolPath = $null; $signtoolExit = $null; $signtoolOutput = $null
          $counts = [ordered]@{ verified = $null; warnings = $null; errors = $null }
          $subjects = @()
          $trustFacts = $null
          $trust = $null; $leafDer = $null; $leafDerDigest = $null
          try {
            # The trust assets, re-bound here so this step stands on its own evidence: the manifest to
            # the finalize job's digest, the record to the sign job's, the certificate to the record.
            $manifestPath = Join-Path $review 'finalized-manifest.json'
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 'the review artifact carries no finalized manifest' }
            if ((Get-Sha256File $manifestPath) -cne [string]$env:CFM_EXPECTED_FINALIZED_MANIFEST_SHA256) { throw 'the finalized manifest is not the finalize job output' }
            $manifest = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $manifestPath -Raw)
            $prefix = 'server/' + [string]$manifest.installer_series + '/releases/' + [string]$manifest.installer_version + '/'
            $trustPath = Join-Path $review (($prefix + 'corpusfm-installer-windows-' + [string]$manifest.installer_version + '.trust.json') -replace '/', [IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path -LiteralPath $trustPath -PathType Leaf)) { throw 'the release directory carries no publisher trust record' }
            if ((Get-Sha256File $trustPath) -cne [string]$env:CFM_EXPECTED_TRUST_RECORD_SHA256) { throw 'the trust record is not the one the sign job emitted' }
            $trust = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $trustPath -Raw)
            $recordThumbprint = ([string]$trust.signer_thumbprint)
            if ($recordThumbprint -cnotmatch '^[0-9A-Fa-f]{40}$') { throw ('the trust record carries no SHA-1 leaf thumbprint: ' + $recordThumbprint) }
            $leafPath = Join-Path $review (($prefix + 'corpusfm-signing-leaf-' + $recordThumbprint + '.cer') -replace '/', [IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path -LiteralPath $leafPath -PathType Leaf)) { throw 'the release directory carries no signing leaf certificate' }
            $leafDer = [IO.File]::ReadAllBytes($leafPath)
            $leafDerDigest = Get-Sha256Bytes $leafDer
            if ($leafDerDigest -cne [string]$trust.leaf_der_sha256) { throw 'the released signing leaf is not the certificate the trust record describes' }
            $leafThumbprint = Get-Sha1Bytes $leafDer
            if ($leafThumbprint -cne $recordThumbprint.ToUpperInvariant()) { throw ('the released leaf hashes to ' + $leafThumbprint + ', not the recorded thumbprint ' + $recordThumbprint) }
            if ([string]$trust.required_store -cne $REQUIRED_STORE) { throw ('the trust record names another store: ' + $trust.required_store) }
            if ([string]$trust.code_signing_eku -cne $CODE_SIGNING_EKU) { throw ('the trust record names another EKU: ' + $trust.code_signing_eku) }
            $trustFacts = [ordered]@{
              trust_record_sha256 = Get-Sha256File $trustPath
              leaf_der_sha256 = $leafDerDigest
              leaf_thumbprint_measured = $leafThumbprint
              required_store = [string]$trust.required_store
              note = 'the released certificate is compared to the leaf that signed each occurrence; no thumbprint is pinned in this lane'
            }

            if (-not (Test-Path -LiteralPath $proofPath -PathType Leaf)) { throw 'the archive-byte proof is missing' }
            $proof = ConvertFrom-Json -InputObject (Get-Content -LiteralPath $proofPath -Raw)
            if ([string]$proof.verdict -cne 'pass' -or @($proof.failures).Count -ne 0) { throw 'the archive-byte proof did not pass' }
            if ([string]$proof.run_commit -cne [string]$env:CFM_RUN_COMMIT -or [string]$proof.run_id -cne [string]$env:CFM_RUN_ID) { throw 'the archive-byte proof is not this run''s' }
            $occurrences = @($proof.extracted)
            if ($occurrences.Count -ne 11) { throw ('the archive-byte proof extracted ' + $occurrences.Count + ' occurrences, not 11') }
            foreach ($item in $occurrences) {
              $path = [string]$item.path
              $entry = [ordered]@{
                ordinal = [int]$item.ordinal; occurrence = [string]$item.occurrence; file = [string]$item.file
                signed_sha256 = [string]$item.signed_sha256; measured_sha256 = $null
                status = $null; status_message = $null
                signer_subject_sha256 = $null; signer_issuer = $null; signer_thumbprint = $null
                signer_der_sha256 = $null; released_leaf_matches = $false
                signer_not_before = $null; signer_not_after = $null
                eku_oids = @(); has_code_signing_eku = $false; publisher_subject_matches = $false
                timestamp_countersigner_present = $false; timestamp_subject = $null; timestamp_not_after = $null
              }
              [void]$rows.Add($entry)
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { Add-Failure ($entry.occurrence + ': the extracted copy is gone'); continue }
              $entry.measured_sha256 = Get-Sha256File $path
              if ($entry.measured_sha256 -cne $entry.signed_sha256) { Add-Failure ($entry.occurrence + ': the extracted copy is no longer the reported bytes'); continue }
              $subjects += $path
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($null -eq $signature) { Add-Failure ($entry.occurrence + ': no signature result'); continue }
              $entry.status = [string]$signature.Status
              $entry.status_message = [string]$signature.StatusMessage
              if ($entry.status -cne 'Valid') { Add-Failure ($entry.occurrence + ': status ' + $entry.status) }
              $certificate = $signature.SignerCertificate
              if ($null -eq $certificate) { Add-Failure ($entry.occurrence + ': no signer certificate') }
              else {
                $entry.signer_subject_sha256 = Get-Sha256Text ([string]$certificate.Subject)
                $entry.signer_issuer = [string]$certificate.Issuer
                $entry.signer_thumbprint = [string]$certificate.Thumbprint
                $entry.signer_not_before = Get-Utc $certificate.NotBefore
                $entry.signer_not_after = Get-Utc $certificate.NotAfter
                foreach ($extension in @($certificate.Extensions)) {
                  if ($null -ne $extension -and $extension.Oid.Value -eq '2.5.29.37') {
                    $typed = New-Object Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension($extension, $false)
                    $entry.eku_oids = @($typed.EnhancedKeyUsages | ForEach-Object { $_.Value })
                  }
                }
                $entry.has_code_signing_eku = (@($entry.eku_oids) -ccontains $CODE_SIGNING_EKU)
                $entry.publisher_subject_matches = ($entry.signer_subject_sha256 -ceq $EXPECTED_PUBLISHER_SUBJECT_SHA256)
                if (-not $entry.has_code_signing_eku) { Add-Failure ($entry.occurrence + ': no code-signing EKU') }
                if (-not $entry.publisher_subject_matches) { Add-Failure ($entry.occurrence + ': signer subject is not the required publisher') }
                # The released certificate IS this occurrence's signer, and the record describes it.
                $raw = $certificate.RawData
                if ($null -eq $raw -or @($raw).Count -eq 0) { Add-Failure ($entry.occurrence + ': the signer certificate carries no DER bytes') }
                else {
                  $entry.signer_der_sha256 = Get-Sha256Bytes ([byte[]]$raw)
                  $entry.released_leaf_matches = ($entry.signer_der_sha256 -ceq $leafDerDigest)
                  if (-not $entry.released_leaf_matches) { Add-Failure ($entry.occurrence + ': the released signing leaf is not the certificate that signed it') }
                }
                if ($entry.signer_thumbprint -cnotmatch '^[0-9A-Fa-f]{40}$' -or ([string]$entry.signer_thumbprint).ToUpperInvariant() -cne ([string]$trust.signer_thumbprint).ToUpperInvariant()) {
                  Add-Failure ($entry.occurrence + ': the trust record names thumbprint ' + $trust.signer_thumbprint + ', measured ' + $entry.signer_thumbprint)
                }
                if ([string]$trust.signer_subject -cne [string]$certificate.Subject) { Add-Failure ($entry.occurrence + ': the trust record names another signer subject') }
                if ([string]$trust.signer_issuer -cne [string]$certificate.Issuer) { Add-Failure ($entry.occurrence + ': the trust record names another issuer') }
                if ((Get-Text $trust.signer_not_before) -cne $entry.signer_not_before -or (Get-Text $trust.signer_not_after) -cne $entry.signer_not_after) {
                  Add-Failure ($entry.occurrence + ': the trust record names another validity window')
                }
                if (-not (@($entry.eku_oids) -ccontains [string]$trust.code_signing_eku)) { Add-Failure ($entry.occurrence + ': the EKU the trust record names is not on the signing certificate') }
              }
              $stamp = $signature.TimeStamperCertificate
              if ($null -eq $stamp) { Add-Failure ($entry.occurrence + ': no timestamp countersignature') }
              else {
                $entry.timestamp_countersigner_present = $true
                $entry.timestamp_subject = [string]$stamp.Subject
                $entry.timestamp_not_after = Get-Utc $stamp.NotAfter
              }
            }

            # signtool, over exactly the files this job extracted, with zero warnings and zero errors
            # and one readable success per intended file.
            $programFilesX86 = ${env:ProgramFiles(x86)}
            if ([string]::IsNullOrEmpty($programFilesX86)) { Add-Failure 'ProgramFiles(x86) is not set; signtool cannot be located' }
            elseif ($subjects.Count -ne 11) { Add-Failure ('only ' + $subjects.Count + ' occurrences reached signtool, not 11') }
            else {
              $kits = Join-Path (Join-Path (Join-Path $programFilesX86 'Windows Kits') '10') 'bin'
              $tool = @(Get-ChildItem -LiteralPath $kits -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
                        Where-Object { $_.Directory.Name -ceq 'x64' } | Sort-Object FullName | Select-Object -Last 1)
              if ($tool.Count -ne 1) { Add-Failure 'signtool.exe was not found; this lane cannot claim verification without it' }
              else {
                $signtoolPath = $tool[0].FullName
                $files = [string[]]@($subjects)
                $signtoolOutput = & $signtoolPath verify /pa /all /v /tw @files 2>&1 | Out-String
                $signtoolExit = $LASTEXITCODE
                Write-Host $signtoolOutput
                if ($signtoolExit -ne 0) { Add-Failure ('signtool verify exited ' + $signtoolExit) }
                $patterns = [ordered]@{
                  verified = '(?im)^\s*Number of signatures successfully Verified\s*:\s*(\d+)\s*$'
                  warnings = '(?im)^\s*Number of warnings\s*:\s*(\d+)\s*$'
                  errors   = '(?im)^\s*Number of errors\s*:\s*(\d+)\s*$'
                }
                foreach ($key in @($patterns.Keys)) {
                  $match = [regex]::Matches($signtoolOutput, $patterns[$key])
                  if ($match.Count -ne 1) { Add-Failure ('signtool printed no single readable ' + $key + ' count') }
                  else { $counts[$key] = [int]$match[0].Groups[1].Value }
                }
                if ($null -ne $counts.warnings -and $counts.warnings -ne 0) { Add-Failure ('signtool reported ' + $counts.warnings + ' warning(s)') }
                if ($null -ne $counts.errors -and $counts.errors -ne 0) { Add-Failure ('signtool reported ' + $counts.errors + ' error(s)') }
                if ($null -ne $counts.verified -and $counts.verified -ne $files.Count) { Add-Failure ('signtool verified ' + $counts.verified + ' signatures, not ' + $files.Count) }
                $verifiedLines = @([regex]::Matches($signtoolOutput, '(?im)^\s*Successfully verified:\s*(.+?)\s*$') | ForEach-Object { $_.Groups[1].Value })
                foreach ($file in $files) {
                  if (@($verifiedLines | Where-Object { $_ -eq $file }).Count -ne 1) { Add-Failure ('signtool did not report exactly one success for ' + (Split-Path -Leaf $file)) }
                }
                if ($verifiedLines.Count -ne $files.Count) { Add-Failure ('signtool reported ' + $verifiedLines.Count + ' successes for ' + $files.Count + ' files') }
                $signtoolOutput | Set-Content -LiteralPath (Join-Path $evidenceDir 'signtool-output.txt') -Encoding ASCII
              }
            }
          } catch {
            Add-Failure ('the signature proof could not complete: ' + $_.Exception.Message)
          }

          $verdict = if ($failures.Count -eq 0) { 'pass' } else { 'fail' }
          $report = [ordered]@{
            schema_version = 1
            kind = 'independent-signature-verification'
            verdict = $verdict
            failures = @($failures)
            run_id = [string]$env:CFM_RUN_ID; run_attempt = [string]$env:CFM_RUN_ATTEMPT; run_commit = [string]$env:CFM_RUN_COMMIT
            verified_on = 'windows-2025 runner, independently of the job that produced the packages'
            expected_publisher_subject_sha256 = $EXPECTED_PUBLISHER_SUBJECT_SHA256
            publisher_trust = $trustFacts
            timestamp_note = 'timestamp_countersigner_present shows a countersignature exists; it is not independent proof of RFC 3161 format'
            signtool_path = $signtoolPath
            signtool_exit_code = $signtoolExit
            signtool_summary_counts = $counts
            signtool_summary = $signtoolOutput
            occurrences = @($rows)
          }
          if (-not (Test-Path -LiteralPath $evidenceDir)) { New-Item -ItemType Directory -Path $evidenceDir | Out-Null }
          ($report | ConvertTo-Json -Depth 6) | Set-Content -LiteralPath $reportPath -Encoding ASCII
          if ($failures.Count -ne 0) { throw ('independent signature verification did not pass: ' + ($failures -join '; ')) }
          Write-Host ('Independently verified ' + @($rows).Count + ' occurrences on Windows: valid, required publisher, code-signing EKU, countersigned.')

      # EVIDENCE ONLY. The two reports and signtool's own output travel;
      # the extracted streams do not - they are already in the package this job was verifying.
      - name: Publish the independent verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-windows-independent-verification
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
          retention-days: 30

  # ENABLED ON ITS OWN PREDICATE, exactly like the jobs above: only a valid dispatch satisfies its `if:`.
  # It holds contents: read only - no environment, no Pages or contents write, no id-token, no secret
  # and no deployment step - and it can start only after `verify` has SUCCEEDED.
  #
  # WHAT IT PREPARES, AND WHAT IT IS NOT. From this run's finalized review artifact it builds the
  # release-specific public site - the committed page plus the trust overlay the projected helper
  # derives - and a small review manifest binding that built site to this commit, this run and the
  # upstream job-output digests. The result is REVIEW material in a generic artifact of this run. It
  # is NOT an upload-pages-artifact artifact, and the deploy job never takes it. The manifest is a
  # local integrity record: not a signature verification and not a publication receipt. Its digest
  # is this job's output so that the packaging job, and the separately approved deployment after it
  # in the same run, have something outside the artifact to bind the artifact by.
  #
  # The overlay is applied ONLY to a fresh copy of the triggering commit in RUNNER_TEMP. The checkout
  # keeps its committed null `releaseTrust`, and the canonical source-site checks run against a second,
  # unmodified copy before anything is downloaded. Nothing downloaded is executed: the finalized files
  # are data, bound to upstream job outputs and handed to `scripts/release_trust_overlay.py` from the
  # triggering commit - the application's accepted helper, projected byte for byte.
  pages_prepare:
    name: Prepare the release-specific public site for review
    needs: [gate, build, sign, finalize, verify]
    if: (github.event_name == 'workflow_dispatch' && github.repository_id == '1342406426' && github.repository == 'CORPUSfm/CORPUSfm' && github.ref == 'refs/heads/public-signing-candidate')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The digest of the review manifest naming every file of the prepared site. As with the finalized
    # manifest, a checksum travelling inside the artifact would be rewritten with it.
    outputs:
      pages_review_manifest_sha256: ${{ steps.review.outputs.pages_review_manifest_sha256 }}
    steps:
      # The site source and the helper come from the triggering commit; the finalized files come only
      # as data.
      - name: Check out exactly the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove the checkout is the triggering commit and is clean
        shell: bash
        run: |
          set -euo pipefail
          refuse() { echo "  x $1"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || refuse 'the checkout is not the triggering commit'
          [ -z "$(git status --porcelain --untracked-files=all)" ] || refuse 'the checkout is not clean'
          [ -f scripts/release_trust_overlay.py ] && [ ! -L scripts/release_trust_overlay.py ] || refuse 'the projected overlay helper is missing'
          grep -qxF 'export const releaseTrust: ReleaseTrust | null = null;' src/release-trust.ts || refuse 'the committed releaseTrust is not null'
          for path in "$RUNNER_TEMP/pages" "$RUNNER_TEMP/pages-review" "$RUNNER_TEMP/review"; do
            [ ! -e "$path" ] && [ ! -L "$path" ] || refuse "$path already exists"
          done
          echo "Checked out $GITHUB_SHA; releaseTrust is null."

      # No setup action is pinned for this lane, so the runner's own Node.js is used and checked
      # against the engine the site declares. Whether a given runner image satisfies it is unmeasured.
      - name: Check the runner's Node.js against the site's declared engine
        shell: bash
        run: |
          set -euo pipefail
          command -v node >/dev/null && command -v npm >/dev/null || { echo '  x the runner provides no node and npm'; exit 1; }
          python3 - <<'PY'
          import json, re, subprocess, sys

          def refuse(message):
              print(f"  x node engine refused: {message}")
              sys.exit(1)

          engine = str(json.load(open("package.json", encoding="utf-8")).get("engines", {}).get("node", ""))
          floor = re.fullmatch(r">=([0-9]+)\.([0-9]+)\.([0-9]+)", engine)
          if not floor:
              refuse(f"package.json declares an engine this check does not model: {engine!r}")
          found = subprocess.run(["node", "--version"], capture_output=True, text=True, check=True).stdout.strip()
          version = re.fullmatch(r"v([0-9]+)\.([0-9]+)\.([0-9]+)", found)
          if not version:
              refuse(f"node reports an unreadable version: {found!r}")
          if tuple(map(int, version.groups())) < tuple(map(int, floor.groups())):
              refuse(f"node {found} does not satisfy {engine}")
          print(f"node {found} satisfies {engine}.")
          PY

      # Two fresh copies of the triggering commit, in the public repository's own layout, so the
      # established docs generation finds `corpusfm/app/web/docs` beside the site. `canonical` is
      # never overlaid; `overlaid` receives the overlay later.
      - name: Materialize two fresh source copies of the triggering commit
        shell: bash
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/pages"
          mkdir "$pages"
          for copy in canonical overlaid; do
            mkdir "$pages/$copy"
            git archive --format=tar "$GITHUB_SHA" | tar -x -C "$pages/$copy"
          done

      - name: Install the locked site dependencies in both copies
        shell: bash
        run: |
          set -euo pipefail
          for copy in canonical overlaid; do
            (cd "$RUNNER_TEMP/pages/$copy" && npm ci)
          done

      # The committed page, checked exactly as the public site workflow checks it - including the
      # assertion that the committed releaseTrust is null - before any finalized byte exists here.
      - name: Check the canonical source site before any overlay exists
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pages/canonical"
          grep -qxF 'export const releaseTrust: ReleaseTrust | null = null;' src/release-trust.ts || { echo '  x the canonical copy is not null'; exit 1; }
          [ ! -e public/trust ] || { echo '  x the canonical copy already carries trust files'; exit 1; }
          npm test

      - name: Download only this run's finalized review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-finalized-candidate-review
          path: ${{ runner.temp }}/review

      # NOTHING IS READ FOR ITS CONTENT UNTIL IT IS BOUND. The manifest is bound to the finalize job's
      # output and must name the sign job's report; the artifact must be exactly the files the manifest
      # names. Only then are the series and version read, validated, and turned into ONE release
      # directory - which must be the only series and the only version present, so no path is ever
      # chosen by listing or pattern. The helper re-binds every file it reads by itself.
      - name: Bind the finalized review and stage the overlay with the projected helper
        shell: bash
        env:
          CFM_EXPECTED_FINALIZED_MANIFEST_SHA256: ${{ needs.finalize.outputs.finalized_manifest_sha256 }}
          CFM_EXPECTED_SIGNATURE_REPORT_SHA256: ${{ needs.sign.outputs.signature_report_sha256 }}
          CFM_EXPECTED_TRUST_RECORD_SHA256: ${{ needs.sign.outputs.trust_record_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path

          def refuse(message):
              print(f"  x pages preparation refused: {message}")
              sys.exit(1)

          def expected(name):
              value = os.environ.get(name, "")
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  refuse(f"{name} is not a well-formed digest from a job output")
              return value

          manifest_digest = expected("CFM_EXPECTED_FINALIZED_MANIFEST_SHA256")
          report_digest = expected("CFM_EXPECTED_SIGNATURE_REPORT_SHA256")
          trust_digest = expected("CFM_EXPECTED_TRUST_RECORD_SHA256")
          run = {"run_commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                 "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          temp = Path(os.environ["RUNNER_TEMP"])
          review = temp / "review"
          sha = lambda data: hashlib.sha256(data).hexdigest()

          if review.is_symlink() or not review.is_dir():
              refuse("the finalized review artifact did not arrive as a plain directory")
          for path in review.rglob("*"):
              if path.is_symlink() or not (path.is_file() or path.is_dir()):
                  refuse(f"the review artifact carries a link or special file: {path.relative_to(review).as_posix()}")
          manifest_path = review / "finalized-manifest.json"
          if not manifest_path.is_file():
              refuse("the review artifact carries no finalized manifest")
          manifest_bytes = manifest_path.read_bytes()
          if sha(manifest_bytes) != manifest_digest:
              refuse("the finalized manifest is not the one the finalize job produced")
          manifest = json.loads(manifest_bytes.decode("utf-8"))
          if manifest.get("schema_version") != 1 or manifest.get("kind") != "finalized-review-manifest":
              refuse("the finalized manifest is not the expected record")
          for key, value in run.items():
              if str(manifest.get(key)) != value:
                  refuse(f"the finalized manifest {key} is {manifest.get(key)!r}, not this run's {value!r}")
          if manifest.get("signature_report_sha256") != report_digest:
              refuse("the finalized manifest names a different signature report than the sign job emitted")

          series, version = str(manifest.get("installer_series", "")), str(manifest.get("installer_version", ""))
          if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", series):
              refuse(f"the finalized manifest names an unsafe series: {series!r}")
          if not re.fullmatch(r"[0-9]+\.[0-9]+", version):
              refuse(f"the finalized manifest names an unexpected version: {version!r}")
          prefix = f"server/{series}/releases/{version}/"
          if (manifest.get("windows_package") != f"{prefix}corpusfm-installer-windows-{version}.zip"
                  or manifest.get("linux_package") != f"{prefix}corpusfm-installer-linux-{version}.zip"):
              refuse("the finalized manifest does not name the packages its own series and version imply")

          listed = {}
          for row in manifest.get("files") or []:
              path, digest = str(row.get("path", "")), str(row.get("sha256", ""))
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", path) or ".." in path or "//" in path:
                  refuse(f"unsafe manifest path: {path!r}")
              if not re.fullmatch(r"[0-9a-f]{64}", digest) or path in listed:
                  refuse(f"the manifest records no single well-formed digest for {path}")
              listed[path] = (row.get("size"), digest)
          present = {p.relative_to(review).as_posix(): p for p in review.rglob("*") if p.is_file()}
          if set(present) != set(listed) | {"finalized-manifest.json"}:
              refuse(f"the review artifact is not exactly the manifest's files: "
                     f"{sorted(set(present) ^ (set(listed) | {'finalized-manifest.json'}))}")
          for path, (size, digest) in listed.items():
              data = present[path].read_bytes()
              if len(data) != size or sha(data) != digest:
                  refuse(f"{path} is not the bytes the finalized manifest records")
          if listed.get("signature-report.json", (None, ""))[1] != report_digest:
              refuse("the review artifact's signature report is not the one the sign job emitted")

          for parent, only in ((review / "server", series), (review / "server" / series / "releases", version)):
              if parent.is_symlink() or not parent.is_dir() or sorted(p.name for p in parent.iterdir()) != [only]:
                  refuse(f"{parent.relative_to(review).as_posix()} does not hold exactly {only}")
          release = review / "server" / series / "releases" / version

          helper = [sys.executable, "scripts/release_trust_overlay.py",
                    "--release-dir", str(release),
                    "--signature-report", str(review / "signature-report.json"),
                    "--finalized-manifest", str(manifest_path),
                    "--expect-trust-record-sha256", trust_digest,
                    "--expect-signature-report-sha256", report_digest,
                    "--expect-finalized-manifest-sha256", manifest_digest,
                    "--expect-run-id", run["run_id"],
                    "--expect-run-commit", run["run_commit"],
                    "--output-dir", str(temp / "pages" / "overlay")]
          if subprocess.run(helper, check=False).returncode != 0:
              refuse("the projected overlay helper refused the finalized review")
          binding = {"installer_series": series, "installer_version": version, "release_prefix": prefix}
          (temp / "pages" / "binding.json").write_text(json.dumps(binding, sort_keys=True) + "\n", encoding="utf-8")
          print(f"Bound: manifest {manifest_digest[:12]}, report {report_digest[:12]}, trust {trust_digest[:12]}; "
                f"{series} {version}.")
          PY

      # Exactly the staged files, by the names the helper recorded, into the `overlaid` copy only. The
      # helper's own record is checked against what is on disk first: nothing staged goes unnamed.
      - name: Apply the staged overlay to the scratch overlaid copy only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          def refuse(message):
              print(f"  x overlay application refused: {message}")
              sys.exit(1)

          pages = Path(os.environ["RUNNER_TEMP"]) / "pages"
          overlay, site = pages / "overlay", pages / "overlaid"
          sha = lambda data: hashlib.sha256(data).hexdigest()
          record = json.loads((overlay / "overlay-record.json").read_text(encoding="utf-8"))
          staged = record["staged"]
          if len(staged) != 4:
              refuse(f"the helper staged {len(staged)} trust files, not four")
          on_disk = {p.name for p in (overlay / "trust").iterdir()}
          if on_disk != set(staged):
              refuse(f"the staged trust directory is not the helper's record: {sorted(on_disk ^ set(staged))}")
          target = site / "public" / "trust"
          if target.exists() or target.is_symlink() or (site / "dist").exists():
              refuse("the overlaid copy already carries trust files or a build")
          (site / "src" / "release-trust.ts").write_bytes((overlay / "release-trust.ts").read_bytes())
          target.mkdir()
          for name, digest in sorted(staged.items()):
              data = (overlay / "trust" / name).read_bytes()
              if sha(data) != digest:
                  refuse(f"{name} is not the bytes the helper staged")
              (target / name).write_bytes(data)
          print(f"Overlay applied to the overlaid copy: release-trust.ts and {len(staged)} trust files.")
          PY

      - name: Build the release-specific site from the overlaid copy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pages/overlaid"
          npm run build

      # THE BUILT SITE IS REOPENED, not assumed. dist/trust must be exactly the four files, each equal
      # to the helper's staged copy AND to the finalized file the manifest - re-bound here - records.
      # The actual Home component is then rendered from the generated module, as the site's own
      # rendered-HTML test renders it, and its trust links must resolve to those bytes in dist.
      - name: Prove the built site carries exactly the reviewed trust files and links
        shell: bash
        env:
          CFM_EXPECTED_FINALIZED_MANIFEST_SHA256: ${{ needs.finalize.outputs.finalized_manifest_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path

          def refuse(message):
              print(f"  x built-site proof refused: {message}")
              sys.exit(1)

          temp = Path(os.environ["RUNNER_TEMP"])
          pages, review = temp / "pages", temp / "review"
          sha = lambda data: hashlib.sha256(data).hexdigest()
          expected = os.environ.get("CFM_EXPECTED_FINALIZED_MANIFEST_SHA256", "")
          manifest_bytes = (review / "finalized-manifest.json").read_bytes()
          if not re.fullmatch(r"[0-9a-f]{64}", expected) or sha(manifest_bytes) != expected:
              refuse("the finalized manifest is no longer the one the finalize job produced")
          digests = {row["path"]: row["sha256"] for row in json.loads(manifest_bytes)["files"]}
          binding = json.loads((pages / "binding.json").read_text(encoding="utf-8"))
          prefix = binding["release_prefix"]
          staged = json.loads((pages / "overlay" / "overlay-record.json").read_text(encoding="utf-8"))["staged"]
          dist_trust = pages / "overlaid" / "dist" / "trust"
          if dist_trust.is_symlink() or not dist_trust.is_dir():
              refuse("the built site carries no trust directory")
          built = {p.name: p for p in dist_trust.iterdir()}
          if set(built) != set(staged) or len(built) != 4:
              refuse(f"dist/trust is not exactly the four staged files: {sorted(built)}")
          for name, path in sorted(built.items()):
              if path.is_symlink() or not path.is_file():
                  refuse(f"dist/trust/{name} is not a regular file")
              data = path.read_bytes()
              finalized = (review / prefix / name).read_bytes()
              if data != (pages / "overlay" / "trust" / name).read_bytes() or data != finalized:
                  refuse(f"dist/trust/{name} is not the staged and finalized bytes")
              if sha(data) != staged[name] or sha(data) != digests.get(prefix + name):
                  refuse(f"dist/trust/{name} is not the digest the helper and the finalized manifest record")
          print(f"dist/trust: the four finalized trust files, byte for byte, for {binding['installer_version']}.")
          PY
          cd "$RUNNER_TEMP/pages/overlaid"
          node --input-type=module - <<'JS'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import path from "node:path";
          import process from "node:process";
          import { createElement } from "react";
          import { renderToStaticMarkup } from "react-dom/server";
          import { createServer } from "vite";

          const site = process.cwd();
          const dist = path.join(site, "dist");
          const record = JSON.parse(await readFile(path.join(site, "..", "overlay", "overlay-record.json"), "utf8"));
          const values = record.release_trust;
          const sha = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const server = await createServer({
            root: site, appType: "custom", server: { middlewareMode: true }, logLevel: "error",
          });
          try {
            const base = server.config.base;
            const trust = (await server.ssrLoadModule("/src/release-trust.ts")).releaseTrust;
            assert.ok(trust, "the overlaid module must supply releaseTrust");
            assert.equal(trust.version, record.installer_version);
            const home = renderToStaticMarkup(createElement((await server.ssrLoadModule("/src/page.tsx")).default));
            assert.ok(home.includes(`This release — ${values.version}`), "Home must name the bound version");
            assert.ok(home.includes(`<a href="${values.releaseUrl}">`), "Home must link the release");
            assert.ok(home.includes(`<code>${values.signerThumbprint}</code>`), "Home must show the thumbprint");
            assert.ok(home.includes(`<code>${values.installerAsset}</code>`), "Home must name the installer");
            const anchors = [...home.matchAll(/<a href="([^"]+)"><code>([^<]+)<\/code><\/a>/g)];
            for (const [asset, url] of [[values.certificateAsset, values.certificateUrl],
                                        [values.trustRecordAsset, values.trustRecordUrl]]) {
              const hrefs = anchors.filter(([, , label]) => label === asset).map(([, href]) => href);
              assert.deepEqual(hrefs, [`${base}${url}`], `${asset} must be linked once, at its site path`);
              const served = await readFile(path.join(dist, hrefs[0].slice(base.length)));
              assert.equal(sha(served), record.staged[asset], `${asset} in dist must be the staged bytes`);
            }
            assert.match(await readFile(path.join(dist, "index.html"), "utf8"), new RegExp(`${base}assets/index-[^"']+\\.js`));
          } finally {
            await server.close();
          }
          console.log(`Home renders ${values.version} and links both trust files at their site paths.`);
          JS

      # THE REVIEW MANIFEST: this commit and run, the three upstream digests, and every file of the
      # prepared site by relative path, size and SHA-256. Its digest becomes this job's output. It is
      # a local integrity record of what this job built - not a signature verification, not a
      # publication receipt. Hidden files are refused, because the upload would silently drop them.
      - name: Write the Pages review manifest
        id: review
        shell: bash
        env:
          CFM_EXPECTED_FINALIZED_MANIFEST_SHA256: ${{ needs.finalize.outputs.finalized_manifest_sha256 }}
          CFM_EXPECTED_SIGNATURE_REPORT_SHA256: ${{ needs.sign.outputs.signature_report_sha256 }}
          CFM_EXPECTED_TRUST_RECORD_SHA256: ${{ needs.sign.outputs.trust_record_sha256 }}
        run: |
          set -euo pipefail
          [ -z "$(git status --porcelain --untracked-files=all)" ] || { echo '  x the checkout changed during preparation'; exit 1; }
          grep -qxF 'export const releaseTrust: ReleaseTrust | null = null;' src/release-trust.ts || { echo '  x the checkout releaseTrust is no longer null'; exit 1; }
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, sys
          from pathlib import Path

          def refuse(message):
              print(f"  x pages review manifest refused: {message}")
              sys.exit(1)

          temp = Path(os.environ["RUNNER_TEMP"])
          pages, out = temp / "pages", temp / "pages-review"
          sha = lambda data: hashlib.sha256(data).hexdigest()
          upstream = {}
          for key, name in (("finalized_manifest_sha256", "CFM_EXPECTED_FINALIZED_MANIFEST_SHA256"),
                            ("signature_report_sha256", "CFM_EXPECTED_SIGNATURE_REPORT_SHA256"),
                            ("trust_record_sha256", "CFM_EXPECTED_TRUST_RECORD_SHA256")):
              value = os.environ.get(name, "")
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  refuse(f"{name} is not a well-formed digest from a job output")
              upstream[key] = value
          dist = pages / "overlaid" / "dist"
          for path in dist.rglob("*"):
              relative = path.relative_to(dist).as_posix()
              if path.is_symlink() or not (path.is_file() or path.is_dir()):
                  refuse(f"the built site carries a link or special file: {relative}")
              if any(part.startswith(".") for part in path.relative_to(dist).parts):
                  refuse(f"the built site carries a hidden path the upload would drop: {relative}")
          if out.exists() or out.is_symlink():
              refuse("the review output already exists")
          out.mkdir()
          shutil.copytree(dist, out / "dist")
          binding = json.loads((pages / "binding.json").read_text(encoding="utf-8"))
          files = sorted(p for p in (out / "dist").rglob("*") if p.is_file())
          manifest = {
              "schema_version": 1,
              "kind": "pages-review-manifest",
              "statement": "Local integrity record of the prepared site. Not a signature verification, "
                           "not a publication receipt, and not a Pages deployment artifact.",
              "run_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "installer_series": binding["installer_series"],
              "installer_version": binding["installer_version"],
              "upstream": upstream,
              "overlay_record_sha256": sha((pages / "overlay" / "overlay-record.json").read_bytes()),
              "site_root": "dist",
              "files": [{"path": p.relative_to(out / "dist").as_posix(), "size": p.stat().st_size,
                         "sha256": sha(p.read_bytes())} for p in files],
          }
          (out / "pages-review-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                                                          encoding="utf-8")
          print(f"Pages review manifest: {len(files)} site files, {binding['installer_version']}, run {manifest['run_id']}.")
          PY
          digest="$(sha256sum "$RUNNER_TEMP/pages-review/pages-review-manifest.json" | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo '  x could not digest the Pages review manifest'; exit 1; }
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ && "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo '  x the runner supplied no well-formed run identity'; exit 1; }
          echo "pages_review_manifest_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "CFM-DIGEST pages_review_manifest_sha256=$digest run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT commit=$GITHUB_SHA"

      # REVIEW MATERIAL ONLY. A generic artifact of this run - NOT an upload-pages-artifact artifact -
      # and the deploy job never takes it.
      - name: Retain the prepared site for review (not a Pages deployment artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-release-pages-review
          path: ${{ runner.temp }}/pages-review
          if-no-files-found: error
          retention-days: 30

  # ENABLED ON ITS OWN PREDICATE, like every job after `build`: only a valid dispatch satisfies its
  # `if:`. It runs before any Pages approval and deploys nothing: it holds contents: read only - no
  # environment, no Pages or contents write, no id-token, no secret, no deployment and no share of the
  # `pages` concurrency group. What it leaves is this run's UNDEPLOYED Pages artifact, for review.
  #
  # WHAT IT DOES. It turns the reviewed site `pages_prepare` built in THIS run into the one Pages
  # artifact the deploy job may take, without rebuilding or re-deriving anything. The review manifest
  # is bound to `pages_prepare`'s job output before a single field is read, and its three upstream
  # digests must equal the sign and finalize jobs' own outputs - never a file travelling beside them.
  # The artifact must then be exactly the manifest plus the inventoried `dist/`, byte for byte, with
  # the four trust files named by the bound version and the bound trust record. Only that verified
  # `dist/` is handed to the official Pages uploader, under the one fixed name this workflow gives a
  # single producer.
  #
  # THE UPLOADER'S OWN ARCHIVE IS REOPENED before this job may succeed. The composite writes
  # RUNNER_TEMP/artifact.tar and uploads it with its own pinned uploader; this job compares that TAR,
  # entry by entry, to the bound inventory. That proves what was packaged locally - not that the
  # transport or a deployment succeeded. The upload has already happened when the proof runs, so a
  # failed proof leaves an artifact behind; what it prevents is the deploy job, which needs this one.
  pages_package:
    name: Bind the prepared site and package it for Pages (undeployed)
    needs: [gate, build, sign, finalize, verify, pages_prepare]
    if: (github.event_name == 'workflow_dispatch' && github.repository_id == '1342406426' && github.repository == 'CORPUSfm/CORPUSfm' && github.ref == 'refs/heads/public-signing-candidate')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Review evidence for the deploy job and for people: the official uploader exposes only an
    # artifact id; the TAR digest is this job's own measurement of the audited archive; the manifest
    # digest is the binding this job re-checked. None of them is an input the deploy action consumes.
    outputs:
      pages_artifact_id: ${{ steps.package.outputs.artifact_id }}
      pages_tar_sha256: ${{ steps.archive.outputs.pages_tar_sha256 }}
      pages_review_manifest_sha256: ${{ steps.bind.outputs.pages_review_manifest_sha256 }}
    steps:
      - name: Refuse stale packaging locations
        shell: bash
        run: |
          set -euo pipefail
          for path in "$RUNNER_TEMP/pages-review" "$RUNNER_TEMP/artifact.tar"; do
            [ ! -e "$path" ] && [ ! -L "$path" ] || { echo "  x $path already exists"; exit 1; }
          done

      - name: Download only this run's prepared Pages review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: public-release-pages-review
          path: ${{ runner.temp }}/pages-review

      # NOTHING IS READ FOR ITS CONTENT UNTIL IT IS BOUND, and no file of the artifact vouches for
      # another: every expectation comes from a job output or from the bound manifest.
      - name: Bind the prepared site to its job outputs
        id: bind
        shell: bash
        env:
          CFM_EXPECTED_PAGES_REVIEW_MANIFEST_SHA256: ${{ needs.pages_prepare.outputs.pages_review_manifest_sha256 }}
          CFM_EXPECTED_FINALIZED_MANIFEST_SHA256: ${{ needs.finalize.outputs.finalized_manifest_sha256 }}
          CFM_EXPECTED_SIGNATURE_REPORT_SHA256: ${{ needs.sign.outputs.signature_report_sha256 }}
          CFM_EXPECTED_TRUST_RECORD_SHA256: ${{ needs.sign.outputs.trust_record_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path

          def refuse(message):
              print(f"  x pages packaging refused: {message}")
              sys.exit(1)

          def expected(name):
              value = os.environ.get(name, "")
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  refuse(f"{name} is not a well-formed digest from a job output")
              return value

          manifest_digest = expected("CFM_EXPECTED_PAGES_REVIEW_MANIFEST_SHA256")
          upstream = {"finalized_manifest_sha256": expected("CFM_EXPECTED_FINALIZED_MANIFEST_SHA256"),
                      "signature_report_sha256": expected("CFM_EXPECTED_SIGNATURE_REPORT_SHA256"),
                      "trust_record_sha256": expected("CFM_EXPECTED_TRUST_RECORD_SHA256")}
          run = {"run_commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                 "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          review = Path(os.environ["RUNNER_TEMP"]) / "pages-review"
          sha = lambda data: hashlib.sha256(data).hexdigest()

          if review.is_symlink() or not review.is_dir():
              refuse("the prepared Pages review did not arrive as a plain directory")
          for path in review.rglob("*"):
              if path.is_symlink() or not (path.is_file() or path.is_dir()):
                  refuse(f"the review carries a link or special file: {path.relative_to(review).as_posix()}")
          manifest_path = review / "pages-review-manifest.json"
          if not manifest_path.is_file():
              refuse("the review carries no Pages review manifest")
          manifest_bytes = manifest_path.read_bytes()
          if sha(manifest_bytes) != manifest_digest:
              refuse("the Pages review manifest is not the one the preparation job produced")
          manifest = json.loads(manifest_bytes.decode("utf-8"))
          if (manifest.get("schema_version"), manifest.get("kind"), manifest.get("site_root")) != (1, "pages-review-manifest", "dist"):
              refuse("the Pages review manifest is not the expected record")
          for key, value in run.items():
              if str(manifest.get(key)) != value:
                  refuse(f"the Pages review manifest {key} is {manifest.get(key)!r}, not this run's {value!r}")
          if manifest.get("upstream") != upstream:
              refuse("the Pages review manifest names upstream digests other than the sign and finalize jobs emitted")
          series, version = str(manifest.get("installer_series", "")), str(manifest.get("installer_version", ""))
          if not re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", series) or not re.fullmatch(r"0\.[0-9]+", version):
              refuse(f"the Pages review manifest names an unsafe series or version: {series!r} {version!r}")
          if not re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("overlay_record_sha256", ""))):
              refuse("the Pages review manifest records no overlay digest")

          listed, folded = {}, set()
          for row in manifest.get("files") or []:
              path, digest, size = str(row.get("path", "")), str(row.get("sha256", "")), row.get("size")
              parts = path.split("/")
              if (not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9._/-]*", path) or "" in parts or ".." in parts
                      or any(part.startswith(".") for part in parts)):
                  refuse(f"unsafe or hidden site path: {path!r}")
              if not re.fullmatch(r"[0-9a-f]{64}", digest) or not isinstance(size, int) or size < 0:
                  refuse(f"the manifest records no well-formed size and digest for {path}")
              if path in listed or path.casefold() in folded:
                  refuse(f"the manifest lists {path} more than once, case included")
              listed[path] = (size, digest)
              folded.add(path.casefold())
          if not listed:
              refuse("the Pages review manifest inventories no site files")
          present = {p.relative_to(review).as_posix(): p for p in review.rglob("*") if p.is_file()}
          wanted = {f"dist/{path}" for path in listed} | {"pages-review-manifest.json"}
          if set(present) != wanted:
              refuse(f"the review is not exactly the manifest and its site: {sorted(set(present) ^ wanted)}")
          if sorted(p.name for p in review.iterdir()) != ["dist", "pages-review-manifest.json"]:
              refuse("the review carries top-level entries other than dist/ and its manifest")
          for path, (size, digest) in listed.items():
              data = present[f"dist/{path}"].read_bytes()
              if len(data) != size or sha(data) != digest:
                  refuse(f"dist/{path} is not the bytes the Pages review manifest records")

          trust_name = f"corpusfm-installer-windows-{version}.trust.json"
          trust_bytes = (review / "dist" / "trust" / trust_name).read_bytes() if f"trust/{trust_name}" in listed else b""
          if sha(trust_bytes) != upstream["trust_record_sha256"]:
              refuse("the site's trust record is not the one the sign job emitted")
          trust = json.loads(trust_bytes.decode("ascii"))
          thumbprint = str(trust.get("signer_thumbprint", ""))
          if not re.fullmatch(r"[0-9A-F]{40}", thumbprint):
              refuse(f"the trust record carries no uppercase SHA-1 leaf thumbprint: {thumbprint!r}")
          leaf_name = f"corpusfm-signing-leaf-{thumbprint}.cer"
          trust_files = {path.removeprefix("trust/") for path in listed if path.startswith("trust/")}
          if trust_files != {trust_name, leaf_name, trust_name + ".sha256", leaf_name + ".sha256"}:
              refuse(f"the site does not carry exactly the four trust files: {sorted(trust_files)}")
          leaf_bytes = (review / "dist" / "trust" / leaf_name).read_bytes()
          if sha(leaf_bytes) != trust.get("leaf_der_sha256"):
              refuse("the site's signing leaf is not the certificate the trust record describes")
          for name, data in ((trust_name, trust_bytes), (leaf_name, leaf_bytes)):
              if (review / "dist" / "trust" / (name + ".sha256")).read_bytes() != f"{sha(data)}  {name}\n".encode("ascii"):
                  refuse(f"{name}.sha256 does not describe {name}")
          print(f"Bound: Pages review {manifest_digest[:12]}, {len(listed)} site files, {series} {version}.")
          PY
          echo "pages_review_manifest_sha256=$CFM_EXPECTED_PAGES_REVIEW_MANIFEST_SHA256" >> "$GITHUB_OUTPUT"

      # The official composite: it archives ONLY the verified dist/ with its own pinned tar invocation
      # and uploads that archive with its own pinned uploader. Hidden files are already refused above.
      - name: Package the verified site with the official Pages uploader
        id: package
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: public-release-pages
          path: ${{ runner.temp }}/pages-review/dist
          retention-days: 30
          include-hidden-files: false

      # THE PACKAGED ARCHIVE IS NOT ASSUMED. Every entry of the uploader's own TAR is compared with the
      # bound inventory: directories are allowed only as the root or an ancestor of a listed file,
      # a leading `./` is ordinary, and a duplicate normalized name, a link, a special file, an unlisted
      # or missing file, or different bytes refuses. Nothing is extracted.
      - name: Prove the packaged archive is exactly the bound site
        id: archive
        shell: bash
        env:
          CFM_EXPECTED_PAGES_REVIEW_MANIFEST_SHA256: ${{ needs.pages_prepare.outputs.pages_review_manifest_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, sys, tarfile
          from pathlib import Path, PurePosixPath

          def refuse(message):
              print(f"  x pages archive refused: {message}")
              sys.exit(1)

          temp = Path(os.environ["RUNNER_TEMP"])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          expected = os.environ.get("CFM_EXPECTED_PAGES_REVIEW_MANIFEST_SHA256", "")
          manifest_bytes = (temp / "pages-review" / "pages-review-manifest.json").read_bytes()
          if not re.fullmatch(r"[0-9a-f]{64}", expected) or sha(manifest_bytes) != expected:
              refuse("the Pages review manifest is no longer the one the preparation job produced")
          listed = {row["path"]: (row["size"], row["sha256"]) for row in json.loads(manifest_bytes)["files"]}
          ancestors = {str(parent) for path in listed for parent in PurePosixPath(path).parents if str(parent) != "."}
          archive = temp / "artifact.tar"
          if archive.is_symlink() or not archive.is_file():
              refuse("the official uploader left no artifact.tar")
          seen = set()
          with tarfile.open(archive, mode="r:") as bundle:
              for member in bundle.getmembers():
                  raw = member.name
                  while raw.startswith("./"):
                      raw = raw[2:]
                  name = raw.rstrip("/") if member.isdir() else raw
                  if name in ("", "."):
                      if not member.isdir():
                          refuse(f"the archive root entry {member.name!r} is not a directory")
                      continue
                  parts = name.split("/")
                  if name.startswith("/") or "" in parts or "." in parts or ".." in parts:
                      refuse(f"the archive carries an unsafe name: {member.name!r}")
                  if name in seen:
                      refuse(f"the archive carries {name} more than once")
                  seen.add(name)
                  if member.isdir():
                      if name not in ancestors:
                          refuse(f"the archive carries an unexpected directory: {name}")
                      continue
                  if not member.isfile():
                      refuse(f"the archive carries a link or special entry: {name}")
                  if name not in listed:
                      refuse(f"the archive carries an unlisted file: {name}")
                  data = bundle.extractfile(member).read()
                  if (len(data), sha(data)) != listed[name]:
                      refuse(f"the archive's {name} is not the bytes the Pages review manifest records")
          missing = sorted(set(listed) - seen)
          if missing:
              refuse(f"the archive is missing {missing}")
          print(f"Archive proved: {len(listed)} files, exactly the bound site.")
          PY
          digest="$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo '  x could not digest the packaged archive'; exit 1; }
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ && "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo '  x the runner supplied no well-formed run identity'; exit 1; }
          echo "pages_tar_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "CFM-DIGEST pages_tar_sha256=$digest run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT commit=$GITHUB_SHA"

  # ENABLED, AND HELD BY ITS PROTECTED ENVIRONMENT. Only a valid dispatch satisfies its `if:`, and it
  # then waits for a reviewer to approve `github-pages` - the release's Pages approval, separate from
  # and never implied by the signing approval. It is the ONLY job with pages: write, which the official
  # deploy action needs together with id-token: write; beyond those it holds contents: read. The
  # deploy-only `pages` group never cancels a deployment in progress. Declaring the environment here
  # creates no environment, protection rule or setting; those are configured, and evidenced, elsewhere.
  #
  # THE CHAIN, stated honestly. The reviewed bytes are bound in `pages_package`, packaged there by the
  # pinned official uploader, and proved from its own archive; this job runs only if that job
  # SUCCEEDED. The deploy action takes no artifact id, digest, run or repository: it lists the
  # artifacts of THIS workflow run, requires exactly one named `public-release-pages`, and deploys it.
  # One fixed name with one producer is therefore the whole selection. The outputs checked below are
  # evidence that the producing job succeeded - not values the action consumes. GitHub's artifact
  # transport and the deployment itself are unmeasured. Nothing here publishes a release or moves
  # `main` or Latest.
  pages_deploy:
    name: Deploy the reviewed release site to GitHub Pages (awaits the github-pages approval)
    needs: [gate, build, sign, finalize, verify, pages_prepare, pages_package]
    if: (github.event_name == 'workflow_dispatch' && github.repository_id == '1342406426' && github.repository == 'CORPUSfm/CORPUSfm' && github.ref == 'refs/heads/public-signing-candidate')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Require the packaging job's evidence
        shell: bash
        env:
          CFM_PAGES_ARTIFACT_ID: ${{ needs.pages_package.outputs.pages_artifact_id }}
          CFM_PAGES_TAR_SHA256: ${{ needs.pages_package.outputs.pages_tar_sha256 }}
          CFM_PAGES_REVIEW_MANIFEST_SHA256: ${{ needs.pages_package.outputs.pages_review_manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CFM_PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo '  x the packaging job reported no artifact id'; exit 1; }
          [[ "$CFM_PAGES_TAR_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '  x the packaging job reported no archive digest'; exit 1; }
          [[ "$CFM_PAGES_REVIEW_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '  x the packaging job reported no review binding'; exit 1; }
          echo "Packaged: artifact $CFM_PAGES_ARTIFACT_ID, archive ${CFM_PAGES_TAR_SHA256:0:12}, review ${CFM_PAGES_REVIEW_MANIFEST_SHA256:0:12}."

      - name: Deploy the sole same-run Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: public-release-pages
