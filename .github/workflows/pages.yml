name: Publish public site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: >-
          Type deploy-current-source to publish this source. This replaces the current page,
          including any release-specific trust information.
        required: true
        default: build-only

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published source
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify the site
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'deploy-current-source'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
